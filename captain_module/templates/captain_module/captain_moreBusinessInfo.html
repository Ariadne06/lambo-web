{% extends 'base_captain.html' %}

{% block title %}
    Business Information
{% endblock %}

{% block content %}
<div class="p-6 bg-white rounded-md shadow-md">
  <form>
    <div class="flex flex-row justify-between space-x-6">

      <!-- Owner's Data -->
      <div class="flex-1">
        <h2 class="text-lg font-semibold text-gray-800 mb-4">Owner's Data</h2>

        <label class="block text-sm font-medium">First Name</label>
        <input type="text" value="Adrianne" class="w-full mb-3 border border-gray-300 rounded-md px-3 py-2 shadow-sm" />

        <label class="block text-sm font-medium">Middle Name</label>
        <input type="text" value="Villarta" class="w-full mb-3 border border-gray-300 rounded-md px-3 py-2 shadow-sm" />

        <label class="block text-sm font-medium">Last Name</label>
        <input type="text" value="Medalla" class="w-full mb-3 border border-gray-300 rounded-md px-3 py-2 shadow-sm" />

        <label class="block text-sm font-medium">Date of Birth</label>
        <input type="text" value="01/01/2000" class="w-full mb-3 border border-gray-300 rounded-md px-3 py-2 shadow-sm" />

        <label class="block text-sm font-medium">Sex</label>
        <input type="text" value="Male" class="w-full mb-3 border border-gray-300 rounded-md px-3 py-2 shadow-sm" />

        <label class="block text-sm font-medium">Resident Status</label>
        <input type="text" value="Non-Resident" class="w-full border border-gray-300 rounded-md px-3 py-2 shadow-sm" />
      </div>

      <!-- Business Data -->
      <div class="flex-1">
        <h2 class="text-lg font-semibold text-gray-800 mb-4">Business Data</h2>

        <label class="block text-sm font-medium">Business Name</label>
        <input type="text" value="Adriane Store" class="w-full mb-3 border border-gray-300 rounded-md px-3 py-2 shadow-sm" />

        <label class="block text-sm font-medium">Business Type</label>
        <input type="text" value="Sari-sari Store" class="w-full mb-3 border border-gray-300 rounded-md px-3 py-2 shadow-sm" />

        <label class="block text-sm font-medium">Contact Number</label>
        <input type="text" value="09672652706" class="w-full mb-3 border border-gray-300 rounded-md px-3 py-2 shadow-sm" />

        <label class="block text-sm font-medium">Business Status</label>
        <input type="text" value="Active" class="w-full border border-gray-300 rounded-md px-3 py-2 shadow-sm" />
      </div>

      <!-- Business Address -->
      <div class="flex-1">
        <h2 class="text-lg font-semibold text-gray-800 mb-4">Business Address</h2>

        <label class="block text-sm font-medium">House Number</label>
        <input type="text" value="Block 5" class="w-full mb-3 border border-gray-300 rounded-md px-3 py-2 shadow-sm" />

        <label class="block text-sm font-medium">Street</label>
        <input type="text" value="Sampaguita Street" class="w-full mb-3 border border-gray-300 rounded-md px-3 py-2 shadow-sm" />

        <label class="block text-sm font-medium">Sitio</label>
        <input type="text" value="Sitio 5" class="w-full mb-3 border border-gray-300 rounded-md px-3 py-2 shadow-sm" />

        <label class="block text-sm font-medium">City</label>
        <input type="text" value="Consolacion" class="w-full mb-3 border border-gray-300 rounded-md px-3 py-2 shadow-sm" />

        <label class="block text-sm font-medium">Province</label>
        <input type="text" value="Cebu" class="w-full mb-3 border border-gray-300 rounded-md px-3 py-2 shadow-sm" />

        <label class="block text-sm font-medium">Country</label>
        <input type="text" value="Philippines" class="w-full border border-gray-300 rounded-md px-3 py-2 shadow-sm" />
      </div>

    </div>
  </form>

  <!-- Back Button -->
  <div class="mt-9">
    <button class="bg-red-600 text-white px-6 py-2 rounded hover:bg-red-700">Back</button>
  </div>
</div>
{% endblock %}
