{% extends 'base_captain.html' %}

{% block title %}
    Resident Information
{% endblock %}

{% block content %}
<div class="min-h-screen bg-gray-100 py-10 px-6">
    <div class="max-w-6xl mx-auto bg-white shadow-lg rounded-xl p-10">

        <!-- Header -->
        <h2 class="text-3xl font-semibold text-red-700 mb-10 text-center md:text-left">
            Resident Profile
        </h2>

        <!-- Profile Section -->
        <div class="flex flex-col md:flex-row gap-10">

            <!-- Profile Image -->
            <div class="flex justify-center md:justify-start">
                <div class="w-40 h-40 rounded-md border-4 border-blue-500 overflow-hidden">
                    <img src="/static/images/avatar.png" alt="Profile Picture" class="object-cover w-full h-full">
                </div>
            </div>

            <!-- Info Fields -->
            <div class="flex-1 bg-gray-50 rounded-lg p-6 shadow-inner">
                <div class="grid grid-cols-1 md:grid-cols-2 gap-x-48 gap-y-6 border-l border-gray-300 pl-6">

                    <!-- Left Column -->
                    <div class="flex flex-col">
                        <label class="form-label">First Name</label>
                        <input type="text" value="Adriane" disabled class="form-field">
                    </div>
                    <div class="flex flex-col">
                        <label class="form-label">House Number</label>
                        <input type="text" value="Block 5 Lot 11" disabled class="form-field">
                    </div>

                    <div class="flex flex-col">
                        <label class="form-label">Middle Name</label>
                        <input type="text" value="Medalla" disabled class="form-field">
                    </div>
                    <div class="flex flex-col">
                        <label class="form-label">Street</label>
                        <input type="text" value="Washington Street" disabled class="form-field">
                    </div>

                    <div class="flex flex-col">
                        <label class="form-label">Last Name</label>
                        <input type="text" value="Villarta" disabled class="form-field">
                    </div>
                    <div class="flex flex-col">
                        <label class="form-label">Barangay</label>
                        <input type="text" value="Cansaga" disabled class="form-field">
                    </div>

                    <div class="flex flex-col">
                        <label class="form-label">Date of Birth</label>
                        <input type="text" value="01/01/2000" disabled class="form-field">
                    </div>
                    <div class="flex flex-col">
                        <label class="form-label">Resident Status</label>
                        <input type="text" value="Permanent" disabled class="form-field">
                    </div>

                    <div class="flex flex-col">
                        <label class="form-label">Sex</label>
                        <input type="text" value="Male" disabled class="form-field">
                    </div>
                    <div class="flex flex-col">
                        <label class="form-label">Religion</label>
                        <input type="text" value="Catholic" disabled class="form-field">
                    </div>

                    <div class="flex flex-col">
                        <label class="form-label">Educational Attainment</label>
                        <input type="text" value="College Graduate" disabled class="form-field">
                    </div>
                    <div class="flex flex-col">
                        <label class="form-label">Civil Status</label>
                        <input type="text" value="Married" disabled class="form-field">
                    </div>

                </div>
            </div>
        </div>

        <!-- Back Button -->
        <div class="flex justify-end mt-10">
            <a href="#" class="bg-red-600 hover:bg-red-700 text-white text-sm font-medium px-6 py-2 rounded shadow">
                Back
            </a>
        </div>
    </div>
</div>

<!-- Tailwind Helper Styles -->
<style>
    .form-label {
        @apply text-sm font-medium text-gray-700 mb-1;
    }
    .form-field {
        @apply w-full bg-white border border-gray-300 rounded px-3 py-2 text-sm shadow-sm focus:outline-none;
    }
</style>
{% endblock %}
