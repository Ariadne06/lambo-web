{% extends 'base_captain.html' %}

{% block title %}
    Captain
{% endblock %}

{% block content %}
    <div class="flex flex-col min-h-screen bg-gray-100 p-6">

    <!-- Page Title -->
    <h1 class="text-2xl font-bold text-red-700 mb-6">Resident List</h1>

    <!-- Card -->
    <div class="bg-white shadow-md rounded-lg p-6">

        <!-- Search and Filters -->
        <div class="flex justify-between items-center mb-4 flex-wrap gap-2">
            <div class="relative w-full max-w-sm">
                <input type="text" placeholder="Search Resident"
                    class="w-full bg-gray-100 h-10 px-4 pr-10 rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-red-500">
                <span class="absolute right-3 top-2.5 text-gray-500">
                    <svg class="h-4 w-4" viewBox="0 0 20 20" fill="currentColor">
                        <path
                            d="M12.9 14.32a8 8 0 111.414-1.414l4.387 4.387-1.414 1.414-4.387-4.387zM8 14a6 6 0 100-12 6 6 0 000 12z" />
                    </svg>
                </span>
            </div>
            <button class="text-sm text-gray-600 hover:underline flex items-center gap-1">
                <svg class="h-4 w-4" fill="currentColor" viewBox="0 0 20 20">
                    <path
                        d="M3 5h14a1 1 0 100-2H3a1 1 0 000 2zm0 6h10a1 1 0 100-2H3a1 1 0 000 2zm0 6h6a1 1 0 100-2H3a1 1 0 000 2z" />
                </svg>
                Advanced Filters
            </button>
        </div>

        <!-- Table -->
        <div class="overflow-x-auto">
            <table class="min-w-full table-auto text-sm text-left border border-gray-300">
                <thead class="bg-gray-200 text-gray-800 font-semibold">
                    <tr>
                        <th class="py-2 px-4 border">Resident ID</th>
                        <th class="py-2 px-4 border">First Name</th>
                        <th class="py-2 px-4 border">M.I</th>
                        <th class="py-2 px-4 border">Last Name</th>
                        <th class="py-2 px-4 border">Date of Birth</th>
                        <th class="py-2 px-4 border">Sex</th>
                        <th class="py-2 px-4 border">Religion</th>
                        <th class="py-2 px-4 border">Status</th>
                        <th class="py-2 px-4 border text-center">Action</th>
                    </tr>
                </thead>
                <tbody class="text-gray-700">
                    <!-- Example rows -->
                    <tr class="hover:bg-gray-50">
                        <td class="py-2 px-4 border">1000</td>
                        <td class="py-2 px-4 border">Adrianne</td>
                        <td class="py-2 px-4 border">C.</td>
                        <td class="py-2 px-4 border">Villarta</td>
                        <td class="py-2 px-4 border">08/08/2028</td>
                        <td class="py-2 px-4 border">Male</td>
                        <td class="py-2 px-4 border">Catholic</td>
                        <td class="py-2 px-4 border">Single</td>
                        <td class="py-2 px-4 border text-center">
                            <button class="text-black hover:text-red-600">
                                &#x22EE;
                            </button>
                        </td>
                    </tr>
                    <!-- Add more static rows or loop here -->
                </tbody>
            </table>
        </div>

        <!-- Pagination -->
        <div class="mt-4 text-center text-sm text-gray-600">
            <span class="px-2">1</span>
            <span class="px-2">2</span>
            <span class="px-2">3</span>
            <span class="px-2">4</span>
            <span class="px-2">5</span>
            <span class="px-2">6</span>
            <span class="px-2">7</span>
            <span class="px-2">…</span>
            <span class="px-2">60</span>
        </div>
    </div>

    <!-- Fixed Red Button -->
    <div class="flex justify-end mt-6">
        <button class="bg-red-600 text-white text-sm font-medium px-6 py-2 rounded hover:bg-red-700 transition">
            Resident List
        </button>
    </div>
</div>

{% endblock %}
