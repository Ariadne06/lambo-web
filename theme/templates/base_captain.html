{% load static tailwind_tags %}

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <title>{% block title %}Captain{% endblock %}</title>
  {% tailwind_css %}
</head>
<body class="bg-gray-100 min-h-screen font-[Poppins]">
  <!-- Sidebar (fixed, same structure as the first file) -->
  <nav id="sidebar" class="fixed inset-y-0 left-0 w-64 bg-[#D10000] text-white flex flex-col shadow-lg">
    <!-- Logo -->
    <div class="flex items-center justify-center flex-col py-6 border-b border-red-400/40">
      <img src="{% static 'images/brgylogo.jpg' %}" alt="Logo" class="w-20 h-20 rounded-full shadow-lg border-4 border-white">
      <span class="mt-3 text-lg font-semibold tracking-wide">Barangay Cansaga</span>
    </div>

    <!-- Nav links (scrollable area) -->
<div class="flex-1 overflow-y-auto px-3 py-6 space-y-1">
  <!-- Dashboard -->
  <a href="{% url 'captain_module:captain_dashboard' %}"
     class="flex items-center gap-3 px-4 py-3 rounded-lg transition
            {% if request.resolver_match.url_name == 'captain_dashboard' %}
              bg-white text-red-700 font-semibold shadow-sm
            {% else %}
              hover:bg-red-800/80
            {% endif %}">
    <img src="{% static 'images/dashboard.svg' %}" alt="Dashboard Icon"
         class="h-5 w-5
                {% if request.resolver_match.url_name == 'captain_dashboard' %} invert {% endif %}">
    <span>Dashboard</span>
  </a>

  <!-- View Resident -->
  <a href="{% url 'captain_module:captain_viewResident' %}"
     class="flex items-center gap-3 px-4 py-3 rounded-lg transition
            {% if request.resolver_match.url_name == 'captain_viewResident' %}
              bg-white text-red-700 font-semibold shadow-sm
            {% else %}
              hover:bg-red-800/80
            {% endif %}">
    <img src="" alt="Resident Icon"
         class="h-5 w-5
                {% if request.resolver_match.url_name == 'captain_viewResident' %} invert {% endif %}">
    <span>View Resident</span>
  </a>

  <!-- View Household -->
  <a href="{% url 'captain_module:captain_householdList' %}"
     class="flex items-center gap-3 px-4 py-3 rounded-lg transition
            {% if request.resolver_match.url_name == 'captain_householdList' %}
              bg-white text-red-700 font-semibold shadow-sm
            {% else %}
              hover:bg-red-800/80
            {% endif %}">
    <img src="{% static 'images/logs.svg' %}" alt="Household Icon"
         class="h-5 w-5
                {% if request.resolver_match.url_name == 'captain_householdList' %} invert {% endif %}">
    <span>View Household</span>
  </a>

  <!-- View Business -->
  <a href="{% url 'captain_module:captain_businessList' %}"
     class="flex items-center gap-3 px-4 py-3 rounded-lg transition
            {% if request.resolver_match.url_name == 'captain_businessList' %}
              bg-white text-red-700 font-semibold shadow-sm
            {% else %}
              hover:bg-red-800/80
            {% endif %}">
    <img src="{% static 'images/logs.svg' %}" alt="Business Icon"
         class="h-5 w-5
                {% if request.resolver_match.url_name == 'captain_businessList' %} invert {% endif %}">
    <span>View Business</span>
  </a>

  <!-- Personnel Request -->
  <a href="{% url 'captain_module:personnelRequest' %}"
     class="flex items-center gap-3 px-4 py-3 rounded-lg transition
            {% if request.resolver_match.url_name == 'personnelRequest' %}
              bg-white text-red-700 font-semibold shadow-sm
            {% else %}
              hover:bg-red-800/80
            {% endif %}">
    <img src="{% static 'images/logs.svg' %}" alt="Request Icon"
         class="h-5 w-5
                {% if request.resolver_match.url_name == 'personnelRequest' %} invert {% endif %}">
    <span>Personnel Request</span>
  </a>
</div>


    <!-- Footer (username/role + visible logout button) -->
    <div class="px-6 py-4 border-t border-red-400/40">
      <div class="flex items-center justify-between">
        <div class="min-w-0">
          <p class="text-sm font-semibold truncate">{{ request.session.username }}</p>
          <p class="text-xs text-red-200 truncate">{{ request.session.role_name }}</p>
        </div>

        <a href="{% url 'authentication:logout' %}"
           class="ml-3 flex items-center gap-2 px-3 py-2 rounded-md bg-red-900 text-white font-medium
                  hover:bg-red-800 ring-1 ring-white/20 transition">
          <img src="{% static 'images/logout-white.svg' %}" alt="Logout" class="h-4 w-4">
          <span class="text-xs">Logout</span>
        </a>
      </div>
    </div>
  </nav>

  <!-- Main content (shifted right by the fixed sidebar) -->
  <div class="ml-64 min-h-screen">
    <div class="p-6">
      {% block content %}
      <!-- Page-specific content goes here -->
      {% endblock %}
    </div>
  </div>

<script>
// Simple accordion wiring (unchanged)
const ACCORDION = [
  { btn: 'submenu-toggle', panel: 'submenu', arrow: 'submenu-arrow' },
  { btn: 'logs-toggle',    panel: 'logs-submenu', arrow: 'logs-arrow' },
];
function getEl(id){ return document.getElementById(id); }
function closeItem(item){
  const panel = getEl(item.panel), arrow = getEl(item.arrow), btn = getEl(item.btn);
  if (!panel) return;
  panel.classList.add('hidden');
  arrow?.classList.remove('rotate-180');
  btn?.setAttribute('aria-expanded', 'false');
}
function openItem(item){
  const panel = getEl(item.panel), arrow = getEl(item.arrow), btn = getEl(item.btn);
  if (!panel) return;
  panel.classList.remove('hidden');
  arrow?.classList.add('rotate-180');
  btn?.setAttribute('aria-expanded', 'true');
}
ACCORDION.forEach((item) => {
  const btn = getEl(item.btn), panel = getEl(item.panel);
  if (btn && panel) {
    const isOpen = !panel.classList.contains('hidden');
    btn.setAttribute('aria-expanded', isOpen ? 'true' : 'false');
    btn.setAttribute('aria-controls', item.panel);
  }
  btn?.addEventListener('click', () => {
    const open = !getEl(item.panel).classList.contains('hidden');
    if (open) { closeItem(item); }
    else { ACCORDION.forEach(other => { if (other !== item) closeItem(other); }); openItem(item); }
  });
});

// Idle + tab close + safe manual logout (Option A: no ping on unload)
(function () {
  const IDLE_LIMIT_MS = 5 * 60 * 1000; // 5 minutes
  const LOGOUT_URL    = "{% url 'authentication:logout' %}";
  const TAB_CLOSE_URL = "{% url 'authentication:silent_logout' %}"; // still used for cross-tab cleanup

  const TAB_FLAG       = 'tabAuth';
  const CLOSED_KEY     = 'closed_session_token';
  const SESSION_TOKEN  = "{{ request.session.session_token|default:'' }}";
  if (!SESSION_TOKEN) return;

  // --- Manual logout suppression ---
  let suppressClosePing = false;
  try { sessionStorage.removeItem('skipSilent'); } catch(_) {}
  document.getElementById('logout-link')?.addEventListener('click', () => {
    suppressClosePing = true;
    try { sessionStorage.setItem('skipSilent', '1'); } catch(_) {}
  });

  async function pingSilentLogout(token) {
    if (!token) return;
    const body = new URLSearchParams();
    body.set('session_token', token);
    try {
      await fetch(TAB_CLOSE_URL, {
        method: 'POST',
        headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
        body: body.toString(),
        credentials: 'omit',   // NO COOKIES
        keepalive: true,
        cache: 'no-store'
      });
    } catch (_) { /* ignore */ }
  }

  // First load in this tab? Clean foreign leftover token (but not our own)
  if (!sessionStorage.getItem(TAB_FLAG)) {
    sessionStorage.setItem(TAB_FLAG, '1');
    const closedToken = localStorage.getItem(CLOSED_KEY);
    if (closedToken && closedToken !== SESSION_TOKEN) {
      // Only clean up an older/different tab's token
      pingSilentLogout(closedToken);
    }
    try { localStorage.removeItem(CLOSED_KEY); } catch (_) {}
  }

  // On tab/browser close or reload — DO NOT ping here (Option A)
  function handleClose() {
    if (suppressClosePing || sessionStorage.getItem('skipSilent') === '1') return;
    // Stash our token so the next tab load can clean up the previous tab's token
    try { localStorage.setItem(CLOSED_KEY, SESSION_TOKEN); } catch(_) {}
    // IMPORTANT: No pingSilentLogout here to avoid logging out during normal navigation
  }
  addEventListener('pagehide', handleClose);
  addEventListener('beforeunload', handleClose);

  // Idle detection -> go to real logout
  let last = Date.now(), timer;
  function arm() {
    clearTimeout(timer);
    if (document.visibilityState !== 'visible') return;
    timer = setTimeout(() => {
      if (document.visibilityState === 'visible' && Date.now() - last >= IDLE_LIMIT_MS) {
        window.location.replace(LOGOUT_URL);
      }
    }, IDLE_LIMIT_MS + 100);
  }
  function bump(){ last = Date.now(); arm(); }
  ['mousemove','keydown','click','wheel','scroll','touchstart'].forEach(evt =>
    addEventListener(evt, bump, { passive: true })
  );
  addEventListener('visibilitychange', arm, { capture: true });
  arm();
})();
</script>
</body>
</html>
