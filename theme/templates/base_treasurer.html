{% load static tailwind_tags %}
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <title>{% block title %}Treasurer Dashboard{% endblock %}</title>
  {% tailwind_css %}
</head>
<body class="bg-gray-100 min-h-screen font-[Poppins]">
  <!-- Sidebar -->
  <nav id="sidebar" class="fixed inset-y-0 left-0 w-64 bg-[#D10000] text-white flex flex-col shadow-lg">
    <!-- Logo -->
    <div class="flex items-center justify-center flex-col py-6 border-b border-red-400/40">
      <img src="{% static 'images/brgylogo.jpg' %}" alt="Logo" class="w-20 h-20 rounded-full shadow-lg border-4 border-white">
      <span class="mt-3 text-lg font-semibold tracking-wide">Barangay Cansaga</span>
    </div>

    <!-- Nav links -->
    <div class="flex-1 overflow-y-auto px-3 py-6 space-y-1">
            <!-- Dashboard -->
          <a href="{% url 'admin_module:admin_dashboard' %}"
          class="flex items-center gap-3 px-4 py-3 rounded-lg transition
                  {% if request.resolver_match.url_name == 'admin_dashboard' %}
                      bg-white text-red-700 font-semibold shadow-sm
                  {% else %}
                      hover:bg-red-800/80
                  {% endif %}">
          <img 
            src="{% static 'images/dashboard.svg' %}" 
            alt="Dashboard Icon" class="h-5 w-5"
            {% if request.resolver_match.url_name == 'admin_dashboard' %}
              src="{% static 'images/dashboard-red.svg' %}"
            {% endif %}>

          <span>Dashboard</span>
        </a>

        <a href="{% url 'admin_module:admin_dashboard' %}"
          class="flex items-center gap-3 px-4 py-3 rounded-lg transition
                  {% if request.resolver_match.url_name == 'admin_dashboard' %}
                      bg-white text-red-700 font-semibold shadow-sm
                  {% else %}
                      hover:bg-red-800/80
                  {% endif %}">
          <img 
            src="{% static 'images/dashboard.svg' %}" 
            alt="Dashboard Icon" class="h-5 w-5"
            {% if request.resolver_match.url_name == 'admin_dashboard' %}
              src="{% static 'images/dashboard-red.svg' %}"
            {% endif %}>

          <span>Payment</span>
        </a>

        <a href="{% url 'admin_module:admin_dashboard' %}"
          class="flex items-center gap-3 px-4 py-3 rounded-lg transition
                  {% if request.resolver_match.url_name == 'admin_dashboard' %}
                      bg-white text-red-700 font-semibold shadow-sm
                  {% else %}
                      hover:bg-red-800/80
                  {% endif %}">
          <img 
            src="{% static 'images/dashboard.svg' %}" 
            alt="Dashboard Icon" class="h-5 w-5"
            {% if request.resolver_match.url_name == 'admin_dashboard' %}
              src="{% static 'images/dashboard-red.svg' %}"
            {% endif %}>

          <span>Transaction</span>
        </a>

        <a href="{% url 'admin_module:admin_dashboard' %}"
          class="flex items-center gap-3 px-4 py-3 rounded-lg transition
                  {% if request.resolver_match.url_name == 'admin_dashboard' %}
                      bg-white text-red-700 font-semibold shadow-sm
                  {% else %}
                      hover:bg-red-800/80
                  {% endif %}">
          <img 
            src="{% static 'images/dashboard.svg' %}" 
            alt="Dashboard Icon" class="h-5 w-5"
            {% if request.resolver_match.url_name == 'admin_dashboard' %}
              src="{% static 'images/dashboard-red.svg' %}"
            {% endif %}>

          <span>Summary</span>
        </a>

    </div>

    <!-- Footer -->
    <div class="px-6 py-4 border-t border-red-400/40">
      <div class="flex items-center justify-between">
        <div class="min-w-0">
          <p class="text-sm font-semibold truncate">{{ request.session.username }}</p>
          <p class="text-xs text-red-200 truncate">{{ request.session.role_name }}</p>
        </div>
       <a href="{% url 'authentication:logout' %}"
          class="ml-3 flex items-center gap-2 px-3 py-2 rounded-md bg-red-900 text-white font-medium
                  hover:bg-red-800 ring-1 ring-white/20 transition">
          <!-- keep the white icon; no invert so it stays visible on dark red -->
          <img src="{% static 'images/logout-white.svg' %}" alt="Logout" class="h-4 w-4">
          <span class="text-xs">Logout</span>
        </a>
      </div>
    </div>
  </nav>

  <!-- Main content -->
  <div class="ml-64 min-h-screen">
    <div class="p-6">
      {% block content %}{% endblock %}
    </div>
  </div>

  <script>
  // Define your accordion items once
  const ACCORDION = [
    { btn: 'submenu-toggle', panel: 'submenu', arrow: 'submenu-arrow' },
    { btn: 'logs-toggle',    panel: 'logs-submenu', arrow: 'logs-arrow' },
  ];

  function getEl(id){ return document.getElementById(id); }

  function closeItem(item){
    const panel = getEl(item.panel);
    const arrow = getEl(item.arrow);
    const btn   = getEl(item.btn);
    if (!panel) return;
    panel.classList.add('hidden');
    arrow?.classList.remove('rotate-180');
    btn?.setAttribute('aria-expanded', 'false');
  }

  function openItem(item){
    const panel = getEl(item.panel);
    const arrow = getEl(item.arrow);
    const btn   = getEl(item.btn);
    if (!panel) return;
    panel.classList.remove('hidden');
    arrow?.classList.add('rotate-180');
    btn?.setAttribute('aria-expanded', 'true');
  }

  // Wire up clicks so that opening one closes the others
  ACCORDION.forEach((item) => {
    const btn = getEl(item.btn);
    const panel = getEl(item.panel);

    // Initialize aria states from the server-rendered classes
    if (btn && panel) {
      const isOpen = !panel.classList.contains('hidden');
      btn.setAttribute('aria-expanded', isOpen ? 'true' : 'false');
      btn.setAttribute('aria-controls', item.panel);
    }

    btn?.addEventListener('click', () => {
      const currentlyOpen = !getEl(item.panel).classList.contains('hidden');

      if (currentlyOpen) {
        // Simply close this one
        closeItem(item);
      } else {
        // Close all others
        ACCORDION.forEach(other => { if (other !== item) closeItem(other); });
        // Open the clicked one
        openItem(item);
      }
    });
  });

  // Reminder: Make sure this Function cannot be changed or overwritten
  // It handles idle logout and tab close detection
  (function () {
    const IDLE_LIMIT_MS = 5 * 60 * 1000; // 5 minutes
    const LOGOUT_URL    = "{% url 'authentication:logout' %}";
    const TAB_CLOSE_URL = "{% url 'authentication:silent_logout' %}";

    const TAB_FLAG    = 'tabAuth';
    const CLOSED_KEY  = 'closed_session_token';
    const SESSION_TOKEN = "{{ request.session.session_token }}";

    // First load in this tab?
    if (!sessionStorage.getItem(TAB_FLAG)) {
      sessionStorage.setItem(TAB_FLAG, '1');

      // If a previous tab left a token, report it and logout now
      const closedToken = localStorage.getItem(CLOSED_KEY);
      if (closedToken) {
        (async () => {
          const body = new URLSearchParams();
          body.set('session_token', closedToken);

          try {
            await fetch(TAB_CLOSE_URL, {
              method: 'POST',
              headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
              body: body.toString(),
              credentials: 'same-origin',
              keepalive: true
            });
          } catch (_) { /* ignore */ }

          try { localStorage.removeItem(CLOSED_KEY); } catch(_) {}
            window.location.replace(TAB_CLOSE_URL);
        })();
        return;
      }
    }

    // On tab/browser close: record token and call silent_logout
    addEventListener('pagehide', () => {
      try { localStorage.setItem(CLOSED_KEY, SESSION_TOKEN); } catch(_) {}
      sendClosePing(SESSION_TOKEN);
    });

    addEventListener('beforeunload', () => {
      try { localStorage.setItem(CLOSED_KEY, SESSION_TOKEN); } catch(_) {}
      sendClosePing(SESSION_TOKEN);
    });

    // Idle detection (unchanged)
    let last = Date.now(), timer;
    function arm() {
      clearTimeout(timer);
      if (document.visibilityState !== 'visible') return;
      timer = setTimeout(() => {
        if (document.visibilityState === 'visible' && Date.now() - last >= IDLE_LIMIT_MS) {
          window.location.replace(LOGOUT_URL);
        }
      }, IDLE_LIMIT_MS + 100);
    }

    function bump(){ last = Date.now(); arm(); }
    ['mousemove','keydown','click','wheel','scroll','touchstart']
    .forEach(evt => addEventListener(evt, bump, { passive: true }));
    addEventListener('visibilitychange', arm, { capture: true });
    arm();
  })();
</script>
</body>
</html>
