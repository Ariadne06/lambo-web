{% extends 'base_admin.html' %}

{% block title %}Resident — Personal Data{% endblock %}

{% block content %}
<div class="px-6 py-6">
  <!-- Page title -->
  <h1 class="text-lg font-semibold text-red-700 mb-4">Resident Information</h1>

  <div class="bg-white rounded-2xl border border-gray-200 shadow-sm p-6 relative max-w-5xl mx-auto">
    <!-- thin red bar -->
    <div class="absolute left-0 top-0 h-full w-1 bg-red-700 rounded-l-2xl"></div>

    <!-- Step header -->
    <div class="flex items-center gap-8 text-sm font-medium mb-8 justify-center">
      <div class="flex items-center gap-2">
        <span class="text-red-700">1</span>
        <span class="text-red-700">Personal Data</span>
      </div>
      <div class="flex items-center gap-2 text-gray-400">
        <span>2</span>
        <span>Address</span>
      </div>
    </div>

    <h3 class="text-sm font-semibold text-gray-800 mb-4">Personal Data</h3>

    <!-- Form -->
    <form class="grid grid-cols-1 md:grid-cols-2 gap-x-12 gap-y-5 text-sm">
      <!-- LEFT COLUMN -->
      <div class="space-y-5">
        <div>
          <label class="block text-gray-700 mb-1">First Name</label>
          <input type="text" value="Adrianne"
                 class="w-full rounded-md border border-gray-300 px-3 py-2 focus:outline-none focus:ring-2 focus:ring-red-600">
        </div>

        <div>
          <label class="block text-gray-700 mb-1">Middle Name</label>
          <input type="text" value="Cabunilas"
                 class="w-full rounded-md border border-gray-300 px-3 py-2 focus:outline-none focus:ring-2 focus:ring-red-600">
        </div>

        <div>
          <label class="block text-gray-700 mb-1">Last Name</label>
          <input type="text" value="Villarta"
                 class="w-full rounded-md border border-gray-300 px-3 py-2 focus:outline-none focus:ring-2 focus:ring-red-600">
        </div>

        <div>
          <label class="block text-gray-700 mb-1">Date of Birth</label>
          <div class="relative">
            <input type="text" value="08/30/2020"
                   class="w-full rounded-md border border-gray-300 pl-3 pr-10 py-2 focus:outline-none focus:ring-2 focus:ring-red-600">
            <!-- calendar icon -->
            <svg class="pointer-events-none absolute right-3 top-1/2 -translate-y-1/2 h-4 w-4 text-gray-500" viewBox="0 0 24 24" fill="currentColor">
              <path d="M7 2v2H5a2 2 0 0 0-2 2v2h18V6a2 2 0 0 0-2-2h-2V2h-2v2H9V2H7Zm14 8H3v10a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V10Z"/>
            </svg>
          </div>
        </div>

        <div>
          <label class="block text-gray-700 mb-1">Sex</label>
          <select class="w-full rounded-md border border-gray-300 px-3 py-2 bg-white focus:outline-none focus:ring-2 focus:ring-red-600">
            <option selected>Male</option>
            <option>Female</option>
          </select>
        </div>
      </div>

      <!-- RIGHT COLUMN -->
      <div class="space-y-5">
        <div>
          <label class="block text-gray-700 mb-1">Religion</label>
          <select class="w-full rounded-md border border-gray-300 px-3 py-2 bg-white focus:outline-none focus:ring-2 focus:ring-red-600">
            <option selected>Catholic</option>
            <option>Iglesia ni Cristo</option>
            <option>Protestant</option>
            <option>Islam</option>
            <option>Other</option>
          </select>
        </div>

        <div>
          <label class="block text-gray-700 mb-1">Civil Status</label>
          <select class="w-full rounded-md border border-gray-300 px-3 py-2 bg-white focus:outline-none focus:ring-2 focus:ring-red-600">
            <option>Single</option>
            <option>Married</option>
            <option>Widowed</option>
            <option>Separated</option>
          </select>
        </div>

        <div>
          <label class="block text-gray-700 mb-1">Educational Attainment</label>
          <select class="w-full rounded-md border border-gray-300 px-3 py-2 bg-white focus:outline-none focus:ring-2 focus:ring-red-600">
            <option>Elementary</option>
            <option>High School</option>
            <option selected>College Graduate</option>
            <option>Postgraduate</option>
          </select>
        </div>

        <div>
          <label class="block text-gray-700 mb-1">Resident Status</label>
          <select class="w-full rounded-md border border-gray-300 px-3 py-2 bg-white focus:outline-none focus:ring-2 focus:ring-red-600">
            <option selected>Permanent</option>
            <option>Temporary</option>
            <option>Non-Resident</option>
          </select>
        </div>
      </div>
    </form>

    <!-- Actions -->
    <div class="mt-8 flex items-center justify-between">
      <a href="#"
         class="inline-flex items-center justify-center rounded-xl bg-red-600 px-5 py-2 text-white text-sm font-medium shadow hover:bg-red-700">
        Back
      </a>
      <a href="#"
         class="inline-flex items-center justify-center rounded-xl bg-red-600 px-5 py-2 text-white text-sm font-medium shadow hover:bg-red-700">
        Next Page
      </a>
    </div>
  </div>
</div>
{% endblock %}
