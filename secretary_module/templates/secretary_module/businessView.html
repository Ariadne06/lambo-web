{% extends 'base_admin.html' %}

{% block title %}Business Details{% endblock %}

{% block content %}
<div class="px-6 py-6">
  <div class="bg-white rounded-2xl border border-gray-200 shadow-sm p-6 relative max-w-6xl mx-auto">
    

    <!-- Step header -->
    <h3 class="text-sm font-semibold text-gray-800 mb-6 text-center">Business Profile</h3>

    <!-- 3-column grid -->
    <div class="grid grid-cols-1 md:grid-cols-3 gap-8 text-sm">
      <!-- Owners Data -->
      <div>
        <h4 class="font-semibold text-gray-700 mb-3">Owners Data</h4>
        <div class="space-y-3">
          <div>
            <label class="block text-gray-500">First Name</label>
            <input type="text" value="Adriane" readonly
                   class="w-full rounded-md border border-gray-300 px-3 py-2 bg-gray-50">
          </div>
          <div>
            <label class="block text-gray-500">Middle Name</label>
            <input type="text" value="Villarta" readonly
                   class="w-full rounded-md border border-gray-300 px-3 py-2 bg-gray-50">
          </div>
          <div>
            <label class="block text-gray-500">Last Name</label>
            <input type="text" value="Medalla" readonly
                   class="w-full rounded-md border border-gray-300 px-3 py-2 bg-gray-50">
          </div>
          <div>
            <label class="block text-gray-500">Date of Birth</label>
            <input type="text" value="01/01/2000" readonly
                   class="w-full rounded-md border border-gray-300 px-3 py-2 bg-gray-50">
          </div>
          <div>
            <label class="block text-gray-500">Sex</label>
            <input type="text" value="Male" readonly
                   class="w-full rounded-md border border-gray-300 px-3 py-2 bg-gray-50">
          </div>
          <div>
            <label class="block text-gray-500">Resident Status</label>
            <input type="text" value="Non Resident" readonly
                   class="w-full rounded-md border border-gray-300 px-3 py-2 bg-gray-50">
          </div>
        </div>
      </div>

      <!-- Business Data -->
      <div>
        <h4 class="font-semibold text-gray-700 mb-3">Business Data</h4>
        <div class="space-y-3">
          <div>
            <label class="block text-gray-500">Business Name</label>
            <input type="text" value="Adriane Store" readonly
                   class="w-full rounded-md border border-gray-300 px-3 py-2 bg-gray-50">
          </div>
          <div>
            <label class="block text-gray-500">Business Type</label>
            <input type="text" value="Sari-sari Store" readonly
                   class="w-full rounded-md border border-gray-300 px-3 py-2 bg-gray-50">
          </div>
          <div>
            <label class="block text-gray-500">Number of Unit</label>
            <input type="text" value="0" readonly
                   class="w-full rounded-md border border-gray-300 px-3 py-2 bg-gray-50">
          </div>
          <div>
            <label class="block text-gray-500">Contact Number</label>
            <input type="text" value="0967262706" readonly
                   class="w-full rounded-md border border-gray-300 px-3 py-2 bg-gray-50">
          </div>
          <div>
            <label class="block text-gray-500">Business Status</label>
            <input type="text" value="Active" readonly
                   class="w-full rounded-md border border-gray-300 px-3 py-2 bg-gray-50">
          </div>
        </div>
      </div>

      <!-- Business Address -->
      <div>
        <h4 class="font-semibold text-gray-700 mb-3">Business Address</h4>
        <div class="space-y-3">
          <div>
            <label class="block text-gray-500">House Number</label>
            <input type="text" value="Block 5" readonly
                   class="w-full rounded-md border border-gray-300 px-3 py-2 bg-gray-50">
          </div>
          <div>
            <label class="block text-gray-500">Street</label>
            <input type="text" value="Sampaguita Street" readonly
                   class="w-full rounded-md border border-gray-300 px-3 py-2 bg-gray-50">
          </div>
          <div>
            <label class="block text-gray-500">Sitio</label>
            <input type="text" value="Sitio 5" readonly
                   class="w-full rounded-md border border-gray-300 px-3 py-2 bg-gray-50">
          </div>
          <div>
            <label class="block text-gray-500">City</label>
            <input type="text" value="Consolacion" readonly
                   class="w-full rounded-md border border-gray-300 px-3 py-2 bg-gray-50">
          </div>
          <div>
            <label class="block text-gray-500">Province</label>
            <input type="text" value="Cebu" readonly
                   class="w-full rounded-md border border-gray-300 px-3 py-2 bg-gray-50">
          </div>
          <div>
            <label class="block text-gray-500">Country</label>
            <input type="text" value="Philippines" readonly
                   class="w-full rounded-md border border-gray-300 px-3 py-2 bg-gray-50">
          </div>
        </div>
      </div>
    </div>

    <!-- Actions -->
    <div class="mt-10 flex justify-between">
      <!-- Back button -->
      <button onclick="window.history.back()"
              class="rounded-xl bg-red-600 px-6 py-2 text-white text-sm font-medium shadow hover:bg-red-700">
        Back
      </button>

      <!-- Right-side buttons -->
      <div class="flex gap-4">
        <a href="#" class="flex items-center gap-2 rounded-xl bg-red-600 px-5 py-2 text-white text-sm font-medium shadow hover:bg-red-700">
          <i class="fa fa-file-alt"></i> Business Clearance
        </a>
        <a href="#" class="flex items-center gap-2 rounded-xl bg-red-600 px-5 py-2 text-white text-sm font-medium shadow hover:bg-red-700">
          <i class="fa fa-receipt"></i> Payment History
        </a>
      </div>
    </div>
  </div>
</div>
{% endblock %}
