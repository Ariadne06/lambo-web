{% extends 'base_admin.html' %}

{% block title %}Business Address{% endblock %}

{% block content %}
<div class="px-6 py-6">
  <div class="bg-white rounded-2xl border border-gray-200 shadow-sm p-5 relative">
    <!-- thin red bar on the left -->
    <div class="absolute left-0 top-0 h-full w-1 bg-red-700 rounded-l-2xl"></div>

    <!-- Step header -->
    <div class="flex items-center gap-8 text-sm font-medium mb-6">
      <div class="flex items-center gap-2 text-gray-400">
        <span>1</span>
        <span>Owners Data</span>
      </div>
      <div class="flex items-center gap-2 text-gray-400">
        <span>2</span>
        <span>Business</span>
      </div>
      <div class="flex items-center gap-2">
        <span class="text-red-700">3</span>
        <span class="text-red-700">Business Address</span>
      </div>
    </div>

    <div class="grid grid-cols-1 lg:grid-cols-12 gap-8">
      <!-- Avatar / icon area (kept for structure parity) -->
      <div class="lg:col-span-3">
        <div class="w-44 h-44 rounded-md ring-2 ring-blue-400 overflow-hidden flex items-center justify-center">
          <!-- map-pin icon -->
          <svg xmlns="http://www.w3.org/2000/svg" class="w-20 h-20 text-gray-400" viewBox="0 0 24 24" fill="currentColor">
            <path d="M12 2a7 7 0 0 0-7 7c0 5.25 7 13 7 13s7-7.75 7-13a7 7 0 0 0-7-7Zm0 9.5A2.5 2.5 0 1 1 12 6a2.5 2.5 0 0 1 0 5.5Z"/>
          </svg>
        </div>
      </div>

      <!-- Form -->
      <div class="lg:col-span-9">
        <h3 class="text-sm font-semibold text-gray-800 mb-4">Business Address</h3>

        <form class="grid grid-cols-1 md:grid-cols-2 gap-x-10 gap-y-4">
          <!-- Address (select) spans both columns like in your mock -->
          <div class="md:col-span-2">
            <label class="block text-sm font-medium text-gray-700 mb-1">Address</label>
            <select class="w-full rounded-md border border-gray-300 px-3 py-2 bg-white">
              <option selected disabled>Input/Select Address</option>
              <option>Cansaga</option>
              <option>Poblacion</option>
              <option>Tayud</option>
              <option>Other</option>
            </select>
          </div>

          <div>
            <label class="block text-sm font-medium text-gray-700 mb-1">House Number</label>
            <input type="text" placeholder="Input House Number" class="w-full rounded-md border border-gray-300 px-3 py-2">
          </div>
          <div>
            <label class="block text-sm font-medium text-gray-700 mb-1">City</label>
            <input type="text" value="Consolacion" class="w-full rounded-md border border-gray-300 px-3 py-2">
          </div>

          <div>
            <label class="block text-sm font-medium text-gray-700 mb-1">Street</label>
            <input type="text" placeholder="Input Street" class="w-full rounded-md border border-gray-300 px-3 py-2">
          </div>
          <div>
            <label class="block text-sm font-medium text-gray-700 mb-1">Province</label>
            <input type="text" value="Cebu" class="w-full rounded-md border border-gray-300 px-3 py-2">
          </div>

          <div>
            <label class="block text-sm font-medium text-gray-700 mb-1">Sitio</label>
            <input type="text" placeholder="Select Sitio" class="w-full rounded-md border border-gray-300 px-3 py-2">
          </div>
          <div>
            <label class="block text-sm font-medium text-gray-700 mb-1">Country</label>
            <input type="text" value="Philippines" class="w-full rounded-md border border-gray-300 px-3 py-2">
          </div>
        </form>

        <!-- Actions -->
        <div class="mt-6 flex items-center justify-between">
          <a href="#" class="inline-flex items-center justify-center rounded-xl bg-red-600 px-5 py-2 text-white text-sm font-medium shadow hover:bg-red-700">Back</a>
          <a href="#" class="inline-flex items-center justify-center rounded-xl bg-red-600 px-5 py-2 text-white text-sm font-medium shadow hover:bg-red-700">Save</a>
        </div>
      </div>
    </div>
  </div>
</div>
{% endblock %}
