{% extends 'base_sec.html' %}
{% block title %}Demographic Dashboard{% endblock %}

{% block content %}
<div class="px-6 py-5 space-y-5 bg-gray-50">

  <!-- Title chip (restyled) -->
 <div class="flex justify-center my-4">
  <div
    class="inline-flex items-center gap-2 rounded-2xl px-6 py-2 text-white font-semibold shadow-lg ring-1 ring-black/5"
    style="background-image:linear-gradient(90deg,#ef4444 0%,#dc2626 50%,#b91c1c 100%);">
    <span class="inline-block h-2 w-2 rounded-full bg-white"></span>
    Demographic Dashboard
  </div>
</div>

  <!-- KPIs (tighter gaps & compact height) -->
  <section class="grid grid-cols-2 lg:grid-cols-4 gap-3 sm:gap-4">
    <!-- Population -->
    <div class="flex h-24 items-center gap-3 rounded-xl bg-white shadow-sm ring-1 ring-gray-200 px-4">
      <div class="grid h-10 w-10 place-items-center rounded-lg bg-slate-100 text-lg">👥</div>
      <div class="min-w-0">
        <p class="text-[13px] font-medium text-gray-600">Population</p>
        <p class="text-2xl font-extrabold text-gray-900 leading-none">5,120</p>
      </div>
    </div>

    <!-- Male -->
    <div class="flex h-24 items-center gap-3 rounded-xl bg-white shadow-sm ring-1 ring-gray-200 px-4">
      <div class="grid h-10 w-10 place-items-center rounded-lg bg-blue-50 text-lg">♂️</div>
      <div class="min-w-0">
        <p class="text-[13px] font-medium text-gray-600">Male</p>
        <p class="text-2xl font-extrabold text-gray-900 leading-none">2,600</p>
      </div>
    </div>

    <!-- Female -->
    <div class="flex h-24 items-center gap-3 rounded-xl bg-white shadow-sm ring-1 ring-gray-200 px-4">
      <div class="grid h-10 w-10 place-items-center rounded-lg bg-pink-50 text-lg">♀️</div>
      <div class="min-w-0">
        <p class="text-[13px] font-medium text-gray-600">Female</p>
        <p class="text-2xl font-extrabold text-gray-900 leading-none">2,520</p>
      </div>
    </div>

    <!-- Voters -->
    <div class="flex h-24 items-center gap-3 rounded-xl bg-white shadow-sm ring-1 ring-gray-200 px-4">
      <div class="grid h-10 w-10 place-items-center rounded-lg bg-indigo-50 text-lg">🗳️</div>
      <div class="min-w-0">
        <p class="text-[13px] font-medium text-gray-600">Voters</p>
        <p class="text-2xl font-extrabold text-gray-900 leading-none">3,749</p>
      </div>
    </div>
  </section>

  <!-- Charts -->
  <section class="rounded-xl bg-white shadow-sm ring-1 ring-gray-200 p-4 sm:p-5">
    <div class="grid grid-cols-1 lg:grid-cols-2 gap-6">
      <!-- Bar -->
      <div>
        <h3 class="text-center text-sm font-semibold text-gray-700 mb-3">
          Distribution of Residents Per Purok
        </h3>
        <div class="h-64 sm:h-72 lg:h-80">
          <canvas id="perPurokBar"></canvas>
        </div>
      </div>

      <!-- Donut -->
      <div>
        <h3 class="text-center text-sm font-semibold text-gray-700 mb-3">
          Resident Age Distribution
        </h3>
        <div class="h-64 sm:h-72 lg:h-80">
          <canvas id="ageDonut"></canvas>
        </div>
      </div>
    </div>

    <!-- Bottom-right button (brighter gradient) -->
    <div class="mt-4 flex justify-end">
  <button onclick="window.print()"
    class="inline-flex items-center gap-2 rounded-lg px-5 py-2 text-sm font-semibold text-white shadow-md hover:opacity-90 transition"
    style="background-image: linear-gradient(90deg,#ef4444 0%,#dc2626 100%);">
    
    <!-- Print Icon -->
    <svg xmlns="http://www.w3.org/2000/svg" 
         fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor"
         class="w-5 h-5">
      <path stroke-linecap="round" stroke-linejoin="round"
            d="M6 9V2h12v7m0 4h1.5A1.5 1.5 0 0121 12.5v7a1.5 1.5 0 01-1.5 1.5H18M6 13H4.5A1.5 1.5 0 003 14.5v7A1.5 1.5 0 004.5 23H6m0-10h12v10H6V13z" />
    </svg>

    Demographic Report
  </button>
</div>


  </section>
</div>

<!-- Chart.js -->
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
<script>
  // Neutral text + font
  Chart.defaults.color = '#374151';
  Chart.defaults.font.family = 'ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto';

  // Colors
  const gridGray = '#edf1f5';
  const greenFill = 'rgba(74,222,128,.65)'; // green-400
  const greenLine = '#22c55e';              // green-500
  const donutColors = ['#60a5fa','#86efac','#fde68a','#fdba74'];

  // Bar: Residents per Purok
  new Chart(document.getElementById('perPurokBar'), {
    type: 'bar',
    data: {
      labels: ['Purok 1','Purok 2','Purok 3','Purok 4'],
      datasets: [{
        data: [1000, 2000, 900, 1100],
        backgroundColor: greenFill,
        borderColor: greenLine,
        borderWidth: 2,
        borderRadius: 8,
        maxBarThickness: 48
      }]
    },
    options: {
      maintainAspectRatio: false,
      layout: { padding: { top: 4 } },
      plugins: { legend: { display: false } },
      scales: {
        x: { grid: { display: false }, ticks: { color: '#6b7280' } },
        y: {
          min: 0, max: 2000,
          grid: { color: gridGray },
          ticks: { stepSize: 250, color: '#6b7280', callback: v => v.toLocaleString() }
        }
      }
    }
  });

  // Center text plugin
  const centerText = {
    id: 'centerText',
    afterDraw(chart) {
      const {ctx, chartArea} = chart;
      const x = (chartArea.left + chartArea.right) / 2;
      const y = (chartArea.top + chartArea.bottom) / 2;
      ctx.save();
      ctx.fillStyle = '#374151';
      ctx.font = '600 14px ui-sans-serif, system-ui';
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.fillText('100% total', x, y);
      ctx.restore();
    }
  };

  // Donut: Age distribution
  new Chart(document.getElementById('ageDonut'), {
    type: 'doughnut',
    data: {
      labels: ['0–17 yrs. - 25%', '18–40 yrs. - 38%', '41–60 yrs. - 22%', '61+ yrs. - 16%'],
      datasets: [{
        data: [25, 38, 22, 16],
        backgroundColor: donutColors,
        borderColor: '#fff',
        borderWidth: 4,
        hoverOffset: 6
      }]
    },
    options: {
      maintainAspectRatio: false,
      cutout: '62%',
      plugins: {
        legend: {
          position: 'bottom',
          labels: { usePointStyle: true, pointStyle: 'circle', padding: 10 }
        }
      }
    },
    plugins: [centerText]
  });
</script>
{% endblock %}
