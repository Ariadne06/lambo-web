{% extends 'base_admin.html' %}

{% block title %}Informations{% endblock %}

{% block content %}
<div class="px-6 py-6">
  <div class="bg-white rounded-2xl border border-gray-200 shadow-sm p-6 relative max-w-5xl mx-auto">
    <!-- thin red bar for consistency (optional—remove if not needed) -->
    <div class="absolute left-0 top-0 h-full w-1 bg-red-700 rounded-l-2xl"></div>

    <!-- Section title -->
    <h2 class="text-base font-semibold text-red-700 mb-4">Informations</h2>

    <form method="post" class="grid grid-cols-1 md:grid-cols-2 gap-x-10 gap-y-4 text-sm">
      {% csrf_token %}

      <!-- Left column -->
      <div>
        <label class="block text-gray-700 mb-1">First Name</label>
        <input type="text" name="first_name" value="Adrianne"
               class="w-full rounded-md border border-gray-300 px-3 py-2 focus:ring-2 focus:ring-red-600">
      </div>

      <!-- Right column -->
      <div>
        <label class="block text-gray-700 mb-1">Date of Birth</label>
        <input type="text" name="dob" value="01/01/2000"
               class="w-full rounded-md border border-gray-300 px-3 py-2 focus:ring-2 focus:ring-red-600">
      </div>

      <div>
        <label class="block text-gray-700 mb-1">Middle Name</label>
        <input type="text" name="middle_name" value="Villarta"
               class="w-full rounded-md border border-gray-300 px-3 py-2 focus:ring-2 focus:ring-red-600">
      </div>

      <div>
        <label class="block text-gray-700 mb-1">Sex</label>
        <select name="sex"
                class="w-full rounded-md border border-gray-300 px-3 py-2 bg-white focus:ring-2 focus:ring-red-600">
          <option selected>Male</option>
          <option>Female</option>
          <option>Prefer not to say</option>
        </select>
      </div>

      <div>
        <label class="block text-gray-700 mb-1">Last Name</label>
        <input type="text" name="last_name" value="Medalla"
               class="w-full rounded-md border border-gray-300 px-3 py-2 focus:ring-2 focus:ring-red-600">
      </div>

      <div>
        <label class="block text-gray-700 mb-1">Business Type</label>
        <select name="business_type"
                class="w-full rounded-md border border-gray-300 px-3 py-2 bg-white focus:ring-2 focus:ring-red-600">
          <option selected disabled>Select Business</option>
          <option>Sari-sari Store</option>
          <option>Retail</option>
          <option>Food &amp; Beverage</option>
          <option>Service</option>
          <option>Manufacturing</option>
          <option>Other</option>
        </select>
      </div>

      <!-- Purpose spans the left column (like in your mock) -->
      <div class="md:col-span-1">
        <label class="block text-gray-700 mb-1">Purpose</label>
        <textarea name="purpose" rows="3" placeholder="Enter Purpose"
                  class="w-full rounded-md border border-gray-300 px-3 py-2 focus:ring-2 focus:ring-red-600"></textarea>
      </div>

      <div>
        <label class="block text-gray-700 mb-1">Number of Unit</label>
        <input type="number" name="num_unit" min="0" placeholder="Input Number of Unit"
               class="w-full rounded-md border border-gray-300 px-3 py-2 focus:ring-2 focus:ring-red-600">
      </div>
    </form>

    <!-- Actions -->
    <div class="mt-6 flex items-center justify-end">
      <button type="submit"
              class="inline-flex items-center justify-center rounded-xl bg-red-600 px-5 py-2 text-white text-sm font-medium shadow hover:bg-red-700">
        Submit
      </button>
    </div>
  </div>
</div>
{% endblock %}
