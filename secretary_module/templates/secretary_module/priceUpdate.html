{% extends 'base_admin.html' %}
{% block title %}Price List{% endblock %}

{% block content %}

<div class="px-6 py-10">
  <h1 class="text-xl font-semibold text-red-700 mb-8">Price List</h1>

  <div class="max-w-5xl mx-auto">
    <div class="bg-white rounded-2xl border border-gray-200 shadow-sm overflow-hidden">
      <!-- Header bar -->
      <div class="bg-red-600/90 text-white px-6 py-4">
        <h2 class="text-base font-semibold">Create / Update Entry</h2>
      </div>

      <!-- Form body -->
      <div class="px-8 py-10">
        <form class="grid grid-cols-1 md:grid-cols-2 gap-x-16 gap-y-8 text-sm">
          <!-- LEFT COLUMN -->
          <div class="space-y-8">
            <div>
              <label class="block text-gray-800 font-medium mb-2">Certificate/Clearance</label>
              <select class="w-full h-11 rounded-lg border border-gray-300 px-3 bg-white focus:outline-none focus:ring-2 focus:ring-red-600">
                <option selected disabled>Select Certificate</option>
                <option>Barangay Clearance</option>
                <option>Business Clearance</option>
                <option>Certificate of Residency</option>
                <option>Certificate of Indigency</option>
              </select>
            </div>

            <div>
              <label class="block text-gray-800 font-medium mb-2">Business Type</label>
              <select class="w-full h-11 rounded-lg border border-gray-300 px-3 bg-white focus:outline-none focus:ring-2 focus:ring-red-600">
                <option selected disabled>Select Business Type</option>
                <option>Sari-sari Store</option>
                <option>Retail</option>
                <option>Food &amp; Beverage</option>
                <option>Service</option>
                <option>Manufacturing</option>
                <option>Other</option>
              </select>
            </div>

            <div>
              <label class="block text-gray-800 font-medium mb-2">Number of Unit</label>
              <input type="number" min="0" step="1" placeholder="Input number of Unit"
                     class="w-full h-11 rounded-lg border border-gray-300 px-3 focus:outline-none focus:ring-2 focus:ring-red-600">
            </div>
          </div>

          <!-- RIGHT COLUMN -->
          <div class="space-y-8">
            <div>
              <label class="block text-gray-800 font-medium mb-2">Exact Amount (PHP)</label>
              <input type="number" min="0" step="1" placeholder="Input Exact Amount"
                     class="w-full h-11 rounded-lg border border-gray-300 px-3 focus:outline-none focus:ring-2 focus:ring-red-600">
            </div>

            <div>
              <label class="block text-gray-800 font-medium mb-2">Additional Amount per Unit (PHP)</label>
              <input type="number" min="0" step="1" placeholder="Input Additional Amount"
                     class="w-full h-11 rounded-lg border border-gray-300 px-3 focus:outline-none focus:ring-2 focus:ring-red-600">
            </div>

            <div>
              <label class="block text-gray-800 font-medium mb-2">Preview</label>
              <div class="rounded-xl border border-gray-200 bg-gray-50 px-4 py-3">
                <div class="flex items-center justify-between">
                  <span class="text-xs uppercase tracking-wider text-gray-500">Estimated Total</span>
                  <span class="inline-flex items-center rounded-full bg-emerald-50 px-3 py-1 text-[13px] font-semibold text-emerald-700 ring-1 ring-emerald-200">PHP 0.00</span>
                </div>
                <p class="mt-2 text-xs text-gray-500">Total = Exact Amount + (Additional × Unit)</p>
              </div>
            </div>
          </div>
        </form>
      </div>

      <!-- Footer actions -->
      <div class="px-8 py-5 bg-white/80 border-t border-gray-100 flex items-center justify-end gap-4">
        <a href="#" class="inline-flex items-center rounded-lg bg-gray-100 px-5 py-2 text-sm font-semibold text-gray-700 hover:bg-gray-200">
          Cancel
        </a>
        <a href="#" class="inline-flex items-center rounded-lg bg-red-600 px-6 py-2 text-sm font-semibold text-white shadow hover:bg-red-700">
          Save
        </a>
      </div>
    </div>
  </div>
</div>



{% endblock %}
