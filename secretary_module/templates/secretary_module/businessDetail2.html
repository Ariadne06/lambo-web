{% extends 'base_sec.html' %}

{% block title %}Business Owner — Business{% endblock %}

{% block content %}
<div class="px-6 py-6">
  <div class="bg-white rounded-2xl border border-gray-200 shadow-sm p-6 relative max-w-5xl mx-auto">
    <!-- thin red bar -->
    <div class="absolute left-0 top-0 h-full w-1 bg-red-700 rounded-l-2xl"></div>

    <!-- Step header -->
    <div class="flex items-center gap-8 text-sm font-medium mb-6 justify-center">
      <div class="flex items-center gap-2 text-gray-400">
        <span>1</span><span>Owners Data</span>
      </div>
      <div class="flex items-center gap-2">
        <span class="text-red-700">2</span><span class="text-red-700">Business</span>
      </div>
      <div class="flex items-center gap-2 text-gray-400">
        <span>3</span><span>Business Address</span>
      </div>
    </div>

    <h3 class="text-sm font-semibold text-gray-800 mb-4">Business Data</h3>

    <form id="business-form" method="post" class="grid grid-cols-1 md:grid-cols-2 gap-x-10 gap-y-4">
      {% csrf_token %}

      <!-- Left column -->
      <div>
        <label class="block text-sm font-medium text-gray-700 mb-1">Business Name</label>
        <input type="text" name="business_name" placeholder="Input Business Name"
               class="w-full rounded-md border border-gray-300 px-3 py-2 focus:outline-none focus:ring-2 focus:ring-red-600">
      </div>

      <!-- Right column -->
      <div>
        <label class="block text-sm font-medium text-gray-700 mb-1">Contact Number</label>
        <input type="tel" name="contact_number" placeholder="Input Contact Number"
               class="w-full rounded-md border border-gray-300 px-3 py-2 focus:outline-none focus:ring-2 focus:ring-red-600">
      </div>

      <div>
        <label class="block text-sm font-medium text-gray-700 mb-1">Business Type</label>
        <div class="relative">
          <select name="business_type"
                  class="w-full rounded-md border border-gray-300 px-3 py-2 bg-white focus:outline-none focus:ring-2 focus:ring-red-600">
            <option selected disabled>Select Business Type</option>
            <option value="retail">Retail</option>
            <option value="food">Food &amp; Beverage</option>
            <option value="service">Service</option>
            <option value="manufacturing">Manufacturing</option>
            <option value="other">Other</option>
          </select>
        </div>
      </div>

      <div>
        <label class="block text-sm font-medium text-gray-700 mb-1">Number of Unit</label>
        <input type="number" min="1" name="num_unit" placeholder="Input Number of Unit"
               class="w-full rounded-md border border-gray-300 px-3 py-2 focus:outline-none focus:ring-2 focus:ring-red-600">
      </div>
    </form>

    <!-- Actions -->
    <div class="mt-8 flex items-center justify-between">
      <a href="#" 
         class="inline-flex items-center justify-center rounded-xl bg-red-600 px-5 py-2 text-white text-sm font-medium shadow hover:bg-red-700">
        Back
      </a>
      <button type="submit" form="business-form"
              class="inline-flex items-center justify-center rounded-xl bg-red-600 px-5 py-2 text-white text-sm font-medium shadow hover:bg-red-700">
        Next Page
      </button>
    </div>
  </div>
</div>
{% endblock %}
