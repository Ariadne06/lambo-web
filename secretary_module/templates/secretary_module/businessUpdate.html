{% extends 'base_admin.html' %}

{% block title %}Business List — Update Info{% endblock %}

{% block content %}
<div class="px-6 py-6">

  <!-- Dimmed backdrop -->
  <div class="fixed inset-0 bg-black/30"></div>

  <!-- Modal panel -->
  <div class="fixed left-1/2 top-16 -translate-x-1/2 bg-white border border-gray-300 rounded-md shadow-lg w-[92%] max-w-6xl">
    <!-- Header -->
    <div class="px-6 py-4">
      <h2 class="text-xl font-semibold text-red-700">Update Info</h2>
    </div>

    <div class="px-6 pb-6">
      <form class="grid grid-cols-1 md:grid-cols-3 gap-6 text-sm">
        <!-- Owners Data -->
        <div>
          <h3 class="font-semibold text-gray-700 mb-2">Owners Data</h3>
          <div class="space-y-3">
            <div>
              <label class="block text-gray-600 mb-1">First Name</label>
              <input type="text" value="Adrianne" class="w-full rounded-md border border-gray-300 px-3 py-2">
            </div>
            <div>
              <label class="block text-gray-600 mb-1">Middle Name</label>
              <input type="text" value="Villarta" class="w-full rounded-md border border-gray-300 px-3 py-2">
            </div>
            <div>
              <label class="block text-gray-600 mb-1">Last Name</label>
              <input type="text" value="Medalla" class="w-full rounded-md border border-gray-300 px-3 py-2">
            </div>
            <div>
              <label class="block text-gray-600 mb-1">Date of Birth</label>
              <input type="text" value="01/01/2000" class="w-full rounded-md border border-gray-300 px-3 py-2">
            </div>
            <div>
              <label class="block text-gray-600 mb-1">Sex</label>
              <select class="w-full rounded-md border border-gray-300 px-3 py-2 bg-white">
                <option selected>Male</option>
                <option>Female</option>
                <option>Prefer not to say</option>
              </select>
            </div>
            <div>
              <label class="block text-gray-600 mb-1">Resident Status</label>
              <input type="text" value="Non-Resident" class="w-full rounded-md border border-gray-300 px-3 py-2">
            </div>
          </div>
        </div>

        <!-- Business Address -->
        <div>
          <h3 class="font-semibold text-gray-700 mb-2">Business Address</h3>
          <div class="space-y-3">
            <div>
              <label class="block text-gray-600 mb-1">House Number</label>
              <input type="text" value="Block 5" class="w-full rounded-md border border-gray-300 px-3 py-2">
            </div>
            <div>
              <label class="block text-gray-600 mb-1">Street</label>
              <input type="text" value="Sampaguita Street" class="w-full rounded-md border border-gray-300 px-3 py-2">
            </div>
            <div>
              <label class="block text-gray-600 mb-1">Sitio</label>
              <input type="text" value="Sitio 5" class="w-full rounded-md border border-gray-300 px-3 py-2">
            </div>
            <div>
              <label class="block text-gray-600 mb-1">City</label>
              <input type="text" value="Consolacion" class="w-full rounded-md border border-gray-300 px-3 py-2">
            </div>
            <div>
              <label class="block text-gray-600 mb-1">Province</label>
              <input type="text" value="Cebu" class="w-full rounded-md border border-gray-300 px-3 py-2">
            </div>
            <div>
              <label class="block text-gray-600 mb-1">Country</label>
              <input type="text" value="Philippines" class="w-full rounded-md border border-gray-300 px-3 py-2">
            </div>
          </div>
        </div>

        <!-- Business Data -->
        <div>
          <h3 class="font-semibold text-gray-700 mb-2">Business Data</h3>
          <div class="space-y-3">
            <div>
              <label class="block text-gray-600 mb-1">Business Name</label>
              <input type="text" value="Adrianne Store" class="w-full rounded-md border border-gray-300 px-3 py-2">
            </div>
            <div>
              <label class="block text-gray-600 mb-1">Business Type</label>
              <select class="w-full rounded-md border border-gray-300 px-3 py-2 bg-white">
                <option selected>Sari-sari Store</option>
                <option>Retail</option>
                <option>Food &amp; Beverage</option>
                <option>Service</option>
                <option>Manufacturing</option>
                <option>Other</option>
              </select>
            </div>
            <div>
              <label class="block text-gray-600 mb-1">Contact Number</label>
              <input type="text" value="09672662706" class="w-full rounded-md border border-gray-300 px-3 py-2">
            </div>
            <div>
              <label class="block text-gray-600 mb-1">Business Status</label>
              <select class="w-full rounded-md border border-gray-300 px-3 py-2 bg-white">
                <option selected>Active</option>
                <option>Inactive</option>
                <option>Pending</option>
              </select>
            </div>
            <div>
              <label class="block text-gray-400 mb-1">Number of Unit</label>
              <input type="text" value="0" class="w-full rounded-md border border-gray-300 px-3 py-2 bg-gray-100" disabled>
            </div>
          </div>
        </div>
      </form>

      <!-- Footer actions -->
      <div class="mt-6 flex items-center justify-end gap-3">
        <a href="#" class="inline-flex items-center justify-center rounded-xl bg-red-600 px-5 py-2 text-white text-sm font-medium shadow hover:bg-red-700">
          Cancel
        </a>
        <button class="inline-flex items-center justify-center rounded-xl bg-red-600 px-5 py-2 text-white text-sm font-medium shadow hover:bg-red-700">
          Update
        </button>
      </div>
    </div>
  </div>
</div>
{% endblock %}
