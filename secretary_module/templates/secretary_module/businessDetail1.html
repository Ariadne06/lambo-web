{% extends 'base_admin.html' %}

{% block title %}Business Owner — Owners Data{% endblock %}

{% block content %}
<div class="px-6 py-6">
  <div class="bg-white rounded-2xl border border-gray-200 shadow-sm p-6 relative max-w-5xl mx-auto">
    <!-- thin red bar on the left -->
    <div class="absolute left-0 top-0 h-full w-1 bg-red-700 rounded-l-2xl"></div>

    <!-- Step header -->
    <div class="flex items-center gap-8 text-sm font-medium mb-6 justify-center">
      <div class="flex items-center gap-2">
        <span class="text-red-700">1</span>
        <span class="text-red-700">Owners Data</span>
      </div>
      <div class="flex items-center gap-2 text-gray-400">
        <span>2</span>
        <span>Business</span>
      </div>
      <div class="flex items-center gap-2 text-gray-400">
        <span>3</span>
        <span>Business Address</span>
      </div>
    </div>

    <h3 class="text-sm font-semibold text-gray-800 mb-4">Owners Data</h3>

    <form method="post" class="grid grid-cols-1 md:grid-cols-2 gap-x-10 gap-y-4">
      {% csrf_token %}

      <!-- Left column -->
      <div>
        <label class="block text-sm font-medium text-gray-700 mb-1">First Name</label>
        <input type="text" name="first_name" value="Adrianne"
               class="w-full rounded-md border border-gray-300 px-3 py-2 focus:outline-none focus:ring-2 focus:ring-red-600">
      </div>

      <!-- Right column -->
      <div>
        <label class="block text-sm font-medium text-gray-700 mb-1">Date of Birth</label>
        <input type="date" name="dob" value="2000-01-01"
               class="w-full rounded-md border border-gray-300 px-3 py-2 focus:outline-none focus:ring-2 focus:ring-red-600">
      </div>

      <div>
        <label class="block text-sm font-medium text-gray-700 mb-1">Middle Name</label>
        <input type="text" name="middle_name" value="Villarta"
               class="w-full rounded-md border border-gray-300 px-3 py-2 focus:outline-none focus:ring-2 focus:ring-red-600">
      </div>

      <div>
        <label class="block text-sm font-medium text-gray-700 mb-1">Sex</label>
        <select name="sex"
                class="w-full rounded-md border border-gray-300 px-3 py-2 bg-white focus:outline-none focus:ring-2 focus:ring-red-600">
          <option>Male</option>
          <option>Female</option>
          <option>Prefer not to say</option>
        </select>
      </div>

      <div>
        <label class="block text-sm font-medium text-gray-700 mb-1">Last Name</label>
        <input type="text" name="last_name" value="Medalla"
               class="w-full rounded-md border border-gray-300 px-3 py-2 focus:outline-none focus:ring-2 focus:ring-red-600">
      </div>

      <div>
        <label class="block text-sm font-medium text-gray-700 mb-1">Resident Status</label>
        <!-- If this flow is strictly for non-resident business owners, keep disabled.
             Otherwise, remove 'disabled' to allow selection. -->
        <select name="resident_status" disabled
                class="w-full rounded-md border border-gray-300 px-3 py-2 bg-gray-50 text-gray-600 cursor-not-allowed">
          <option selected>Non-Resident</option>
          <option>Resident</option>
          <option>Transient</option>
        </select>
      </div>
    </form>

    <!-- Actions -->
    <div class="mt-8 flex items-center justify-end">
      <button type="submit"
              form="owners-form"
              class="inline-flex items-center justify-center rounded-xl bg-red-600 px-5 py-2 text-white text-sm font-medium shadow hover:bg-red-700">
        Next Page
      </button>
    </div>
  </div>
</div>
{% endblock %}
