{% extends 'base_sec.html' %}

{% block title %}Certificate/Clearance{% endblock %}

{% block content %}
<div class="px-6 py-6 relative">
  <!-- thin red accent bar on the far left -->
  <div class="absolute left-0 top-0 h-full w-[3px] bg-red-700"></div>

  <!-- Page title -->
  <h1 class="text-lg font-semibold text-red-700 mb-6">Certificate/Clearance</h1>

  <form method="post" action="{% url 'secretary_module:submit_business_application' %}" class="space-y-10 max-w-3xl mx-auto" id="create-app-form">
    {% csrf_token %}
    <!-- Card 1: Select Fee Type (driven by DB when available) -->
    <div class="bg-white rounded-2xl border border-gray-200 shadow-sm p-6">
      <div class="mb-4">
        <div class="inline-flex items-center gap-3 rounded-lg bg-red-700 text-white px-4 py-2">
          <!-- exclamation icon -->
          <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4" viewBox="0 0 24 24" fill="currentColor">
            <path d="M11 15h2V7h-2v8Zm0 4h2v-2h-2v2ZM1 21h22L12 2 1 21Z"/>
          </svg>
          <span class="font-semibold">Select Fee Type</span>
        </div>
      </div>

      <label class="block text-sm text-gray-600 mb-1"> </label>
      <select id="fee-type" name="fee_type_id" class="w-full rounded-md border border-gray-300 px-3 py-2 bg-white focus:outline-none focus:ring-2 focus:ring-red-600">
        <option value="" selected disabled>Please Select</option>
        {# If the view supplies `fee_types` (list of {fee_type_id, fee_type_name}), render them; otherwise fall back to known names #}
        {% if fee_types %}
          {% for ft in fee_types %}
            <option value="{{ ft.fee_type_id }}" data-name="{{ ft.fee_type_name|escape }}">{{ ft.fee_type_name }}</option>
          {% endfor %}
        {% else %}
          <!-- No fee types returned from server; show a single disabled hint option instead of hardcoded choices -->
          <option value="" disabled>No fee types available</option>
        {% endif %}
      </select>
    </div>

    <!-- Card 2: Separate Certificate & Clearance (gray headers) -->
  <div class="bg-white rounded-2xl border border-gray-200 shadow-sm p-6 space-y-6">
      <!-- Clearance / Purpose -->
      <div>
        <div class="inline-flex items-center gap-3 rounded-lg bg-gray-400 text-white px-4 py-2">
          <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4" viewBox="0 0 24 24" fill="currentColor">
            <path d="M11 15h2V7h-2v8Zm0 4h2v-2h-2v2ZM1 21h22L12 2 1 21Z"/>
          </svg>
          <span class="font-semibold">Purpose</span>
        </div>
        <div id="purpose-container" class="mt-3 hidden">
          <!-- Purpose (for Business/Penalty: fixed list; for Barangay Clearances: populated from other_clearances) -->
          <label class="block text-sm text-gray-600 mb-1">Purpose</label>
          <select id="purpose-select" name="purpose" class="w-full rounded-md border border-gray-300 px-3 py-2 bg-white focus:outline-none focus:ring-2 focus:ring-red-600">
            <option value="" selected disabled>Please select purpose</option>
            <!-- For business/penalty we show textual choices; for barangay clearances we'll overwrite options via JS using `other_clearances` context -->
            <option value="Registration">Registration</option>
            <option value="Renewal">Renewal</option>
            <option value="Business Closure">Business Closure</option>
          </select>
        </div>
      </div>
      <!-- Card 3: Business / Resident search & details (walk-in) -->
  <div id="walkin-card" class="bg-white rounded-2xl border border-gray-200 shadow-sm p-6 space-y-4 hidden">
        <div class="grid grid-cols-1 gap-4">
          <label class="block text-sm font-medium text-gray-700">Search (type business name, owner name, resident code or phone)</label>
          <input id="search-query" type="search" class="w-full rounded-md border border-gray-300 px-3 py-2" placeholder="Search for business or resident...">
          <div id="search-results" class="space-y-2"></div>
        </div>
        <!-- Hidden source of other_clearances (populated by server if available) -->
        <select id="other-clearances-source" class="hidden">
          {% if other_clearances %}
            {% for oc in other_clearances %}
              <option value="{{ oc.other_clearance_id }}">{{ oc.purpose_name }}</option>
            {% endfor %}
          {% endif %}
        </select>

        <div id="selected-details" class="mt-4 hidden">
          <h3 class="text-sm font-semibold">Selected</h3>
          <div class="mt-2 text-sm text-gray-700">
            <p><strong id="sel-name"></strong></p>
            <p>Category: <span id="sel-category">—</span></p>
            <p>Total Units: <span id="sel-units">—</span></p>
          </div>

          <div id="device-qtys" class="mt-3 hidden">
            <label class="block text-sm font-medium">Device quantities (for Amusement Category)</label>
            <div class="grid grid-cols-3 gap-2 mt-2">
              <input name="videoke_qty" type="number" min="0" placeholder="Videoke qty" class="rounded-md border px-2 py-1">
              <input name="billiard_qty" type="number" min="0" placeholder="Billiard qty" class="rounded-md border px-2 py-1">
              <input name="other_device_qty" type="number" min="0" placeholder="Other device qty" class="rounded-md border px-2 py-1">
            </div>
          </div>
        </div>

        <div class="flex gap-3 mt-4">
          <button type="button" id="preview-btn" class="px-4 py-2 bg-red-700 text-white rounded-md">Preview breakdown</button>
          <button type="submit" class="px-4 py-2 bg-green-600 text-white rounded-md">Create request (walk‑in)</button>
        </div>
      </div>

    </form>
  </div>
</div>

<!-- Preview modal (hidden) -->
<div id="preview-modal" class="fixed inset-0 z-50 hidden items-center justify-center bg-black/50" aria-hidden="true">
  <div id="preview-dialog" role="dialog" aria-modal="true" aria-labelledby="preview-title"
       class="bg-white rounded-xl shadow-2xl w-full max-w-2xl mx-4 overflow-hidden">
    <!-- Header -->
    <div class="flex items-center justify-between border-b px-5 py-4 bg-gray-50">
      <div class="flex items-center gap-3">
        <h3 id="preview-title" class="text-base font-semibold text-gray-900">Fee breakdown preview</h3>
        <span id="preview-purpose-pill" class="hidden text-xs font-medium rounded-full px-2.5 py-0.5 bg-red-100 text-red-700"></span>
      </div>
      <button id="preview-close" class="inline-flex h-8 w-8 items-center justify-center rounded-full hover:bg-gray-200 text-gray-600" aria-label="Close">✕</button>
    </div>

    <!-- Printable body -->
    <div id="print-area" class="p-6">
      <!-- Header block (business and meta) -->
      <div id="preview-header" class="mb-4">
        <!-- populated by JS with business name, status, ids -->
      </div>

      <!-- Items table -->
      <div class="overflow-hidden rounded-lg border border-gray-200">
        <table class="min-w-full divide-y divide-gray-200">
          <thead class="bg-gray-50">
            <tr>
              <th scope="col" class="px-4 py-2 text-left text-xs font-semibold text-gray-600 uppercase tracking-wider">Description</th>
              <th scope="col" class="px-4 py-2 text-right text-xs font-semibold text-gray-600 uppercase tracking-wider">Amount</th>
            </tr>
          </thead>
          <tbody id="preview-items" class="divide-y divide-gray-100 bg-white">
          </tbody>
          <tfoot class="bg-gray-50">
            <tr>
              <td class="px-4 py-3 text-right text-sm font-semibold text-gray-800">Total</td>
              <td id="preview-total" class="px-4 py-3 text-right text-lg font-bold text-gray-900"></td>
            </tr>
          </tfoot>
        </table>
      </div>

      <!-- Optional notes block -->
      <div id="preview-notes" class="mt-4 text-xs text-gray-500"></div>
    </div>

    <!-- Footer -->
    <div class="flex items-center justify-end gap-3 px-5 py-4 border-t bg-white">
      <button id="preview-print" class="px-3 py-2 text-sm bg-gray-100 hover:bg-gray-200 rounded-md">Print</button>
      <button id="preview-close-2" class="px-3 py-2 text-sm bg-red-700 hover:bg-red-800 text-white rounded-md">Close</button>
    </div>
  </div>
</div>

<style>
  /* Print only the receipt area */
  @media print {
    body * { visibility: hidden; }
    #print-area, #print-area * { visibility: visible; }
    #print-area { position: absolute; inset: 0; margin: 0; padding: 0; }
  }
</style>

<!-- Minimal client JS to manage the walk-in UI; backend wiring to SQL will be added in the next step -->
<script>
  (function(){
    const fee = document.getElementById('fee-type');
    const walkin = document.getElementById('walkin-card');
    const search = document.getElementById('search-query');
    const results = document.getElementById('search-results');
    const selected = document.getElementById('selected-details');
    const selName = document.getElementById('sel-name');
    const selCat = document.getElementById('sel-category');
    const selUnits = document.getElementById('sel-units');
    const deviceQtys = document.getElementById('device-qtys');

    fee?.addEventListener('change', () => {
      const purposeContainer = document.getElementById('purpose-container');
      if (!fee.value) { walkin.classList.add('hidden'); if (purposeContainer) purposeContainer.classList.add('hidden'); return; }
      walkin.classList.remove('hidden');
      // Reset selected area
      selected.classList.add('hidden');
      results.innerHTML = '';

      // Show correct search placeholder and populate Purpose select depending on fee type
      const selectedOption = fee.selectedOptions?.[0];
      const feeName = selectedOption?.dataset?.name || '';
        if (/Barangay Clearances/i.test(feeName)) {
        // Populate purpose-select from other_clearances-source if available; otherwise show a disabled hint
        const src = document.getElementById('other-clearances-source');
        const purpose = document.getElementById('purpose-select');
        purpose.innerHTML = '<option value="" selected disabled>Please select purpose</option>';
        if (src && src.options && src.options.length > 0) {
          Array.from(src.options).forEach(opt => {
            const v = opt.value;
            const t = opt.textContent;
            const o = document.createElement('option'); o.value = v; o.textContent = t; purpose.appendChild(o);
          });
        } else {
          // no server-provided purposes — show a disabled hint so user knows to ask admin
          purpose.innerHTML += '<option value="" disabled>No purposes available</option>';
        }
        if (purposeContainer) purposeContainer.classList.remove('hidden');
        // search placeholder for residents
        search.placeholder = 'Search for resident (name, code, phone)...';
      } else {
        // Business / Penalty -> show textual purposes
        const purpose = document.getElementById('purpose-select');
        purpose.innerHTML = '<option value="" selected disabled>Please select purpose</option>' +
          '<option value="Registration">Registration</option>' +
          '<option value="Renewal">Renewal</option>' +
          '<option value="Business Closure">Business Closure</option>';
        if (purposeContainer) purposeContainer.classList.remove('hidden');
        search.placeholder = 'Search for business or owner (name, business name, code)...';
      }
    });

    // Live search: call the application_search endpoint
    search?.addEventListener('keydown', async (e) => {
      if (e.key === 'Enter') {
        e.preventDefault();
        const q = search.value.trim();
        if (!q) return;
        const feeSelect = document.getElementById('fee-type');
        const selectedOption = feeSelect?.selectedOptions?.[0];
        const feeName = selectedOption?.dataset?.name || '';
        // call backend
        try {
          const url = new URL('{% url "secretary_module:application_search" %}', window.location.origin);
          url.searchParams.set('q', q);
          url.searchParams.set('fee_name', feeName);
          const resp = await fetch(url.toString());
          if (!resp.ok) throw new Error('Search failed');
          const data = await resp.json();
          // render results
          results.innerHTML = '';
          if (!Array.isArray(data) || data.length === 0) {
            results.innerHTML = '<div class="text-sm text-gray-500">No results</div>';
            return;
          }
          data.forEach(item => {
            const div = document.createElement('div');
            div.className = 'p-2 border rounded hover:bg-gray-50 cursor-pointer';
            if (item.business_id) {
              div.dataset.type = 'business';
              div.dataset.id = item.business_id;
              // Attach category and units info from search_owner()
              if (item.clearance_category_id != null) div.dataset.categoryId = String(item.clearance_category_id);
              if (item.category_id != null && !div.dataset.categoryId) div.dataset.categoryId = String(item.category_id);
              if (item.category_name) div.dataset.categoryName = String(item.category_name);
              if (item.total_units != null) div.dataset.totalUnits = String(item.total_units);
              div.textContent = `${item.business_name} — ${item.owner_full_name || ''}`;
            } else if (item.resident_id) {
              div.dataset.type = 'resident';
              div.dataset.id = item.resident_id;
              div.textContent = `${item.full_name} — ${item.resident_code || ''}`;
            }
            results.appendChild(div);
            div.addEventListener('click', () => {
              const dtype = div.dataset.type;
              selName.textContent = div.textContent;
              if (dtype === 'business') {
                // fetch business detail for category/units? For now map mock fields from search
                selCat.textContent = div.dataset.categoryName || (div.dataset.categoryId ? `Category ${div.dataset.categoryId}` : '—');
                selUnits.textContent = div.dataset.totalUnits || '—';
                let hid = document.querySelector('input[name="business_id"]');
                if (!hid) { hid = document.createElement('input'); hid.type='hidden'; hid.name='business_id'; document.getElementById('create-app-form').appendChild(hid); }
                hid.value = div.dataset.id;
                // also set hidden business_clearance_category
                let hcat = document.querySelector('input[name="business_clearance_category"]');
                if (!hcat) { hcat = document.createElement('input'); hcat.type='hidden'; hcat.name='business_clearance_category'; document.getElementById('create-app-form').appendChild(hcat); }
                hcat.value = div.dataset.categoryId || '';
                // Show device quantities only for Amusement (category id 12)
                if (div.dataset.categoryId === '12') {
                  deviceQtys.classList.remove('hidden');
                } else {
                  deviceQtys.classList.add('hidden');
                }
              } else {
                selCat.textContent = 'N/A';
                selUnits.textContent = '—';
                let hid = document.querySelector('input[name="applicant_id"]');
                if (!hid) { hid = document.createElement('input'); hid.type='hidden'; hid.name='applicant_id'; document.getElementById('create-app-form').appendChild(hid); }
                hid.value = div.dataset.id;
                deviceQtys.classList.add('hidden');
              }
              selected.classList.remove('hidden');
              // device qtys shown later based on real category
              // leave as-is (toggled above)
            });
          });
        } catch (err) {
          results.innerHTML = `<div class="text-sm text-red-500">Search error: ${err.message}</div>`;
        }
      }
    });

    // Preview button behavior: display an alert with placeholder breakdown
    document.getElementById('preview-btn')?.addEventListener('click', async () => {
      // collect required params and POST to preview endpoint
      const businessId = document.querySelector('input[name="business_id"]')?.value;
      const purpose = document.getElementById('purpose-select')?.value;
      if (!businessId) { alert('Please select a business first.'); return; }
      if (!purpose) { alert('Please select a purpose.'); return; }
      const form = new FormData();
      form.append('business_id', businessId);
      form.append('purpose', purpose);
      form.append('videoke_qty', document.querySelector('input[name="videoke_qty"]')?.value || '0');
      form.append('billiard_qty', document.querySelector('input[name="billiard_qty"]')?.value || '0');
      form.append('other_device_qty', document.querySelector('input[name="other_device_qty"]')?.value || '0');

      try {
        const resp = await fetch('{% url "secretary_module:preview_business_clearance" %}', {
          method: 'POST',
          credentials: 'same-origin',
          headers: { 'X-CSRFToken': document.querySelector('input[name="csrfmiddlewaretoken"]').value },
          body: form
        });
        const data = await resp.json();
        if (!data.ok) {
          // show error inside modal
          showPreviewModal({ error: data.message || JSON.stringify(data) });
          return;
        }
        showPreviewModal(data);
      } catch (err) {
        showPreviewModal({ error: err.message });
      }
    });

    // Modal helpers
    function showPreviewModal(data) {
      const modal = document.getElementById('preview-modal');
      const dialog = document.getElementById('preview-dialog');
      const header = document.getElementById('preview-header');
      const itemsBody = document.getElementById('preview-items');
      const totalEl = document.getElementById('preview-total');
      const pill = document.getElementById('preview-purpose-pill');
      const notes = document.getElementById('preview-notes');

      // clear
      header.innerHTML = '';
      itemsBody.innerHTML = '';
      totalEl.textContent = '';
      notes.textContent = '';
      pill.classList.add('hidden');
      pill.textContent = '';

      // Error state
      if (data.error) {
        header.innerHTML = `<div class="text-sm text-red-600">Error: ${escapeHtml(data.error)}</div>`;
        openModal(modal, dialog);
        return;
      }

      // Purpose pill
      if (data.purpose) {
        pill.textContent = String(data.purpose);
        pill.classList.remove('hidden');
      }

      // Header content: business/resident summary and non-price metadata
      const selectedText = document.getElementById('sel-name')?.textContent || '';
      const metaParts = [];
        if (data.business_id) metaParts.push(`Business ID: ${escapeHtml(String(data.business_id))}`);
        if (data.business_status) metaParts.push(`Status: ${escapeHtml(String(data.business_status))}`);
      header.innerHTML = `
        <div class="mb-1 text-sm font-medium text-gray-900">${escapeHtml(selectedText)}</div>
          <div class="text-xs text-gray-500">${metaParts.join(' · ')}</div>
      `;

      // Normalize details into readable rows (headers + items), no raw JSON/dict rendering
      const detailData = (data.total_amount_details !== undefined && data.total_amount_details !== null)
        ? data.total_amount_details
        : (data.items !== undefined && data.items !== null)
          ? data.items
          : (data.breakdown !== undefined && data.breakdown !== null)
            ? data.breakdown
            : (data.details !== undefined && data.details !== null)
              ? data.details
              : undefined;
      const rows = normalizeDetails(detailData);
      if (rows.length === 0) {
        const tr = document.createElement('tr');
        tr.innerHTML = `<td class="px-4 py-3 text-sm text-gray-500" colspan="2">No line items returned.</td>`;
        itemsBody.appendChild(tr);
      } else {
        rows.forEach(r => {
          const tr = document.createElement('tr');
          if (r.type === 'header') {
            tr.innerHTML = `<td class="px-4 py-2 text-xs font-semibold uppercase tracking-wide text-gray-600 bg-gray-50" colspan="2">${escapeHtml(r.label)}</td>`;
          } else {
            tr.innerHTML = `
              <td class="px-4 py-2 text-sm text-gray-700">${escapeHtml(r.label)}</td>
              <td class="px-4 py-2 text-sm text-right font-mono ${Number(r.amount) < 0 ? 'text-red-600' : 'text-gray-900'}">${formatCurrency(Number(r.amount))}</td>
            `;
          }
          itemsBody.appendChild(tr);
        });
      }

  // Total
  totalEl.textContent = formatCurrency(Number((data.total_amount ?? data.total ?? 0)));

      // Notes: include device qtys if any
      const v = Number(document.querySelector('input[name="videoke_qty"]')?.value || '0');
      const b = Number(document.querySelector('input[name="billiard_qty"]')?.value || '0');
      const o = Number(document.querySelector('input[name="other_device_qty"]')?.value || '0');
      const noteParts = [];
      if (v > 0) noteParts.push(`Videoke: ${v}`);
      if (b > 0) noteParts.push(`Billiard: ${b}`);
      if (o > 0) noteParts.push(`Other devices: ${o}`);
      if (noteParts.length) {
        notes.textContent = `Quantities — ${noteParts.join(' · ')}`;
      }

      // Show modal
      openModal(modal, dialog);

      // Bind actions
      document.getElementById('preview-close').onclick = () => closeModal(modal);
      document.getElementById('preview-close-2').onclick = () => closeModal(modal);
      document.getElementById('preview-print').onclick = () => window.print();

      // Backdrop click to close
      modal.onclick = (e) => { if (e.target === modal) closeModal(modal); };
      // Esc to close
      document.addEventListener('keydown', escHandler);
      function escHandler(ev) { if (ev.key === 'Escape') { closeModal(modal); document.removeEventListener('keydown', escHandler); } }
    }

    function normalizeDetails(details) {
      if (details == null) return [];

      // If backend sometimes returns stringified JSON, try to parse it first.
      if (typeof details === 'string') {
        const trimmed = details.trim();
        if ((trimmed.startsWith('{') && trimmed.endsWith('}')) || (trimmed.startsWith('[') && trimmed.endsWith(']'))) {
          try { details = JSON.parse(trimmed); } catch { /* fall through to plain string */ }
        }
      }

      const rows = [];

      const toTitle = (s) => {
        return String(s || '')
          .replace(/[_\-]+/g, ' ')
          .replace(/\s+/g, ' ')
          .trim()
          .toLowerCase()
          .replace(/\b\w/g, c => c.toUpperCase());
      };

      const pushItem = (label, amount) => {
        if (!label && label !== 0) return; // require a label
        const num = Number(amount ?? 0);
        rows.push({ type: 'item', label: toTitle(label), amount: isFinite(num) ? num : 0 });
      };

      const walk = (node, groupLabel) => {
        if (node == null) return;
        const t = typeof node;
        if (t === 'number') { pushItem(groupLabel ?? 'Item', node); return; }
        if (t === 'string') { pushItem(node, 0); return; }
        if (Array.isArray(node)) {
          // Avoid duplicate headers for container labels like 'items', 'breakdown', 'details'
          if (groupLabel && !/^items$|^breakdown$|^details$/i.test(String(groupLabel))) {
            rows.push({ type: 'header', label: toTitle(groupLabel) });
          }
          node.forEach((el, idx) => {
            if (el && typeof el === 'object') {
              if ('amount' in el) {
                const baseLbl = el.label ?? el.name ?? el.description ?? el.item ?? `${groupLabel || 'Item'} ${idx + 1}`;
                let lbl = baseLbl;
                if ('rate_percent' in el && el.rate_percent !== undefined && el.rate_percent !== null && el.rate_percent !== '') {
                  const rn = Number(el.rate_percent);
                  if (isFinite(rn)) lbl = `${baseLbl} (${rn}%)`;
                } else if ('rate' in el && el.rate !== undefined && el.rate !== null && el.rate !== '') {
                  const r = Number(el.rate);
                  const extra = Number(el.extra_units ?? el.units ?? el.count ?? 0);
                  if (isFinite(r) && extra > 0) lbl = `${baseLbl} (${extra} × ${formatCurrency(r)})`;
                  else if (isFinite(r)) lbl = `${baseLbl} (${formatCurrency(r)} each)`;
                }
                const amt = (el.amount ?? el.total ?? el.value ?? 0);
                pushItem(lbl, amt);
              } else {
                // object without amount -> flatten its keys
                walk(el, `${groupLabel || 'Group'} ${idx + 1}`);
              }
            } else if (typeof el === 'number') {
              pushItem(`${groupLabel || 'Item'} ${idx + 1}`, el);
            } else if (typeof el === 'string') {
              // try parse numeric, else just label
              const n = Number(el);
              if (isFinite(n)) pushItem(`${groupLabel || 'Item'} ${idx + 1}`, n);
              else pushItem(el, 0);
            }
          });
          return;
        }
        if (t === 'object') {
          // Leaf-like object with amount and label/name/description/item
          if ('amount' in node && ('label' in node || 'name' in node || 'description' in node || 'item' in node)) {
            const baseLbl = node.label ?? node.name ?? node.description ?? node.item;
            let lbl = baseLbl;
            if ('rate_percent' in node && node.rate_percent !== undefined && node.rate_percent !== null && node.rate_percent !== '') {
              const rn = Number(node.rate_percent);
              if (isFinite(rn)) lbl = `${baseLbl} (${rn}%)`;
            } else if ('rate' in node && node.rate !== undefined && node.rate !== null && node.rate !== '') {
              const r = Number(node.rate);
              const extra = Number(node.extra_units ?? node.units ?? node.count ?? 0);
              if (isFinite(r) && extra > 0) lbl = `${baseLbl} (${extra} × ${formatCurrency(r)})`;
              else if (isFinite(r)) lbl = `${baseLbl} (${formatCurrency(r)} each)`;
            }
            const amt = (node.amount ?? node.total ?? node.value ?? 0);
            pushItem(lbl, amt);
            return;
          }
          // If object holds an 'items' array, flatten it as the breakdown and ignore metadata
          if (Array.isArray(node.items)) {
            node.items.forEach((row, idx) => {
              const baseLbl = row?.label ?? row?.name ?? row?.description ?? row?.item ?? `Item ${idx + 1}`;
              let lbl = baseLbl;
              if (row && row.rate_percent !== undefined && row.rate_percent !== null && row.rate_percent !== '') {
                const n = Number(row.rate_percent);
                if (isFinite(n)) lbl = `${baseLbl} (${n}%)`;
              } else if (row && row.rate !== undefined && row.rate !== null && row.rate !== '') {
                const r = Number(row.rate);
                const extra = Number(row.extra_units ?? row.units ?? row.count ?? 0);
                if (isFinite(r) && extra > 0) lbl = `${baseLbl} (${extra} × ${formatCurrency(r)})`;
                else if (isFinite(r)) lbl = `${baseLbl} (${formatCurrency(r)} each)`;
              }
              const amt = (row && (row.amount ?? row.total ?? row.value)) ?? 0;
              pushItem(lbl, amt);
            });
            return;
          }

          const metaKeys = new Set([
            'purpose','category','category_id','categoryid','business_id','businessid',
            'business_status','status','total','total_amount','totalamount'
          ]);
          Object.keys(node).forEach((k) => {
            const v = node[k];
            const kl = String(k).toLowerCase();
            if (metaKeys.has(kl)) return; // skip metadata fields from breakdown
            if (v && typeof v === 'object') {
              // For nested containers named items/breakdown/details, avoid extra header
              if (/^items$|^breakdown$|^details$/i.test(k)) {
                walk(v, undefined);
              } else {
                rows.push({ type: 'header', label: toTitle(k) });
                walk(v, k);
              }
            } else if (typeof v === 'number') {
              pushItem(k, v);
            } else if (typeof v === 'string') {
              // ignore non-numeric strings in objects (likely metadata like 'Registration')
              const n = Number(v);
              if (isFinite(n)) pushItem(k, n);
            }
          });
          return;
        }
      };

      walk(details, undefined);
      return rows;
    }

    function openModal(modal, dialog) {
      modal.classList.remove('hidden');
      modal.classList.add('flex');
      // focus dialog for accessibility
      setTimeout(() => dialog?.focus?.(), 0);
    }

    function closeModal(modal) {
      modal.classList.add('hidden');
      modal.classList.remove('flex');
    }

    function escapeHtml(str) {
      if (!str) return '';
      return String(str).replace(/[&<>"'`]/g, s => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;','`':'&#96;'}[s]));
    }

    function formatCurrency(n) {
      try { return new Intl.NumberFormat(undefined, { style: 'currency', currency: 'PHP', maximumFractionDigits: 2 }).format(n); } catch (e) { return n; }
    }
  })();
</script>
