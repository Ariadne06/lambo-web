{% extends 'base_sec.html' %}

{% block title %}Barangay Clearance{% endblock %}

{% block content %}
<div class="px-6 py-6 relative">
  <div class="absolute left-0 top-0 h-full w-[3px] bg-red-700"></div>
  <h1 class="text-lg font-semibold text-red-700 mb-6">Barangay Clearance</h1>

  <form method="post" action="{% url 'secretary_module:submit_barangay_clearance_application' %}" class="space-y-10 w-full lg:w-3/4 max-w-6xl mx-auto" id="create-app-form">
    {% csrf_token %}
    <div class="bg-white rounded-2xl border border-gray-200 shadow-sm p-6 md:p-7">
      <div class="inline-flex items-center gap-3 rounded-lg bg-red-700 text-white px-4 py-2 mb-4">
        <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4" viewBox="0 0 24 24" fill="currentColor"><path d="M11 15h2V7h-2v8Zm0 4h2v-2h-2v2ZM1 21h22L12 2 1 21Z"/></svg>
        <span class="font-semibold">Purpose</span>
      </div>
      <label for="purpose-select" class="block text-sm text-gray-600 mb-1">Purpose</label>
      <select id="purpose-select" name="purpose" class="w-full rounded-md border border-gray-300 px-3 py-2 bg-white focus:outline-none focus:ring-2 focus:ring-red-600">
        <option value="" selected disabled>Please select purpose</option>
        {% if other_clearances %}
          {% for oc in other_clearances %}
            <option value="{{ oc.other_clearance_id }}">{{ oc.purpose_name }}</option>
          {% endfor %}
        {% else %}
          <option value="" disabled>No purposes available</option>
        {% endif %}
      </select>
    </div>

    <div class="bg-white rounded-2xl border border-gray-200 shadow-sm p-6 space-y-4">
      <div class="grid grid-cols-1 gap-4">
        <label class="block text-sm font-medium text-gray-700">Search resident (name or code)</label>
        <div class="relative">
          <input id="search-query" type="search" class="w-full rounded-md border border-gray-300 pl-10 pr-12 py-2 focus:outline-none focus:ring-2 focus:ring-red-600" placeholder="Search resident (name or code)...">
          <svg class="pointer-events-none absolute left-3 top-1/2 -translate-y-1/2 h-5 w-5 text-gray-400" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor"><path d="M10 2a8 8 0 1 0 4.9 14.32l4.39 4.39 1.41-1.41-4.39-4.39A8 8 0 0 0 10 2Zm0 2a6 6 0 1 1 0 12A6 6 0 0 1 10 4Z"/></svg>
          <div id="search-spinner" class="hidden absolute right-16 top-1/2 -translate-y-1/2 text-gray-400">
            <svg class="animate-spin h-5 w-5" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor"><circle cx="12" cy="12" r="9" stroke-width="2" class="opacity-25"/><path d="M21 12a9 9 0 0 1-9 9" stroke-width="2" class="opacity-75"/></svg>
          </div>
          <button type="button" id="search-clear" class="hidden absolute right-3 top-1/2 -translate-y-1/2 text-gray-400 hover:text-gray-600" aria-label="Clear search">✕</button>
        </div>
        <div id="search-status" class="text-xs text-gray-500"></div>
        <div id="search-results" class="space-y-2" role="listbox" aria-live="polite" aria-label="Search results"></div>
      </div>

      <div id="selected-details" class="mt-6 pt-5 border-t border-gray-200 hidden">
        <div class="mb-2 text-xs font-semibold text-gray-700 uppercase tracking-wide flex items-center gap-2">
          <span class="inline-block h-1.5 w-1.5 rounded-full bg-green-600"></span>
          <span id="selected-header-text">Selected resident</span>
        </div>
        <div class="rounded-lg border border-green-200 bg-green-50 p-4 flex gap-3">
          <div class="text-green-600 mt-1" aria-hidden="true">
            <svg class="h-5 w-5" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor"><path d="M12 12a5 5 0 1 0 0-10 5 5 0 0 0 0 10Zm-7 9a7 7 0 0 1 14 0v1H5v-1Z"/></svg>
          </div>
          <div class="flex-1 min-w-0 space-y-1">
            <div class="flex items-center gap-2">
              <span id="sel-type-pill" class="id-pill">Resident</span>
              <div id="sel-name" class="text-sm font-semibold text-gray-900"></div>
            </div>
            <div id="sel-meta" class="text-[11px] text-gray-600 hidden"></div>
            <div id="sel-address" class="text-xs text-gray-600 hidden"></div>
          </div>
        </div>
      </div>

      <div class="flex gap-3 mt-4">
        <button type="button" id="preview-btn" class="px-4 py-2 bg-red-700 text-white rounded-md">Preview breakdown</button>
        <button type="submit" id="create-btn" class="px-4 py-2 bg-green-600 text-white rounded-md disabled:opacity-60 disabled:cursor-not-allowed">Create request (walk‑in)</button>
      </div>
    </div>
  </form>
</div>

<div id="preview-modal" class="fixed inset-0 z-50 hidden items-center justify-center bg-black/50" aria-hidden="true">
  <div id="preview-dialog" role="dialog" aria-modal="true" aria-labelledby="preview-title" class="bg-white rounded-xl shadow-2xl w-full max-w-2xl mx-4 overflow-hidden">
    <div class="flex items-center justify-between border-b px-5 py-4 bg-gray-50">
      <div class="flex items-center gap-3">
        <h3 id="preview-title" class="text-base font-semibold text-gray-900">Fee breakdown preview</h3>
        <span id="preview-purpose-pill" class="hidden text-xs font-medium rounded-full px-2.5 py-0.5 bg-red-100 text-red-700"></span>
      </div>
      <button id="preview-close" class="inline-flex h-8 w-8 items-center justify-center rounded-full hover:bg-gray-200 text-gray-600" aria-label="Close">✕</button>
    </div>
    <div id="print-area" class="p-6">
      <div id="preview-header" class="mb-4"></div>
      <div class="overflow-hidden rounded-lg border border-gray-200">
        <table class="min-w-full divide-y divide-gray-200">
          <thead class="bg-gray-50"><tr><th class="px-4 py-2 text-left text-xs font-semibold text-gray-600 uppercase tracking-wider">Description</th><th class="px-4 py-2 text-right text-xs font-semibold text-gray-600 uppercase tracking-wider">Amount</th></tr></thead>
          <tbody id="preview-items" class="divide-y divide-gray-100 bg-white"></tbody>
          <tfoot class="bg-gray-50"><tr><td class="px-4 py-3 text-right text-sm font-semibold text-gray-800">Total</td><td id="preview-total" class="px-4 py-3 text-right text-lg font-bold text-gray-900"></td></tr></tfoot>
        </table>
      </div>
      <div id="preview-notes" class="mt-4 text-xs text-gray-500"></div>
    </div>
    <div class="flex items-center justify-end gap-3 px-5 py-4 border-t bg-white">
      <button id="preview-close-2" class="px-3 py-2 text-sm bg-red-700 hover:bg-red-800 text-white rounded-md">Close</button>
    </div>
  </div>
</div>

<!-- Submission Result Modal -->
<div id="result-modal" class="fixed inset-0 z-50 hidden items-center justify-center bg-black/50" aria-hidden="true">
  <div class="bg-white rounded-xl shadow-2xl w-full max-w-md mx-4 overflow-hidden" role="dialog" aria-modal="true" aria-labelledby="result-title">
    <div class="flex items-center justify-between border-b px-5 py-4 bg-gray-50">
      <h3 id="result-title" class="text-base font-semibold text-gray-900">Submission Status</h3>
      <button id="result-close" class="inline-flex h-8 w-8 items-center justify-center rounded-full hover:bg-gray-200 text-gray-600" aria-label="Close">✕</button>
    </div>
    <div class="p-6 space-y-4">
      <div id="result-message" class="text-sm"></div>
      <div id="result-actions" class="flex gap-3 justify-end"></div>
    </div>
  </div>
</div>

<style>
  @media print { body * { visibility: hidden; } #print-area, #print-area * { visibility: visible; } #print-area { position: absolute; inset: 0; } }
  .result-item { transition: background-color 120ms ease, box-shadow 120ms ease, outline-color 120ms ease; }
  .result-item:hover { background-color: rgb(249 250 251); }
  .result-item.active { outline: 2px solid rgb(22 163 74); background-color: rgb(236 253 245); }
  .result-item mark { background: transparent; color: inherit; padding: 0; }
  .id-pill { display: inline-flex; align-items: center; gap: 6px; padding: 2px 8px; border-radius: 9999px; background: #f3f4f6; color: #374151; font-size: 11px; font-weight: 600; text-transform: uppercase; letter-spacing: .02em; border: 1px solid #e5e7eb; }
  button[disabled] { opacity: .6; cursor: not-allowed; }
</style>

<script>
 (function(){
  const search = document.getElementById('search-query');
  const results = document.getElementById('search-results');
  const statusEl = document.getElementById('search-status');
  const spinner = document.getElementById('search-spinner');
  const clearBtn = document.getElementById('search-clear');
  const purposeSelect = document.getElementById('purpose-select');
  const selected = document.getElementById('selected-details');
  const selName = document.getElementById('sel-name');
  const selAddr = document.getElementById('sel-address');
  const selMeta = document.getElementById('sel-meta');
  const formEl = document.getElementById('create-app-form');
  const createBtn = document.getElementById('create-btn');
  let debounceId = null, currentController = null, activeIndex = -1;

  function updateCreateDisabled(){
    const residentSelected = document.querySelector('input[name="applicant_id"]')?.value?.trim();
    const purposeSelected = purposeSelect?.value?.trim();
    createBtn.disabled = !(residentSelected && purposeSelected);
  }
  function resetSelection(){
    selected.classList.add('hidden'); selName.textContent=''; selAddr.textContent=''; selAddr.classList.add('hidden'); selMeta.textContent=''; selMeta.classList.add('hidden');
    const rid=document.querySelector('input[name="applicant_id"]'); if(rid) rid.value='';
    Array.from(results.querySelectorAll('.result-item.active')).forEach(el=>el.classList.remove('active'));
    updateCreateDisabled();
  }
  purposeSelect?.addEventListener('change', updateCreateDisabled);
  function setSpinner(show){ spinner.classList.toggle('hidden', !show); }
  function setClearVisible(show){ clearBtn.classList.toggle('hidden', !show); }
  function highlight(text,q){ if(!text) return ''; const esc=s=>String(s).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;','\'':'&#39;'}[m])); if(!q) return esc(text); try{ const re=new RegExp(`(${q.replace(/[.*+?^${}()|[\]\\]/g,'\\$&')})`,'ig'); return esc(text).replace(re,'<mark>$1</mark>'); }catch{return esc(text);} }
  function setActive(idx){ const items=Array.from(results.querySelectorAll('[role="option"]')); items.forEach((el,i)=>{ el.classList.toggle('active',i===idx); el.setAttribute('aria-selected', i===idx?'true':'false'); }); activeIndex=idx; if(idx>=0 && items[idx]) items[idx].scrollIntoView({block:'nearest'}); }
  async function renderResults(data){ results.innerHTML=''; if(!Array.isArray(data)||data.length===0){ statusEl.textContent='No results'; results.innerHTML='<div class="text-sm text-gray-500">No results</div>'; resetSelection(); return; } const filtered=data.filter(r=>r&&r.resident_id); if(filtered.length===0){ statusEl.textContent='No resident results'; results.innerHTML='<div class="text-sm text-gray-500">No resident results</div>'; resetSelection(); return; } statusEl.textContent=`${filtered.length} result${filtered.length>1?'s':''}`; filtered.forEach(item=>{ const div=document.createElement('div'); div.className='result-item p-3 border border-gray-200 rounded-lg cursor-pointer shadow-sm hover:shadow transition-shadow flex items-start gap-3'; div.setAttribute('role','option'); div.setAttribute('tabindex','-1'); div.dataset.type='resident'; div.dataset.id=item.resident_id; if(item.resident_code) div.dataset.residentCode=item.resident_code; if(item.complete_address) div.dataset.completeAddress=item.complete_address; if(item.dob) div.dataset.dob=item.dob; const title=item.full_name||''; const code=item.resident_code?`Code: ${item.resident_code}`:''; const addr=item.complete_address?item.complete_address:''; const dob=item.dob?`DOB: ${item.dob}`:''; const meta=[code,dob].filter(Boolean).join(' · '); div.innerHTML=`<div class='mt-0.5 shrink-0 text-gray-500' aria-hidden='true'><svg class='h-5 w-5' xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='currentColor'><path d='M12 12a5 5 0 1 0 0-10 5 5 0 0 0 0 10Zm-7 9a7 7 0 0 1 14 0v1H5v-1Z'/></svg></div><div class='min-w-0'><div class='flex items-center gap-2'><span class='id-pill'>Resident</span><div class='text-sm font-medium text-gray-900 truncate'>${highlight(title,search.value)}</div></div><div class='text-[11px] text-gray-500 flex flex-col gap-0.5'>${meta?`<span>${meta}</span>`:''}${addr?`<span class='truncate' title='${highlight(addr,search.value)}'>${highlight(addr,search.value)}</span>`:''}</div></div><div class='ml-2 self-center text-gray-400' aria-hidden='true'>›</div>`; results.appendChild(div); div.addEventListener('click',()=>{ Array.from(results.querySelectorAll('[role="option"]')).forEach(el=>el.classList.remove('active')); div.classList.add('active'); activeIndex=Array.from(results.querySelectorAll('[role="option"]')).indexOf(div); const labelEl=div.querySelector('.text-sm.font-medium'); selName.textContent=labelEl?.textContent||''; const rid=document.querySelector('input[name="applicant_id"]')||(()=>{ const i=document.createElement('input'); i.type='hidden'; i.name='applicant_id'; formEl.appendChild(i); return i; })(); rid.value=div.dataset.id; selMeta.textContent=meta; selMeta.classList.toggle('hidden', !meta); selAddr.textContent=addr; selAddr.classList.toggle('hidden', !addr); selected.classList.remove('hidden'); updateCreateDisabled(); }); }); setActive(-1); }
  async function doSearchImmediate(){ const q=search.value.trim(); setClearVisible(q.length>0); resetSelection(); if(!q){ results.innerHTML=''; selected.classList.add('hidden'); return; } if(currentController) currentController.abort(); currentController=new AbortController(); const {signal}=currentController; setSpinner(true); try{ const url=new URL('{% url "secretary_module:application_search" %}', window.location.origin); url.searchParams.set('q', q); url.searchParams.set('fee_name','Barangay Clearance'); const resp=await fetch(url.toString(),{signal}); if(!resp.ok) throw new Error('Search failed'); const data=await resp.json(); await renderResults(data); } catch(err){ if(err.name!=='AbortError'){ results.innerHTML=`<div class='text-sm text-red-500'>Search error: ${err.message}</div>`; } } finally { setSpinner(false); } }
  search.addEventListener('input', ()=>{ const q=search.value; setClearVisible(q.length>0); resetSelection(); if(debounceId) clearTimeout(debounceId); debounceId=setTimeout(doSearchImmediate,500); });
  search.addEventListener('keydown', e=>{ const items=Array.from(results.querySelectorAll('[role="option"]')); if(e.key==='ArrowDown'){ e.preventDefault(); if(items.length) setActive(Math.min(items.length-1, activeIndex+1)); } else if(e.key==='ArrowUp'){ e.preventDefault(); if(items.length) setActive(Math.max(0, activeIndex-1)); } else if(e.key==='Enter'){ if(items.length && activeIndex>=0){ e.preventDefault(); items[activeIndex].click(); } else { e.preventDefault(); if(debounceId) clearTimeout(debounceId); doSearchImmediate(); } } });
  clearBtn.addEventListener('click', ()=>{ search.value=''; setClearVisible(false); results.innerHTML=''; resetSelection(); search.focus(); });
  document.getElementById('preview-btn')?.addEventListener('click', async()=>{ const csrf=document.querySelector('input[name="csrfmiddlewaretoken"]').value; const residentId=document.querySelector('input[name="applicant_id"]')?.value; const otherId=purposeSelect?.value; if(!residentId){ alert('Please select a resident first.'); return; } if(!otherId){ alert('Please select a purpose.'); return; } try{ const form=new FormData(); form.append('resident_id', residentId); form.append('other_clearance_id', otherId); const resp=await fetch('{% url "secretary_module:preview_barangay_clearance" %}',{method:'POST',credentials:'same-origin',headers:{'X-CSRFToken':csrf},body:form}); const data=await resp.json(); if(!data.ok){ showPreviewModal({error:data.message||JSON.stringify(data)}); return; } showPreviewModal(data); }catch(err){ showPreviewModal({error:err.message}); } });
  function showPreviewModal(data){ const modal=document.getElementById('preview-modal'); const dialog=document.getElementById('preview-dialog'); const header=document.getElementById('preview-header'); const itemsBody=document.getElementById('preview-items'); const totalEl=document.getElementById('preview-total'); const pill=document.getElementById('preview-purpose-pill'); const notes=document.getElementById('preview-notes'); header.innerHTML=''; itemsBody.innerHTML=''; totalEl.textContent=''; notes.textContent=''; pill.classList.add('hidden'); pill.textContent=''; if(data.error||data.ok===false){ header.innerHTML=`<div class='text-sm text-red-600'>Error: ${escapeHtml(data.error||data.message||'Unknown error')}</div>`; openModal(modal,dialog); return; } if(data.purpose){ pill.textContent=String(data.purpose); pill.classList.remove('hidden'); } const metaParts=[]; if(data.applicant_id) metaParts.push(`Resident ID: ${escapeHtml(String(data.applicant_id))}`); header.innerHTML=`<div class='mb-1 text-sm font-medium text-gray-900'>${escapeHtml(selName.textContent||'')}</div><div class='text-xs text-gray-500'>${metaParts.join(' · ')}</div>${selAddr.textContent?`<div class='mt-1 text-xs text-gray-600 flex items-start gap-1'><svg class='h-3.5 w-3.5 mt-0.5 text-gray-400' xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='currentColor'><path d='M12 2a7 7 0 0 0-7 7c0 5.25 7 13 7 13s7-7.75 7-13a7 7 0 0 0-7-7Zm0 9.5a2.5 2.5 0 1 1 0-5 2.5 2.5 0 0 1 0 5Z'/></svg><span>${escapeHtml(selAddr.textContent)}</span></div>`:''}`; const detailData=data.total_amount_details??data.items??data.breakdown??data.details; const rows=normalizeDetails(detailData); if(rows.length===0){ const tr=document.createElement('tr'); tr.innerHTML='<td class="px-4 py-3 text-sm text-gray-500" colspan="2">No line items returned.</td>'; itemsBody.appendChild(tr); } else { rows.forEach(r=>{ const tr=document.createElement('tr'); if(r.type==='header'){ tr.innerHTML=`<td class='px-4 py-2 text-xs font-semibold uppercase tracking-wide text-gray-600 bg-gray-50' colspan='2'>${escapeHtml(r.label)}</td>`; } else { tr.innerHTML=`<td class='px-4 py-2 text-sm text-gray-700'>${escapeHtml(r.label)}</td><td class='px-4 py-2 text-sm text-right font-mono ${Number(r.amount)<0?'text-red-600':'text-gray-900'}'>${formatCurrency(Number(r.amount))}</td>`; } itemsBody.appendChild(tr); }); } totalEl.textContent=formatCurrency(Number((data.total_amount??data.total??0))); const noteParts=[]; if(data.has_open_application&&data.open_application_id){ noteParts.push(`Note: Resident has an open application #${escapeHtml(String(data.open_application_id))}.`); } if(noteParts.length) notes.textContent=noteParts.join(' · '); openModal(modal,dialog); document.getElementById('preview-close').onclick=()=>closeModal(modal); document.getElementById('preview-close-2').onclick=()=>closeModal(modal); modal.onclick=e=>{ if(e.target===modal) closeModal(modal); }; document.addEventListener('keydown', function escHandler(ev){ if(ev.key==='Escape'){ closeModal(modal); document.removeEventListener('keydown', escHandler); } }); }
  function normalizeDetails(details){ if(details==null) return []; if(typeof details==='string'){ const t=details.trim(); if((t.startsWith('{')&&t.endsWith('}'))||(t.startsWith('[')&&t.endsWith(']'))){ try{ details=JSON.parse(t);}catch{} } } const rows=[]; const toTitle=s=>String(s||'').replace(/[_\-]+/g,' ').replace(/\s+/g,' ').trim().toLowerCase().replace(/\b\w/g,c=>c.toUpperCase()); const pushItem=(label,amount)=>{ if(!label&&label!==0) return; const num=Number(amount??0); rows.push({type:'item',label:toTitle(label),amount:isFinite(num)?num:0}); }; const walk=(node,group)=>{ if(node==null) return; const t=typeof node; if(t==='number'){ pushItem(group??'Item',node); return;} if(t==='string'){ pushItem(node,0); return;} if(Array.isArray(node)){ if(group && !/^items$|^breakdown$|^details$/i.test(String(group))){ rows.push({type:'header',label:toTitle(group)}); } node.forEach((el,i)=>{ if(el&&typeof el==='object'){ if('amount' in el){ const base=el.label??el.name??el.description??el.item??`${group||'Item'} ${i+1}`; let lbl=base; if('rate_percent' in el){ const rn=Number(el.rate_percent); if(isFinite(rn)) lbl=`${base} (${rn}%)`; } else if('rate' in el){ const r=Number(el.rate); const extra=Number(el.extra_units??el.units??el.count??0); if(isFinite(r)&&extra>0) lbl=`${base} (${extra} × ${formatCurrency(r)})`; else if(isFinite(r)) lbl=`${base} (${formatCurrency(r)} each)`; } const amt=(el.amount??el.total??el.value??0); pushItem(lbl,amt); } else { walk(el,`${group||'Group'} ${i+1}`); } } else if(typeof el==='number'){ pushItem(`${group||'Item'} ${i+1}`,el); } else if(typeof el==='string'){ const n=Number(el); if(isFinite(n)) pushItem(`${group||'Item'} ${i+1}`,n); else pushItem(el,0); } }); return;} if(t==='object'){ if('amount' in node && ('label' in node||'name' in node||'description' in node||'item' in node)){ const base=node.label??node.name??node.description??node.item; let lbl=base; if('rate_percent' in node){ const rn=Number(node.rate_percent); if(isFinite(rn)) lbl=`${base} (${rn}%)`; } else if('rate' in node){ const r=Number(node.rate); const extra=Number(node.extra_units??node.units??node.count??0); if(isFinite(r)&&extra>0) lbl=`${base} (${extra} × ${formatCurrency(r)})`; else if(isFinite(r)) lbl=`${base} (${formatCurrency(r)} each)`; } const amt=(node.amount??node.total??node.value??0); pushItem(lbl,amt); return;} if(Array.isArray(node.items)){ node.items.forEach((row,i)=>{ const base=row?.label??row?.name??row?.description??row?.item??`Item ${i+1}`; let lbl=base; if(row && row.rate_percent!==undefined){ const n=Number(row.rate_percent); if(isFinite(n)) lbl=`${base} (${n}%)`; } else if(row && row.rate!==undefined){ const r=Number(row.rate); const extra=Number(row.extra_units??row.units??row.count??0); if(isFinite(r)&&extra>0) lbl=`${base} (${extra} × ${formatCurrency(r)})`; else if(isFinite(r)) lbl=`${base} (${formatCurrency(r)} each)`; } const amt=(row && (row.amount??row.total??row.value))??0; pushItem(lbl,amt); }); return;} const meta=new Set(['purpose','total','total_amount']); Object.keys(node).forEach(k=>{ const v=node[k]; if(meta.has(String(k).toLowerCase())) return; if(v&&typeof v==='object'){ if(/^items$|^breakdown$|^details$/i.test(k)){ walk(v,undefined); } else { rows.push({type:'header',label:toTitle(k)}); walk(v,k); } } else if(typeof v==='number'){ pushItem(k,v); } else if(typeof v==='string'){ const n=Number(v); if(isFinite(n)) pushItem(k,n); } }); }}; walk(details,undefined); return rows; }
  function openModal(modal,dialog){ modal.classList.remove('hidden'); modal.classList.add('flex'); setTimeout(()=>dialog?.focus?.(),0); }
  function closeModal(modal){ modal.classList.add('hidden'); modal.classList.remove('flex'); }
  function escapeHtml(str){ return !str?'':String(str).replace(/[&<>"'`]/g,s=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;','\'':'&#39;','`':'&#96;'}[s])); }
  function formatCurrency(n){ try { return new Intl.NumberFormat(undefined,{style:'currency',currency:'PHP',maximumFractionDigits:2}).format(n); } catch { return n; } }
  formEl.addEventListener('submit', e=>{ const residentId=document.querySelector('input[name="applicant_id"]')?.value?.trim(); const purposeVal=purposeSelect?.value?.trim(); if(!residentId||!purposeVal){ e.preventDefault(); alert('Please select a resident and purpose before submitting.'); } });
  // Enhanced AJAX submission with result modal
  formEl.addEventListener('submit', async (e) => {
    e.preventDefault();
    const residentId=document.querySelector('input[name="applicant_id"]')?.value?.trim();
    const purposeVal=purposeSelect?.value?.trim();
    if(!residentId||!purposeVal){ showResult(false,'Please select a resident and purpose before submitting.'); return; }
    createBtn.disabled=true; createBtn.textContent='Submitting...';
    try {
      const csrf=document.querySelector('input[name="csrfmiddlewaretoken"]').value;
      const fd=new FormData(formEl);
      // Ensure we send the resident id and purpose (alias other_clearance_id)
      fd.set('applicant_id', residentId);
      fd.set('other_clearance_id', purposeVal);
      const resp=await fetch(formEl.action, {method:'POST', headers:{'X-CSRFToken':csrf,'X-Requested-With':'XMLHttpRequest','Accept':'application/json'}, body:fd});
      const data=await resp.json().catch(()=>({ok:false,error:'Invalid server response.'}));
      if(!data.ok){
        const msg=data.error || data.message || 'Failed to create application.';
        showResult(false, msg);
        return;
      }
      // Do not append application ID to success message per request
      const msg=(data.message||'Application created.');
      showResult(true, msg);
    } catch(err){ showResult(false, err.message || 'Unexpected error.'); } finally { createBtn.disabled=false; createBtn.textContent='Create request (walk‑in)'; }
  }, { once: false });

  function showResult(success, message){
    const modal=document.getElementById('result-modal');
    const msgEl=document.getElementById('result-message');
    const actions=document.getElementById('result-actions');
    msgEl.textContent=''; msgEl.className='text-sm';
    msgEl.classList.add(success?'text-green-700':'text-red-700');
    msgEl.textContent=message || (success ? 'Action completed.' : 'An error occurred.');
    actions.innerHTML='';
    if(success){
      const stay=document.createElement('button');
      stay.type='button'; stay.textContent='Stay Here';
      stay.className='px-4 py-2 rounded-md bg-gray-100 hover:bg-gray-200 text-sm';
      stay.onclick=()=>closeResultModal();
      actions.appendChild(stay);
      const go=document.createElement('button');
      go.type='button'; go.textContent='Go to Applications';
      go.className='px-4 py-2 rounded-md bg-green-600 hover:bg-green-700 text-white text-sm';
      go.onclick=()=>{ window.location.href='{% url "secretary_module:applications" %}'; };
      actions.appendChild(go);
    } else {
      const close=document.createElement('button');
      close.type='button'; close.textContent='Close';
      close.className='px-4 py-2 rounded-md bg-red-600 hover:bg-red-700 text-white text-sm';
      close.onclick=()=>closeResultModal();
      actions.appendChild(close);
    }
    openResultModal(modal);
  }
  function openResultModal(modal){ modal.classList.remove('hidden'); modal.classList.add('flex'); }
  function closeResultModal(){ const modal=document.getElementById('result-modal'); modal.classList.add('hidden'); modal.classList.remove('flex'); }
  document.getElementById('result-close').onclick=()=>closeResultModal();
  document.getElementById('result-modal').onclick=(e)=>{ if(e.target.id==='result-modal') closeResultModal(); };
  updateCreateDisabled();
})();
</script>
{% endblock %}
