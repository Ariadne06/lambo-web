{% extends 'base_admin.html' %}
{% block title %}Resident Information — Address{% endblock %}

{% block content %}
<div class="px-6 py-6">
  <h1 class="text-lg font-semibold text-red-700 mb-4">Resident Information</h1>

  <div class="bg-white rounded-2xl border border-gray-200 shadow-sm p-6 relative max-w-4xl mx-auto">
    <!-- thin red bar -->
    <div class="absolute left-0 top-0 h-full w-1 bg-red-700 rounded-l-2xl"></div>

    <!-- Step header -->
    <div class="flex items-center gap-8 text-sm font-medium mb-8 justify-center">
      <div class="flex items-center gap-2 text-gray-400">
        <span>1</span><span>Personal Data</span>
      </div>
      <div class="flex items-center gap-2">
        <span class="text-red-700">2</span><span class="text-red-700">Address</span>
      </div>
    </div>

    <h3 class="text-sm font-semibold text-gray-800 mb-4">Address</h3>

    <!-- Form -->
    <form class="grid grid-cols-1 md:grid-cols-3 gap-x-10 gap-y-4 text-sm">
      <!-- left 2/3: address inputs -->
      <div class="md:col-span-2 space-y-4">
        <div>
          <label class="block text-gray-700 mb-1">House Number</label>
          <input type="text" value="Block 12 Lot 5"
                 class="w-full rounded-md border border-gray-300 px-3 py-2 focus:outline-none focus:ring-2 focus:ring-red-600">
        </div>
        <div>
          <label class="block text-gray-700 mb-1">Street</label>
          <input type="text" value="I2 Street"
                 class="w-full rounded-md border border-gray-300 px-3 py-2 focus:outline-none focus:ring-2 focus:ring-red-600">
        </div>
        <div>
          <label class="block text-gray-700 mb-1">Barangay</label>
          <input type="text" value="Cansaga"
                 class="w-full rounded-md border border-gray-300 px-3 py-2 focus:outline-none focus:ring-2 focus:ring-red-600">
        </div>
      </div>

      <!-- right 1/3: voter -->
      <div>
        <p class="text-gray-700 font-medium mb-2">Registered Voter</p>
        <label class="flex items-center gap-2 mb-2">
          <input type="checkbox" class="rounded border-gray-300">
          <span class="text-gray-700">Yes</span>
        </label>
        <label class="flex items-center gap-2">
          <input type="checkbox" class="rounded border-gray-300">
          <span class="text-gray-700">No</span>
        </label>
      </div>
    </form>

    <!-- Actions -->
    <div class="mt-8 flex items-center">
      <a href="#"
         class="inline-flex items-center justify-center rounded-xl bg-red-600 px-5 py-2 text-white text-sm font-medium shadow hover:bg-red-700">
        Back Page
      </a>
    </div>
  </div>
</div>
{% endblock %}
