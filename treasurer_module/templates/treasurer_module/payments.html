{% extends 'base_admin.html' %}

{% block title %}
    Treasurer
{% endblock %}

{% block content %}
    <div class="px-6 py-8">
  <h1 class="text-2xl font-semibold text-red-700 mb-6">Payments</h1>

  <div class="bg-white shadow-sm rounded-2xl border border-gray-200">
    <div class="overflow-x-auto">
      <table class="min-w-full divide-y divide-gray-200 text-sm">
        <thead class="bg-gray-50">
          <tr class="text-left text-gray-600">
            <th class="px-6 py-3 font-semibold">Full Name</th>
            <th class="px-6 py-3 font-semibold">Application</th>
            <th class="px-6 py-3 font-semibold">Amount</th>
            <th class="px-6 py-3 font-semibold">Status</th>
            <th class="px-6 py-3 font-semibold text-center">Action</th>
          </tr>
        </thead>
        <tbody class="divide-y divide-gray-100">
          <tr class="hover:bg-gray-50">
            <td class="px-6 py-4">Adrianne Villarta</td>
            <td class="px-6 py-4">Barangay Clearance</td>
            <td class="px-6 py-4">300 Php</td>
            <td class="px-6 py-4">
              <span class="bg-yellow-100 text-yellow-700 text-xs px-2.5 py-1 rounded-full">Pending</span>
            </td>
            <td class="px-6 py-4">
              <div class="flex items-center justify-center gap-2">
                <button class="h-8 w-8 flex items-center justify-center rounded-full border hover:border-green-400 hover:bg-green-50">
                  <!-- Check icon -->
                  <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.75">
                    <path stroke-linecap="round" stroke-linejoin="round" d="m4.5 12.75 6 6 9-13.5"/>
                  </svg>
                </button>
                <button class="h-8 w-8 flex items-center justify-center rounded-full border hover:border-red-400 hover:bg-red-50">
                  <!-- X icon -->
                  <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.75">
                    <path stroke-linecap="round" stroke-linejoin="round" d="M6 18 18 6M6 6l12 12"/>
                  </svg>
                </button>
              </div>
            </td>
          </tr>

          <!-- Repeat rows -->
          <tr class="hover:bg-gray-50">
            <td class="px-6 py-4">Adrian Medalla</td>
            <td class="px-6 py-4">Barangay Clearance</td>
            <td class="px-6 py-4">300 Php</td>
            <td class="px-6 py-4">
              <span class="bg-yellow-100 text-yellow-700 text-xs px-2.5 py-1 rounded-full">Pending</span>
            </td>
            <td class="px-6 py-4">
              <div class="flex items-center justify-center gap-2">
                <button class="h-8 w-8 flex items-center justify-center rounded-full border hover:border-green-400 hover:bg-green-50">
                  <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.75">
                    <path stroke-linecap="round" stroke-linejoin="round" d="m4.5 12.75 6 6 9-13.5"/>
                  </svg>
                </button>
                <button class="h-8 w-8 flex items-center justify-center rounded-full border hover:border-red-400 hover:bg-red-50">
                  <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.75">
                    <path stroke-linecap="round" stroke-linejoin="round" d="M6 18 18 6M6 6l12 12"/>
                  </svg>
                </button>
              </div>
            </td>
          </tr>

          <!-- You can duplicate more rows here as needed -->
        </tbody>
      </table>
    </div>

    <!-- Pagination -->
    <div class="flex items-center justify-center gap-1 px-4 py-4 text-sm">
      <span class="px-3 py-1.5 rounded-md border border-gray-100 text-gray-400 cursor-not-allowed">Prev</span>
      <a href="#" class="px-3 py-1.5 rounded-md border border-gray-200 hover:bg-gray-50">1</a>
      <a href="#" class="px-3 py-1.5 rounded-md border border-gray-200 hover:bg-gray-50">2</a>
      <a href="#" class="px-3 py-1.5 rounded-md border border-gray-200 hover:bg-gray-50">3</a>
      <a href="#" class="px-3 py-1.5 rounded-md border border-gray-200 hover:bg-gray-50">4</a>
      <a href="#" class="px-3 py-1.5 rounded-md border border-gray-200 hover:bg-gray-50">5</a>
      <span class="px-3 py-1.5">...</span>
      <a href="#" class="px-3 py-1.5 rounded-md border border-gray-200 hover:bg-gray-50">60</a>
      <a href="#" class="px-3 py-1.5 rounded-md border border-gray-200 text-gray-700 hover:bg-gray-50">Next</a>
    </div>
  </div>
</div>


 
{% endblock %}
