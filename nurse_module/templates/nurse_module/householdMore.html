{% extends 'base_admin.html' %}

{% block title %}
    Household Visit & Members
{% endblock %}

{% block content %}
<div class="px-4 py-4">
  <div class="bg-white rounded-2xl border border-gray-200 shadow-sm p-4 md:p-6">
    <!-- Visit / Household Info -->
    <form class="grid grid-cols-1 md:grid-cols-2 gap-x-6 gap-y-3">
      <!-- Left column -->
      <div class="space-y-3">
        <div>
          <label class="block text-sm font-medium text-gray-700">Household ID</label>
          <input type="text" value="10000" class="w-full rounded-md border border-gray-300 px-2 py-1.5" />
        </div>
        <div>
          <label class="block text-sm font-medium text-gray-700">Household No.</label>
          <input type="text" value="0001" class="w-full rounded-md border border-gray-300 px-2 py-1.5" />
        </div>
        <div>
          <label class="block text-sm font-medium text-gray-700">Family No.</label>
          <input type="text" value="0001-001" class="w-full rounded-md border border-gray-300 px-2 py-1.5" />
        </div>
        <div>
          <label class="block text-sm font-medium text-gray-700">Household Head</label>
          <input type="text" value="Adrianne Villarta" class="w-full rounded-md border border-gray-300 px-2 py-1.5" />
        </div>
        <div>
          <label class="block text-sm font-medium text-gray-700">Date of Visit</label>
          <select class="w-full rounded-md border border-gray-300 px-2 py-1.5">
            <option>1st Quarter</option>
            <option>2nd Quarter</option>
            <option>3rd Quarter</option>
            <option>4th Quarter</option>
          </select>
        </div>
        <div>
          <input type="text" value="01/01/2020" class="w-full rounded-md border border-gray-300 px-2 py-1.5" />
        </div>
      </div>

      <!-- Right column -->
      <div class="space-y-3">
        <div>
          <label class="block text-sm font-medium text-gray-700">Sitio/Purok</label>
          <input type="text" value="Purok 5" class="w-full rounded-md border border-gray-300 px-2 py-1.5" />
        </div>
        <div>
          <label class="block text-sm font-medium text-gray-700">Select One</label>
          <input type="text" value="Non-NHTS" class="w-full rounded-md border border-gray-300 px-2 py-1.5" />
        </div>
        <div>
          <label class="block text-sm font-medium text-gray-700">Barangay</label>
          <input type="text" value="Cansaga" class="w-full rounded-md border border-gray-300 px-2 py-1.5" />
        </div>
        <div>
          <label class="block text-sm font-medium text-gray-700">Type of Water Source</label>
          <input type="text" value="I- Point Source" class="w-full rounded-md border border-gray-300 px-2 py-1.5" />
        </div>
        <div>
          <label class="block text-sm font-medium text-gray-700">Toilet Facility</label>
          <input type="text" value="B- Connected to Septic and Sewerage System" class="w-full rounded-md border border-gray-300 px-2 py-1.5" />
        </div>
        <div>
          <label class="block text-sm font-medium text-gray-700">Waste Management</label>
          <input type="text" value="A- Waste Segregation" class="w-full rounded-md border border-gray-300 px-2 py-1.5" />
        </div>
        <div class="grid grid-cols-2 gap-2">
          <div>
            <label class="block text-sm font-medium text-gray-700">Renter (Y/N)</label>
            <input type="text" value="No" class="w-full rounded-md border border-gray-300 px-2 py-1.5" />
          </div>
          <div>
            <label class="block text-sm font-medium text-gray-700">If Yes, Months</label>
            <input type="text" placeholder="Enter No of Months" class="w-full rounded-md border border-gray-300 px-2 py-1.5" />
          </div>
        </div>
        <div>
          <label class="block text-sm font-medium text-gray-700">With blind drainage?</label>
          <input type="text" value="No" class="w-full rounded-md border border-gray-300 px-2 py-1.5" />
        </div>
      </div>
    </form>

    <!-- Members Table -->
    <h2 class="mt-6 mb-3 text-lg font-semibold text-red-700">Household Member</h2>

    <div class="overflow-x-auto rounded-xl border border-gray-200">
      <table class="min-w-full divide-y divide-gray-200 text-sm">
        <thead class="bg-gray-50">
          <tr class="text-left text-gray-600">
            <th class="px-4 py-2 font-semibold">Resident ID.</th>
            <th class="px-4 py-2 font-semibold">First Name</th>
            <th class="px-4 py-2 font-semibold">M.I</th>
            <th class="px-4 py-2 font-semibold">Last Name</th>
            <th class="px-4 py-2 font-semibold">Date of Birth</th>
            <th class="px-4 py-2 font-semibold">Sex</th>
            <th class="px-4 py-2 font-semibold">Religion</th>
            <th class="px-4 py-2 font-semibold">Status</th>
            <th class="px-4 py-2 font-semibold text-right">Action</th>
          </tr>
        </thead>
        <tbody class="divide-y divide-gray-100">
          <tr class="hover:bg-gray-50">
            <td class="px-4 py-2">1000</td>
            <td class="px-4 py-2">Adrianne</td>
            <td class="px-4 py-2">C.</td>
            <td class="px-4 py-2">Villarta</td>
            <td class="px-4 py-2">08/08/2028</td>
            <td class="px-4 py-2">Male</td>
            <td class="px-4 py-2">Catholic</td>
            <td class="px-4 py-2">Single</td>
            <td class="px-4 py-2">
              <button class="flex h-7 w-7 items-center justify-center rounded-full border hover:bg-gray-50 hover:border-gray-400">
                <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4" viewBox="0 0 24 24" fill="currentColor">
                  <circle cx="5" cy="12" r="1.5"/><circle cx="12" cy="12" r="1.5"/><circle cx="19" cy="12" r="1.5"/>
                </svg>
              </button>
            </td>
          </tr>
          <!-- Repeat for others -->
        </tbody>
      </table>
    </div>

    <!-- Back button -->
    <div class="mt-4 flex justify-end">
      <a href="#" class="inline-flex items-center justify-center rounded-xl bg-red-600 px-4 py-1.5 text-white text-sm font-medium shadow hover:bg-red-700">
        Back
      </a>
    </div>
  </div>
</div>
{% endblock %}
