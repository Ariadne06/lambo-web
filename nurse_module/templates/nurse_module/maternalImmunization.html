{% extends 'base_admin.html' %}

{% block title %}Nurse{% endblock %}

{% block content %}
<div class="px-6 py-8 flex justify-center">
  <!-- Card -->
  <div class="bg-white rounded-2xl border border-gray-200 shadow-sm p-6 md:p-10 w-full max-w-5xl">
    
    <!-- Header -->
    <h1 class="text-2xl font-semibold text-red-700 mb-6">Maternal Immunization</h1>

    <!-- Table -->
    <div class="overflow-x-auto">
      <table class="w-full border border-gray-300">
        <thead class="bg-gray-100">
          <tr>
            <th class="px-4 py-2 border border-gray-300 text-left">Vaccine</th>
            <th class="px-4 py-2 border border-gray-300 text-left">1st Dose</th>
            <th class="px-4 py-2 border border-gray-300 text-left">2nd Dose</th>
            <th class="px-4 py-2 border border-gray-300 text-left">3rd Dose</th>
            <th class="px-4 py-2 border border-gray-300 text-left">4th Dose</th>
            <th class="px-4 py-2 border border-gray-300 text-left">5th Dose</th>
            <th class="px-4 py-2 border border-gray-300 text-left">FIM Status</th>
          </tr>
        </thead>
        <tbody>
          <tr>
            <td class="px-4 py-2 border border-gray-300"></td>
            <td class="px-4 py-2 border border-gray-300"></td>
            <td class="px-4 py-2 border border-gray-300"></td>
            <td class="px-4 py-2 border border-gray-300"></td>
            <td class="px-4 py-2 border border-gray-300"></td>
            <td class="px-4 py-2 border border-gray-300"></td>
            <td class="px-4 py-2 border border-gray-300"></td>
          </tr>
        </tbody>
      </table>
    </div>

    <!-- Back Button -->
    <div class="pt-6">
      <a href="#"
         class="inline-flex items-center justify-center rounded-full bg-gradient-to-r from-red-600 to-red-500 px-5 py-2 text-white text-sm font-medium shadow-md hover:from-red-500 hover:to-red-400 hover:scale-105 transition">
        Back
      </a>
    </div>

  </div>
</div>
{% endblock %}
