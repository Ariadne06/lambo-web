{% extends 'base_admin.html' %}

{% block title %}Child Health Record{% endblock %}

{% block content %}
<div class="px-6 py-6">
  <div class="bg-white rounded-2xl border border-gray-200 shadow-sm p-6 md:p-8">

    <!-- Title -->
    <h2 class="text-lg font-semibold mb-6">Child Health Record</h2>

    <!-- Form -->
    <form class="grid grid-cols-1 md:grid-cols-3 gap-x-10 gap-y-5">
      <!-- Column 1 -->
      <div class="space-y-4">
        <div>
          <label class="block text-sm font-medium text-gray-700 mb-1">Child Full Name</label>
          <input type="text" value="Adrianne Medalla" class="w-full rounded-md border border-gray-300 px-3 py-2">
        </div>
        <div>
          <label class="block text-sm font-medium text-gray-700 mb-1">Mother's Full Name</label>
          <input type="text" value="Prescious Bugtai" class="w-full rounded-md border border-gray-300 px-3 py-2">
        </div>
        <div>
          <label class="block text-sm font-medium text-gray-700 mb-1">Father's Full Name</label>
          <input type="text" value="Miles Majaroocon" class="w-full rounded-md border border-gray-300 px-3 py-2">
        </div>
        <div>
          <label class="block text-sm font-medium text-gray-700 mb-1">Philhealth ID Number</label>
          <input type="text" value="0000" class="w-full rounded-md border border-gray-300 px-3 py-2">
        </div>
        <div>
          <label class="block text-sm font-medium text-gray-700 mb-1">Phone Number</label>
          <input type="text" value="09672672606" class="w-full rounded-md border border-gray-300 px-3 py-2">
        </div>
      </div>

      <!-- Column 2 -->
      <div class="space-y-4">
        <div>
          <label class="block text-sm font-medium text-gray-700 mb-1">Sex</label>
          <input type="text" value="Male" class="w-full rounded-md border border-gray-300 px-3 py-2">
        </div>
        <div>
          <label class="block text-sm font-medium text-gray-700 mb-1">Date of Birth</label>
          <input type="text" value="02/02/2020" class="w-full rounded-md border border-gray-300 px-3 py-2">
        </div>
        <div>
          <label class="block text-sm font-medium text-gray-700 mb-1">Time of Birth</label>
          <input type="text" value="11:20 PM" class="w-full rounded-md border border-gray-300 px-3 py-2">
        </div>
        <div class="grid grid-cols-2 gap-3">
          <div>
            <label class="block text-sm font-medium text-gray-700 mb-1">Birth Weight (Kg)</label>
            <input type="text" value="10 KG" class="w-full rounded-md border border-gray-300 px-3 py-2">
          </div>
          <div>
            <label class="block text-sm font-medium text-gray-700 mb-1">Birth Height (Cm)</label>
            <input type="text" value="120 CM" class="w-full rounded-md border border-gray-300 px-3 py-2">
          </div>
        </div>
        <div>
          <label class="block text-sm font-medium text-gray-700 mb-1">Place of Delivery</label>
          <input type="text" value="Cansaga" class="w-full rounded-md border border-gray-300 px-3 py-2">
        </div>
      </div>

      <!-- Column 3 -->
      <div class="space-y-4">
        <div>
          <label class="block text-sm font-medium text-gray-700 mb-1">TT Status of Mother</label>
          <input type="text" value="Active" class="w-full rounded-md border border-gray-300 px-3 py-2">
        </div>
        <div>
          <label class="block text-sm font-medium text-gray-700 mb-1">Date TT Status is Assessed</label>
          <input type="text" value="01/01/2020" class="w-full rounded-md border border-gray-300 px-3 py-2">
        </div>
        <div>
          <label class="block text-sm font-medium text-gray-700 mb-1">Newborn Screening Status</label>
          <input type="text" value="Done" class="w-full rounded-md border border-gray-300 px-3 py-2">
        </div>
        <div>
          <label class="block text-sm font-medium text-gray-700 mb-1">Date</label>
          <input type="text" value="02/05/2023" class="w-full rounded-md border border-gray-300 px-3 py-2">
        </div>

        <!-- Feeding Method -->
        <div>
          <label class="block text-sm font-medium text-gray-700 mb-1">Feeding Method</label>
          <div class="mt-1 space-y-1">
            <label class="flex items-center gap-2 text-sm">
              <input type="radio" name="feeding" class="h-3 w-3 rounded-full border-gray-400"> Breastfeeding
            </label>
            <label class="flex items-center gap-2 text-sm">
              <input type="radio" name="feeding" class="h-3 w-3 rounded-full border-gray-400"> Bottle feeding
            </label>
            <label class="flex items-center gap-2 text-sm">
              <input type="radio" name="feeding" checked class="h-3 w-3 rounded-full border-gray-400"> Mixed
            </label>
          </div>
        </div>
      </div>
    </form>

    <!-- Buttons Section (upgraded, eye-pleasing pills) -->
    <div class="mt-10 flex flex-col md:flex-row items-center justify-between gap-4">

      <!-- Back Button -->
      <a href="#"
         class="inline-flex items-center justify-center gap-2 rounded-full bg-gradient-to-r from-red-600 to-red-500 px-6 py-2 text-white text-sm font-medium shadow-md hover:from-red-500 hover:to-red-400 hover:scale-105 transform transition">
        Back
      </a>

      <!-- Main Action Buttons -->
      <div class="flex flex-wrap justify-center gap-3">
        <!-- Medical/Surgical -->
        <button type="button" class="inline-flex items-center gap-2 rounded-full bg-gradient-to-r from-red-600 to-red-500 px-5 py-2.5 text-white text-sm font-medium shadow-md hover:from-red-500 hover:to-red-400 hover:scale-105 transform transition">
          <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" viewBox="0 0 24 24" fill="currentColor">
            <path d="M11 7V5h2v2h2v2h-2v2h-2V9H9V7h2Zm-4 4V7a2 2 0 0 1 2-2h6a2 2 0 0 1 2 2v10a2 2 0 0 1-2 2H9a2 2 0 0 1-2-2v-6Z"/>
          </svg>
          Medical/Surgical
        </button>

        <!-- Immunization -->
        <button type="button" class="inline-flex items-center gap-2 rounded-full bg-gradient-to-r from-red-600 to-red-500 px-5 py-2.5 text-white text-sm font-medium shadow-md hover:from-red-500 hover:to-red-400 hover:scale-105 transform transition">
          <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" viewBox="0 0 24 24" fill="currentColor">
            <path d="m21 6-3-3-7.5 7.5-1-1L3 9l5.5 6.5 1-1L21 6Z"/>
          </svg>
          Immunization
        </button>

        <!-- Supplements -->
        <button type="button" class="inline-flex items-center gap-2 rounded-full bg-gradient-to-r from-red-600 to-red-500 px-5 py-2.5 text-white text-sm font-medium shadow-md hover:from-red-500 hover:to-red-400 hover:scale-105 transform transition">
          <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" viewBox="0 0 24 24" fill="currentColor">
            <path d="M7 3h10v6H7V3Zm-2 8h14v10H5V11Zm7-6h4v2h-4V5Z"/>
          </svg>
          Supplements
        </button>

        <!-- Growth Monitoring -->
        <button type="button" class="inline-flex items-center gap-2 rounded-full bg-gradient-to-r from-red-600 to-red-500 px-5 py-2.5 text-white text-sm font-medium shadow-md hover:from-red-500 hover:to-red-400 hover:scale-105 transform transition">
          <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" viewBox="0 0 24 24" fill="currentColor">
            <path d="M5 3h2v18H5V3Zm12 0h2v18h-2V3ZM9 13h2v8H9v-8Zm6-6h2v14h-2V7Z"/>
          </svg>
          Growth Monitoring
        </button>
      </div>
    </div>

  </div>
</div>
{% endblock %}
