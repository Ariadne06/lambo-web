{% extends 'base_admin.html' %}

{% block title %}Nurse{% endblock %}

{% block content %}
<div class="px-6 py-8 flex justify-center">
  <div class="bg-white rounded-2xl border border-gray-200 shadow-sm p-6 md:p-8 w-full max-w-5xl">

    <!-- Header -->
    <h1 class="text-2xl font-semibold text-red-700 mb-6">General Health Information</h1>

    <!-- Top: avatar + name -->
    <div class="flex items-start gap-6 mb-6">
      <!-- Avatar -->
      <div class="shrink-0">
        <div class="h-28 w-28 rounded-full border-4 border-gray-200 bg-gray-50 grid place-content-center">
          <svg xmlns="http://www.w3.org/2000/svg" class="h-16 w-16 text-gray-400" viewBox="0 0 24 24" fill="currentColor">
            <path d="M12 12a5 5 0 1 0-5-5 5 5 0 0 0 5 5Zm0 2c-4.42 0-8 2.24-8 5v1h16v-1c0-2.76-3.58-5-8-5Z"/>
          </svg>
        </div>
      </div>

      <!-- Full name -->
      <div class="grow">
        <label class="block text-sm font-medium text-gray-700 mb-1">Full Name</label>
        <input type="text" value="Adrianne Villarta"
               class="w-full rounded-md border border-gray-300 px-3 py-2">
      </div>
    </div>

    <!-- Form grid -->
    <form class="grid grid-cols-1 md:grid-cols-2 gap-6">

      <!-- LEFT COLUMN -->
      <div class="space-y-4">
        <div>
          <label class="block text-sm font-medium text-gray-700 mb-1">Medical History</label>
          <input type="text" value="Diabetes" class="w-full rounded-md border border-gray-300 px-3 py-2">
        </div>

        <div>
          <label class="block text-sm font-medium text-gray-700 mb-1">Smoker</label>
          <select class="w-full rounded-md border border-gray-300 px-3 py-2">
            <option>No</option>
            <option>Yes</option>
          </select>
        </div>

        <div>
          <label class="block text-sm font-medium text-gray-700 mb-1">Alcohol Beverage Drinker</label>
          <select class="w-full rounded-md border border-gray-300 px-3 py-2">
            <option>Yes</option>
            <option>No</option>
          </select>
        </div>

        <div>
          <label class="block text-sm font-medium text-gray-700 mb-1">Sexually Active</label>
          <select class="w-full rounded-md border border-gray-300 px-3 py-2">
            <option>Yes</option>
            <option>No</option>
          </select>
        </div>

        <div>
          <label class="block text-sm font-medium text-gray-700 mb-1">Last Menstrual Period</label>
          <input type="date" class="w-full rounded-md border border-gray-300 px-3 py-2">
        </div>

        <div>
          <label class="block text-sm font-medium text-gray-700 mb-1">Age of MENARCHE</label>
          <input type="number" min="0" placeholder="Enter Age" class="w-full rounded-md border border-gray-300 px-3 py-2">
        </div>
      </div>

      <!-- RIGHT COLUMN -->
      <div class="space-y-4">
        <div>
          <label class="block text-sm font-medium text-gray-700 mb-1">Membership Type</label>
          <input type="text" value="Non-Member" class="w-full rounded-md border border-gray-300 px-3 py-2">
        </div>

        <div>
          <label class="block text-sm font-medium text-gray-700 mb-1">PhilHealth ID Number</label>
          <input type="text" value="000000" class="w-full rounded-md border border-gray-300 px-3 py-2">
        </div>

        <div>
          <label class="block text-sm font-medium text-gray-700 mb-1">FP Use</label>
          <select class="w-full rounded-md border border-gray-300 px-3 py-2">
            <option>Yes</option>
            <option>No</option>
          </select>
        </div>

        <div>
          <label class="block text-sm font-medium text-gray-700 mb-1">Education Attainment</label>
          <input type="text" value="College Degree" class="w-full rounded-md border border-gray-300 px-3 py-2">
        </div>

        <!-- Classification row (three small fields inline) -->
        <div>
          <label class="block text-sm font-medium text-gray-700 mb-1">Classification by Age/Health Risk Group</label>
          <div class="flex gap-2">
            <input type="number" value="25" class="w-24 rounded-md border border-gray-300 px-3 py-2">
            <input type="text" value="2nd Quarter" class="w-36 rounded-md border border-gray-300 px-3 py-2">
            <input type="text" value="AB" class="w-20 rounded-md border border-gray-300 px-3 py-2">
          </div>
        </div>

        <div>
          <label class="block text-sm font-medium text-gray-700 mb-1">Remarks</label>
          <input type="text" value="Vaccinated" class="w-full rounded-md border border-gray-300 px-3 py-2">
        </div>

        <div>
          <label class="block text-sm font-medium text-gray-700 mb-1">Status</label>
          <input type="text" value="None" class="w-full rounded-md border border-gray-300 px-3 py-2">
        </div>
      </div>
    </form>

    <!-- Footer -->
    <div class="mt-8">
      <a href="#"
         class="inline-flex items-center justify-center rounded-full bg-gradient-to-r from-red-600 to-red-500 px-5 py-2 text-white text-sm font-medium shadow-md hover:from-red-500 hover:to-red-400 transition">
        Back
      </a>
    </div>
  </div>
</div>
{% endblock %}
