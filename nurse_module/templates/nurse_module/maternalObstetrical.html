{% extends 'base_admin.html' %}

{% block title %}Nurse{% endblock %}

{% block content %}
<div class="px-6 py-8 flex justify-center">
  <!-- Card -->
  <div class="bg-white rounded-2xl border border-gray-200 shadow-sm p-6 md:p-10 w-full max-w-4xl">
    <!-- Header -->
    <h1 class="text-2xl font-semibold text-red-700 mb-8">Obstetrical History</h1>

    <!-- Form -->
    <form class="space-y-6">
      <!-- Gravida -->
      <div class="flex items-center gap-4">
        <label class="w-60 text-sm font-medium text-gray-700">Gravida (Pregnancies):</label>
        <input type="text" value="01" class="w-32 rounded-md border border-gray-300 px-3 py-2">
      </div>

      <!-- Para -->
      <div class="flex items-center gap-4">
        <label class="w-60 text-sm font-medium text-gray-700">Para (Live Births):</label>
        <input type="text" value="00" class="w-32 rounded-md border border-gray-300 px-3 py-2">
      </div>

      <!-- Abortion -->
      <div class="flex items-center gap-4">
        <label class="w-60 text-sm font-medium text-gray-700">Abortion (Miscarriages):</label>
        <input type="text" value="00" class="w-32 rounded-md border border-gray-300 px-3 py-2">
      </div>

      <!-- Last Menstrual Period -->
      <div class="flex items-center gap-4">
        <label class="w-60 text-sm font-medium text-gray-700">Last Menstrual Period:</label>
        <input type="text" value="01/01/2020" class="w-40 rounded-md border border-gray-300 px-3 py-2">
      </div>

      <!-- Expected Delivery Date -->
      <div class="flex items-center gap-4">
        <label class="w-60 text-sm font-medium text-gray-700">Expected Delivery Date:</label>
        <input type="text" value="01/01/2020" class="w-40 rounded-md border border-gray-300 px-3 py-2">
      </div>

      <!-- Back Button -->
      <div class="pt-6">
        <a href="#"
           class="inline-flex items-center justify-center rounded-full bg-gradient-to-r from-red-600 to-red-500 px-5 py-2 text-white text-sm font-medium shadow-md hover:from-red-500 hover:to-red-400 hover:scale-105 transition">
          Back
        </a>
      </div>
    </form>
  </div>
</div>
{% endblock %}
