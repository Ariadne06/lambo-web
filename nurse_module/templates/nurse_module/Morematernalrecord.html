{% extends 'base_admin.html' %}

{% block title %}Nurse{% endblock %}

{% block content %}
<div class="px-6 py-8">
  <!-- Page header -->
  <h1 class="text-2xl font-semibold text-red-700 mb-6">Maternal Record</h1>

  <!-- Card -->
  <div class="bg-white rounded-2xl border border-gray-200 shadow-sm p-6 md:p-8">
    <!-- Form grid -->
    <form class="grid grid-cols-1 md:grid-cols-2 gap-6">
      <!-- Left column -->
      <div class="space-y-4">
        <div>
          <label class="block text-sm font-medium text-gray-700 mb-1">Registration Date</label>
          <input type="text" value="01/02/2025" class="w-full rounded-md border border-gray-300 px-3 py-2">
        </div>
        <div>
          <label class="block text-sm font-medium text-gray-700 mb-1">Maternal Full Name</label>
          <input type="text" value="Jereza Rodrigo" class="w-full rounded-md border border-gray-300 px-3 py-2">
        </div>
        <div>
          <label class="block text-sm font-medium text-gray-700 mb-1">NHTS Status</label>
          <input type="text" value="NHTS" class="w-full rounded-md border border-gray-300 px-3 py-2">
        </div>
        <div>
          <label class="block text-sm font-medium text-gray-700 mb-1">Address</label>
          <input type="text" value="Purok 7 Cansaga" class="w-full rounded-md border border-gray-300 px-3 py-2">
        </div>
        <div>
          <label class="block text-sm font-medium text-gray-700 mb-1">Contact Number</label>
          <input type="text" value="09672672606" class="w-full rounded-md border border-gray-300 px-3 py-2">
        </div>
      </div>

      <!-- Right column -->
      <div class="space-y-4">
        <div>
          <label class="block text-sm font-medium text-gray-700 mb-1">Status</label>
          <input type="text" value="Active" class="w-full rounded-md border border-gray-300 px-3 py-2">
        </div>
        <div>
          <label class="block text-sm font-medium text-gray-700 mb-1">Recorded By</label>
          <input type="text" value="Cristel Mandauwe" class="w-full rounded-md border border-gray-300 px-3 py-2">
        </div>
      </div>
    </form>

    <!-- Actions row -->
    <div class="mt-10 flex flex-wrap justify-center gap-3">

      <!-- Medical/Surgical -->
      <a href="#" class="inline-flex items-center gap-2 rounded-full bg-gradient-to-r from-red-600 to-red-500 px-5 py-2.5 text-white text-sm font-medium shadow-md hover:from-red-500 hover:to-red-400 hover:scale-105 transition">
        <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" viewBox="0 0 24 24" fill="currentColor"><path d="M11 7V5h2v2h2v2h-2v2h-2V9H9V7h2Zm-4 4V7a2 2 0 0 1 2-2h6a2 2 0 0 1 2 2v10a2 2 0 0 1-2 2H9a2 2 0 0 1-2-2v-6Z"/></svg>
        Medical/Surgical
      </a>

      <!-- Obstetrical History -->
      <a href="#" class="inline-flex items-center gap-2 rounded-full bg-gradient-to-r from-red-600 to-red-500 px-5 py-2.5 text-white text-sm font-medium shadow-md hover:from-red-500 hover:to-red-400 hover:scale-105 transition">
        <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" viewBox="0 0 24 24" fill="currentColor"><path d="M7 4h10v2H7V4Zm-2 4h14v2H5V8Zm2 4h10v2H7v-2Zm-2 4h14v2H5v-2Z"/></svg>
        Obstetrical History
      </a>

      <!-- Check Ups -->
      <a href="#" class="inline-flex items-center gap-2 rounded-full bg-gradient-to-r from-red-600 to-red-500 px-5 py-2.5 text-white text-sm font-medium shadow-md hover:from-red-500 hover:to-red-400 hover:scale-105 transition">
        <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" viewBox="0 0 24 24" fill="currentColor"><path d="M5 3h14v4H5V3Zm0 6h14v12H5V9Zm8 2h-2v3H8v2h3v3h2v-3h3v-2h-3v-3Z"/></svg>
        Check Ups
      </a>

      <!-- Immunization -->
      <a href="#" class="inline-flex items-center gap-2 rounded-full bg-gradient-to-r from-red-600 to-red-500 px-5 py-2.5 text-white text-sm font-medium shadow-md hover:from-red-500 hover:to-red-400 hover:scale-105 transition">
        <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" viewBox="0 0 24 24" fill="currentColor"><path d="m21 6-3-3-7.5 7.5-1-1L3 9l5.5 6.5 1-1L21 6Z"/></svg>
        Immunization
      </a>

      <!-- Screenings -->
      <a href="#" class="inline-flex items-center gap-2 rounded-full bg-gradient-to-r from-red-600 to-red-500 px-5 py-2.5 text-white text-sm font-medium shadow-md hover:from-red-500 hover:to-red-400 hover:scale-105 transition">
        <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" viewBox="0 0 24 24" fill="currentColor"><path d="M4 5h16v10H4V5Zm0 12h16v2H4v-2Z"/></svg>
        Screenings
      </a>

      <!-- Lab Screening + Iron -->
      <a href="#" class="inline-flex items-center gap-2 rounded-full bg-gradient-to-r from-red-600 to-red-500 px-5 py-2.5 text-white text-sm font-medium shadow-md hover:from-red-500 hover:to-red-400 hover:scale-105 transition">
        <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" viewBox="0 0 24 24" fill="currentColor"><path d="M10 2h4v2h-1v6l5 8v2H6v-2l5-8V4h-1V2Z"/></svg>
        Lab Screening + Iron
      </a>

      <!-- Supplements -->
      <a href="#" class="inline-flex items-center gap-2 rounded-full bg-gradient-to-r from-red-600 to-red-500 px-5 py-2.5 text-white text-sm font-medium shadow-md hover:from-red-500 hover:to-red-400 hover:scale-105 transition">
        <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" viewBox="0 0 24 24" fill="currentColor"><path d="M7 3h10v6H7V3Zm-2 8h14v10H5V11Zm7-6h4v2h-4V5Z"/></svg>
        Supplements
      </a>

      <!-- Delivery Outcome -->
      <a href="#" class="inline-flex items-center gap-2 rounded-full bg-gradient-to-r from-red-600 to-red-500 px-5 py-2.5 text-white text-sm font-medium shadow-md hover:from-red-500 hover:to-red-400 hover:scale-105 transition">
        <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" viewBox="0 0 24 24" fill="currentColor"><path d="M12 4a5 5 0 1 1 0 10A5 5 0 0 1 12 4Zm-7 14a7 7 0 0 1 14 0v2H5v-2Z"/></svg>
        Delivery Outcome
      </a>

      <!-- Postpartum Visit -->
      <a href="#" class="inline-flex items-center gap-2 rounded-full bg-gradient-to-r from-red-600 to-red-500 px-5 py-2.5 text-white text-sm font-medium shadow-md hover:from-red-500 hover:to-red-400 hover:scale-105 transition">
        <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" viewBox="0 0 24 24" fill="currentColor"><path d="M16 11a4 4 0 1 0-8 0 4 4 0 0 0 8 0Zm-4 6c-4.42 0-8 2.24-8 5v1h16v-1c0-2.76-3.58-5-8-5Z"/></svg>
        Postpartum Visit
      </a>
    </div>
  </div>

  <!-- Footer Back -->
  <div class="mt-6">
    <a href="#"
       class="inline-flex items-center justify-center rounded-full bg-gradient-to-r from-red-600 to-red-500 px-5 py-2 text-white text-sm font-medium shadow-md hover:from-red-500 hover:to-red-400 hover:scale-105 transition">
      Back
    </a>
  </div>
</div>
{% endblock %}
