{% extends 'base_admin.html' %}

{% block title %}Nurse{% endblock %}

{% block content %}
<div class="px-6 py-8 flex justify-center">
  <!-- Card -->
  <div class="bg-white rounded-2xl border border-gray-200 shadow-sm p-6 md:p-10 w-full max-w-6xl">
    <!-- Header -->
    <h1 class="text-2xl font-semibold text-red-700 mb-6">Postpartum Visit</h1>

    <!-- Table -->
    <div class="overflow-x-auto">
      <table class="min-w-full text-sm text-left text-gray-700 border border-gray-200">
        <thead class="bg-gray-50 text-gray-800">
          <tr>
            <th class="px-6 py-3 border border-gray-200 font-semibold">Date</th>
            <th class="px-6 py-3 border border-gray-200 font-semibold">Weight</th>
            <th class="px-6 py-3 border border-gray-200 font-semibold">Height</th>
            <th class="px-6 py-3 border border-gray-200 font-semibold">Vitals</th>
            <th class="px-6 py-3 border border-gray-200 font-semibold">Notes</th>
            <th class="px-6 py-3 border border-gray-200 font-semibold text-right">Action</th>
          </tr>
        </thead>
        <tbody>
          <tr class="hover:bg-gray-50">
            <td class="px-6 py-3 border border-gray-200">01/04/2025</td>
            <td class="px-6 py-3 border border-gray-200">60 kg</td>
            <td class="px-6 py-3 border border-gray-200">160 cm</td>
            <td class="px-6 py-3 border border-gray-200">BP: 110/70, Temp: 36.8</td>
            <td class="px-6 py-3 border border-gray-200">Good recovery</td>
            <td class="px-6 py-3 border border-gray-200">
              <div class="flex items-center justify-end gap-2">
                <!-- more/options button -->
                <button class="h-8 w-8 flex items-center justify-center rounded-full border hover:bg-gray-50">
                  <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4" viewBox="0 0 24 24" fill="currentColor">
                    <circle cx="5" cy="12" r="1.6"/><circle cx="12" cy="12" r="1.6"/><circle cx="19" cy="12" r="1.6"/>
                  </svg>
                </button>
                <!-- add button -->
                <button class="h-8 w-8 flex items-center justify-center rounded-full border hover:bg-gray-50">
                  <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4" viewBox="0 0 24 24" fill="currentColor">
                    <path d="M11 5h2v6h6v2h-6v6h-2v-6H5v-2h6z"/>
                  </svg>
                </button>
              </div>
            </td>
          </tr>

          <!-- Empty rows to match layout -->
          <tr class="hover:bg-gray-50">
            <td class="px-6 py-6 border border-gray-200"></td>
            <td class="px-6 py-6 border border-gray-200"></td>
            <td class="px-6 py-6 border border-gray-200"></td>
            <td class="px-6 py-6 border border-gray-200"></td>
            <td class="px-6 py-6 border border-gray-200"></td>
            <td class="px-6 py-6 border border-gray-200"></td>
          </tr>
          <tr class="hover:bg-gray-50">
            <td class="px-6 py-6 border border-gray-200"></td>
            <td class="px-6 py-6 border border-gray-200"></td>
            <td class="px-6 py-6 border border-gray-200"></td>
            <td class="px-6 py-6 border border-gray-200"></td>
            <td class="px-6 py-6 border border-gray-200"></td>
            <td class="px-6 py-6 border border-gray-200"></td>
          </tr>
        </tbody>
      </table>
    </div>

    <!-- Back Button -->
    <div class="pt-6">
      <a href="#"
         class="inline-flex items-center justify-center rounded-full bg-gradient-to-r from-red-600 to-red-500 px-5 py-2 text-white text-sm font-medium shadow-md hover:from-red-500 hover:to-red-400 hover:scale-105 transition">
        Back
      </a>
    </div>
  </div>
</div>
{% endblock %}
