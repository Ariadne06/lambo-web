{% extends "base_admin.html" %}

{% block title %}Nurse{% endblock %}

{% block content %}
<div class="px-6 py-8">
  <!-- Header -->
  <div class="mb-6">
    <div class="flex items-center gap-3">
      <span class="h-8 w-1.5 rounded-full bg-red-600"></span>
      <div>
        <h1 class="text-2xl font-semibold tracking-tight text-red-600">Resident List</h1>
      </div>
    </div>
  </div>

  <!-- Card wrapper is flex column with fixed height; inner table area scrolls -->
  <div class="bg-white shadow-sm rounded-2xl border border-gray-200 flex flex-col h-[calc(100vh-8rem)]">
    <!-- Toolbar with Search + Advanced Filters -->
    <div class="px-4 md:px-6 py-4 border-b border-gray-100">
      <div class="flex flex-col gap-3 md:flex-row md:items-center md:justify-between">
        <!-- Search -->
        <div class="w-full md:w-80">
          <div class="relative">
            <input type="text" placeholder="Search Resident"
                   class="w-full rounded-xl border border-gray-300 bg-white px-4 py-2.5 pr-10 shadow-sm focus:outline-none focus:ring-2 focus:ring-red-100 focus:border-red-400" />
            <span class="pointer-events-none absolute inset-y-0 right-3 flex items-center text-gray-500">
              <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5 opacity-70" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="m21 21-4.35-4.35M10.5 18a7.5 7.5 0 1 1 0-15 7.5 7.5 0 0 1 0 15z"/>
              </svg>
            </span>
          </div>
        </div>

        <!-- Advanced Filters (collapsible) -->
        <details class="group">
          <summary class="flex cursor-pointer select-none items-center gap-2 rounded-xl border border-gray-300 bg-white px-4 py-2.5 text-sm shadow-sm hover:bg-gray-50">
            <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5 opacity-80" fill="none" viewBox="0 0 24 24" stroke="currentColor">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M3 6h18M6 12h12M10 18h4"/>
            </svg>
            Advanced Filters
            <svg xmlns="http://www.w3.org/2000/svg" class="ml-1 h-4 w-4 transition-transform group-open:rotate-180" viewBox="0 0 20 20" fill="currentColor"><path d="M5.23 7.21a.75.75 0 011.06.02L10 11.17l3.71-3.94a.75.75 0 111.08 1.04l-4.24 4.5a.75.75 0 01-1.08 0l-4.24-4.5a.75.75 0 01.02-1.06z"/></svg>
          </summary>

          <!-- Panel -->
          <div class="mt-3 grid grid-cols-1 gap-3 rounded-xl border border-gray-200 bg-white p-4 md:grid-cols-4">
            <div>
              <label class="block text-xs font-medium text-gray-600">Sex</label>
              <select class="mt-1 w-full rounded-lg border border-gray-300 bg-white px-3 py-2 text-sm focus:border-red-400 focus:ring-1 focus:ring-red-100">
                <option>All</option><option>Male</option><option>Female</option>
              </select>
            </div>
            <div>
              <label class="block text-xs font-medium text-gray-600">Religion</label>
              <select class="mt-1 w-full rounded-lg border border-gray-300 bg-white px-3 py-2 text-sm focus:border-red-400 focus:ring-1 focus:ring-red-100">
                <option>All</option><option>Catholic</option><option>Muslim</option><option>Others</option>
              </select>
            </div>
            <div>
              <label class="block text-xs font-medium text-gray-600">Civil Status</label>
              <select class="mt-1 w-full rounded-lg border border-gray-300 bg-white px-3 py-2 text-sm focus:border-red-400 focus:ring-1 focus:ring-red-100">
                <option>All</option><option>Single</option><option>Married</option>
              </select>
            </div>
            <div>
              <label class="block text-xs font-medium text-gray-600">Verified</label>
              <select class="mt-1 w-full rounded-lg border border-gray-300 bg-white px-3 py-2 text-sm focus:border-red-400 focus:ring-1 focus:ring-red-100">
                <option>All</option><option>Verified</option><option>Unverified</option>
              </select>
            </div>
            <div class="md:col-span-4 flex items-center justify-end gap-2 pt-1">
              <button class="rounded-lg border border-gray-300 px-4 py-2 text-sm hover:bg-gray-50">Reset</button>
              <button class="rounded-lg bg-red-600 px-4 py-2 text-sm text-white shadow hover:bg-red-700">Apply Filters</button>
            </div>
          </div>
        </details>
      </div>
    </div>

    <!-- Scrollable table area -->
    <div class="flex-1 overflow-y-auto">
      <table class="min-w-full text-sm">
        <thead class="bg-gray-50 text-gray-600 sticky top-0 z-10">
          <tr class="text-left">
            <th class="px-6 py-3 font-semibold">Resident ID</th>
            <th class="px-6 py-3 font-semibold">Resident</th>
            <th class="px-6 py-3 font-semibold">Date of Birth</th>
            <th class="px-6 py-3 font-semibold">Sex</th>
            <th class="px-6 py-3 font-semibold">Religion</th>
            <th class="px-6 py-3 font-semibold">Status</th>
            <th class="px-6 py-3 font-semibold text-right">Action</th>
          </tr>
        </thead>
        <tbody class="divide-y divide-gray-100">
          <!-- Sample row; replace with your loop -->
          <tr class="hover:bg-gray-50">
            <td class="px-6 py-4 font-medium text-gray-900">1000</td>
            <td class="px-6 py-4">Adrianne C. Villarta</td>
            <td class="px-6 py-4">08/08/2028</td>
            <td class="px-6 py-4">Male</td>
            <td class="px-6 py-4">Catholic</td>
            <td class="px-6 py-4">Single</td>
            <td class="px-6 py-4 text-right">
              <!-- View only -->
              <button class="inline-flex items-center gap-1 rounded-lg border border-gray-300 px-3 py-1.5 text-xs hover:border-red-500 hover:text-red-600">
                <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4 opacity-70" viewBox="0 0 24 24" fill="none" stroke="currentColor">
                  <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M15 12a3 3 0 1 1-6 0 3 3 0 0 1 6 0Z"/>
                  <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M2.458 12C3.732 7.943 7.523 5 12 5s8.268 2.943 9.542 7c-1.274 4.057-5.065 7-9.542 7s-8.268-2.943-9.542-7Z"/>
                </svg>
                View
              </button>
            </td>
          </tr>
          <!-- Repeat rows dynamically -->
        </tbody>
      </table>
    </div>

    <!-- Footer / Pagination -->
    <div class="px-4 md:px-6 py-4 border-t border-gray-100 flex items-center justify-between text-sm">
      <span class="text-gray-500">Showing 1–7 of 420</span>
      <nav class="flex items-center gap-1">
        <button class="px-3 py-1.5 rounded-md border border-gray-200 text-gray-400 cursor-not-allowed">Prev</button>
        <a href="#" class="px-3 py-1.5 rounded-md border border-gray-200 bg-red-600 text-white">1</a>
        <a href="#" class="px-3 py-1.5 rounded-md border border-gray-200 hover:bg-gray-50">2</a>
        <a href="#" class="px-3 py-1.5 rounded-md border border-gray-200 hover:bg-gray-50">3</a>
        <span class="px-3 py-1.5 text-gray-500">…</span>
        <a href="#" class="px-3 py-1.5 rounded-md border border-gray-200 hover:bg-gray-50">60</a>
        <a href="#" class="px-3 py-1.5 rounded-md border border-gray-200 text-gray-700 hover:bg-gray-50">Next</a>
      </nav>
    </div>
  </div>
</div>
{% endblock %}
