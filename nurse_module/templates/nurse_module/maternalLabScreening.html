{% extends 'base_admin.html' %}

{% block title %}Nurse{% endblock %}

{% block content %}
<div class="px-6 py-8 flex justify-center">
  <!-- Card -->
  <div class="bg-white rounded-2xl border border-gray-200 shadow-sm p-6 md:p-10 w-full max-w-4xl">
    <!-- Header -->
    <h1 class="text-2xl font-semibold text-red-700 mb-6">Gestational Diabetes Screening</h1>

    <!-- Table -->
    <div class="overflow-x-auto">
      <table class="min-w-full text-sm text-left text-gray-700 border border-gray-200">
        <thead class="bg-gray-50 text-gray-800">
          <tr>
            <th class="px-6 py-3 border border-gray-200 font-semibold">Date Screened</th>
            <th class="px-6 py-3 border border-gray-200 font-semibold">Result</th>
          </tr>
        </thead>
        <tbody>
          <tr class="hover:bg-gray-50">
            <td class="px-6 py-3 border border-gray-200">01/02/2020</td>
            <td class="px-6 py-3 border border-gray-200">Normal</td>
          </tr>
        </tbody>
      </table>
    </div>

    <!-- Buttons -->
    <div class="flex justify-between pt-6">
      <a href="#"
         class="inline-flex items-center justify-center rounded-full bg-gradient-to-r from-red-600 to-red-500 px-5 py-2 text-white text-sm font-medium shadow-md hover:from-red-500 hover:to-red-400 hover:scale-105 transition">
        Back
      </a>
      <a href="#"
         class="inline-flex items-center justify-center rounded-full bg-gradient-to-r from-red-600 to-red-500 px-5 py-2 text-white text-sm font-medium shadow-md hover:from-red-500 hover:to-red-400 hover:scale-105 transition">
        View Lab Screening Result
      </a>
    </div>
  </div>
</div>
{% endblock %}
