{% extends 'base_admin.html' %}

{% block title %}Resident Data{% endblock %}

{% block content %}
<div class="px-6 py-6">
  <div class="bg-white rounded-2xl border border-gray-200 shadow-sm p-5 relative">
    <!-- thin red bar on the left like your screenshot -->
    <div class="absolute left-0 top-0 h-full w-1 bg-red-700 rounded-l-2xl"></div>

    <!-- Step header -->
    <div class="flex items-center gap-8 text-sm font-medium mb-6">
      <div class="flex items-center gap-2">
        <span class="text-red-700">1</span>
        <span class="text-red-700">Resident Data</span>
      </div>
      <div class="flex items-center gap-2 text-gray-400">
        <span>2</span>
        <span>Household Data</span>
      </div>
    </div>

    <div class="grid grid-cols-1 lg:grid-cols-12 gap-8">
      <!-- Avatar -->
      <div class="lg:col-span-3">
        <div class="w-44 h-44 rounded-md ring-2 ring-blue-400 overflow-hidden flex items-center justify-center">
          <svg xmlns="http://www.w3.org/2000/svg" class="w-24 h-24 text-gray-400" viewBox="0 0 24 24" fill="currentColor">
            <path d="M12 2a5 5 0 0 0-5 5 5 5 0 1 0 10 0 5 5 0 0 0-5-5Zm0 12c-5.33 0-8 2.67-8 6v1h16v-1c0-3.33-2.67-6-8-6Z"/>
          </svg>
        </div>
      </div>

      <!-- Resident form -->
      <div class="lg:col-span-9">
        <form class="grid grid-cols-1 md:grid-cols-2 gap-x-10 gap-y-4">
          <div>
            <label class="block text-sm font-medium text-gray-700 mb-1">First Name</label>
            <input type="text" value="Adrianne" class="w-full rounded-md border border-gray-300 px-3 py-2">
          </div>
          <div>
            <label class="block text-sm font-medium text-gray-700 mb-1">House Number</label>
            <input type="text" value="Block 5 Lot 11" class="w-full rounded-md border border-gray-300 px-3 py-2">
          </div>

          <div>
            <label class="block text-sm font-medium text-gray-700 mb-1">Middle Name</label>
            <input type="text" value="Medalla" class="w-full rounded-md border border-gray-300 px-3 py-2">
          </div>
          <div>
            <label class="block text-sm font-medium text-gray-700 mb-1">Street</label>
            <input type="text" value="Washington Street" class="w-full rounded-md border border-gray-300 px-3 py-2">
          </div>

          <div>
            <label class="block text-sm font-medium text-gray-700 mb-1">Last Name</label>
            <input type="text" value="Villarta" class="w-full rounded-md border border-gray-300 px-3 py-2">
          </div>
          <div>
            <label class="block text-sm font-medium text-gray-700 mb-1">Barangay</label>
            <input type="text" value="Cansaga" class="w-full rounded-md border border-gray-300 px-3 py-2">
          </div>

          <div>
            <label class="block text-sm font-medium text-gray-700 mb-1">Date of Birth</label>
            <input type="text" value="01/01/2000" class="w-full rounded-md border border-gray-300 px-3 py-2">
          </div>
          <div>
            <label class="block text-sm font-medium text-gray-700 mb-1">Resident Status</label>
            <input type="text" value="Permanent" class="w-full rounded-md border border-gray-300 px-3 py-2">
          </div>

          <div>
            <label class="block text-sm font-medium text-gray-700 mb-1">Sex</label>
            <input type="text" value="Male" class="w-full rounded-md border border-gray-300 px-3 py-2">
          </div>
          <div>
            <label class="block text-sm font-medium text-gray-700 mb-1">Civil Status</label>
            <input type="text" value="Married" class="w-full rounded-md border border-gray-300 px-3 py-2">
          </div>

          <div>
            <label class="block text-sm font-medium text-gray-700 mb-1">Religion</label>
            <input type="text" value="Catholic" class="w-full rounded-md border border-gray-300 px-3 py-2">
          </div>
          <div>
            <label class="block text-sm font-medium text-gray-700 mb-1">Educational Attainment</label>
            <input type="text" value="College Graduate" class="w-full rounded-md border border-gray-300 px-3 py-2">
          </div>
        </form>

        <!-- Actions -->
        <div class="mt-6 flex items-center justify-between">
          <a href="#" class="inline-flex items-center justify-center rounded-xl bg-red-600 px-5 py-2 text-white text-sm font-medium shadow hover:bg-red-700">Back</a>
          <a href="#" class="inline-flex items-center justify-center rounded-xl bg-red-600 px-5 py-2 text-white text-sm font-medium shadow hover:bg-red-700">Next</a>
        </div>
      </div>
    </div>
  </div>
</div>
{% endblock %}
