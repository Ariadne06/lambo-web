{% load static %}<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Password Reset</title>
  <style>
    body {
      font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
      display: flex; 
      justify-content: center; 
      align-items: center;
      height: 100vh; 
      margin: 0; 
      background: #f5f6fa;
    }
    .reset-container {
      background: #fff; 
      padding: 2rem; 
      border-radius: 15px;
      box-shadow: 0 8px 20px rgba(0, 0, 0, 0.1);
      width: 350px; 
      text-align: center;
    }
    .reset-container h2 { 
      margin-bottom: 1.5rem; 
      color: #d32f2f; 
    }
    .form-group { 
      margin-bottom: 1rem; 
      text-align: left; 
    }
    .form-group label {
      display: block; 
      margin-bottom: 0.5rem; 
      font-weight: 600;
      font-size: 0.9rem; 
      color: #333;
    }
    .form-group input,
    .reset-btn {
      width: 100%; 
      padding: 0.75rem; 
      border-radius: 8px; 
      font-size: 1rem; 
      box-sizing: border-box; /* keeps alignment consistent */
    }
    .form-group input {
      border: 1px solid #ccc;
      transition: border 0.3s;
    }
    .form-group input:focus {
      outline: none; 
      border-color: #d32f2f;
      box-shadow: 0 0 4px rgba(211,47,47,0.3);
    }
    .reset-btn {
      background: #d32f2f; 
      color: #fff;
      border: none; 
      font-weight: bold;
      cursor: pointer; 
      transition: background 0.3s;
    }
    .reset-btn:hover { background: #b71c1c; }
    .note { 
      font-size: 0.8rem; 
      margin-top: 1rem; 
      color: #777; 
      text-align: left;
    }

    /* Messages styling (like your login page) */
    .banner { 
      margin-bottom: 1rem; 
      padding: .75rem; 
      border-radius: 8px;
      font-size: .95rem; 
      text-align: left; 
      border: 1px solid;
    }
    .banner.error   { background: #fdecea; color: #b71c1c; border-color: #f5c6cb; }
    .banner.success { background: #edf7ed; color: #1b5e20; border-color: #c8e6c9; }
    .banner.info    { background: #f1f5f9; color: #334155; border-color: #cbd5e1; }
  </style>
</head>
<body>

  <div class="reset-container">
    <h2>Reset Your Password</h2>

    <!-- Django messages -->
    {% if messages %}
      {% for message in messages %}
        <div class="banner {% if message.tags == 'error' %}error{% elif message.tags == 'success' %}success{% else %}info{% endif %}">
          {{ message }}
        </div>
      {% endfor %}
    {% endif %}

    <form method="POST" action="{% url 'authentication:reset_password' %}">
      {% csrf_token %}

      <div class="form-group">
        <label for="old_password">Old Password</label>
        <input
          type="password"
          id="old_password"
          name="old_password"
          placeholder="Enter old password"
          required
        >
      </div>

      <div class="form-group">
        <label for="new_password">New Password</label>
        <input
          type="password"
          id="new_password"
          name="new_password"
          placeholder="Enter new password"
          required
        >
      </div>

      <div class="form-group">
        <label for="confirm_password">Confirm Password</label>
        <input
          type="password"
          id="confirm_password"
          name="confirm_password"
          placeholder="Re-enter new password"
          required
        >
      </div>

      <div class="form-group">
        <button type="submit" class="reset-btn">Update Password</button>
      </div>

      <p class="note">Make sure your password is strong and unique.</p>
    </form>
  </div>

</body>
</html>
