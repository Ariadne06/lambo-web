{% load static tailwind_tags %}
{% load message_extras %}

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>LAMBO Login</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="min-h-screen bg-gray-100 flex items-center justify-center p-4">

  <div class="mx-auto w-full max-w-5xl grid grid-cols-1 md:grid-cols-2 bg-white rounded-2xl shadow-xl overflow-hidden">

    <!-- Left: brand -->
    <div class="relative bg-gradient-to-b from-red-700 to-red-600 flex items-center justify-center p-10">
      <img src="{% static 'images/brgylogo.jpg' %}" alt="Barangay Cansaga Logo"
           class="h-56 w-56 md:h-64 md:w-64 object-contain drop-shadow-lg">
      <!-- subtle overlay accent -->
      <div class="pointer-events-none absolute inset-x-0 bottom-0 h-20 bg-gradient-to-t from-black/10 to-transparent"></div>
    </div>

    <!-- Right: form -->
    <div class="p-8 md:p-10">
      <h1 class="text-2xl font-semibold tracking-tight text-gray-900">Welcome back</h1>
      <p class="mt-1 text-sm text-gray-600">Sign in to continue to <span class="font-medium">LAMBO</span>.</p>

      <!-- Alerts -->
      {% if messages %}
        {% for message in messages|latest_only %}
          <div class="mt-4 rounded-md border p-3 text-sm
                      {% if message.tags == 'error' %}border-red-300 bg-red-50 text-red-700
                      {% elif message.tags == 'success' %}border-green-300 bg-green-50 text-green-700
                      {% else %}border-gray-200 bg-gray-50 text-gray-700{% endif %}">
            {{ message }}
          </div>
        {% endfor %}
      {% endif %}

      <form method="POST" action="{% url 'authentication:login' %}" class="mt-6 space-y-5" id="login-form" novalidate>
        {% csrf_token %}

        <!-- Username -->
        <div>
          <label for="username" class="block text-sm font-medium text-gray-800">Username</label>
          <div class="relative mt-1">
            <span class="pointer-events-none absolute inset-y-0 left-0 pl-3 flex items-center text-gray-400">
              <!-- user icon -->
              <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                      d="M5.121 17.804A13.937 13.937 0 0112 15c2.5 0 4.847.655 6.879 1.804M15 11a3 3 0 11-6 0 3 3 0 016 0z"/>
              </svg>
            </span>
            <input
              id="username" name="username" type="text" inputmode="text" autocomplete="username" required
              placeholder="your.username"
              class="block w-full rounded-lg border border-gray-300 bg-white pl-10 pr-3 py-2.5 text-gray-900 placeholder-gray-400
                     focus:outline-none focus:ring-2 focus:ring-red-500 focus:border-red-500">
          </div>
        </div>

        <!-- Password -->
        <div>
          <label for="password" class="block text-sm font-medium text-gray-800">Password</label>
          <div class="relative mt-1">
            <span class="pointer-events-none absolute inset-y-0 left-0 pl-3 flex items-center text-gray-400">
              <!-- lock icon -->
              <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                      d="M12 11c0-1.105.895-2 2-2s2 .895 2 2m-2 2a2 2 0 11-4 0 2 2 0 014 0zM5 11h14v7a2 2 0 01-2 2H7a2 2 0 01-2-2v-7zM8 11V8a4 4 0 118 0v3"/>
              </svg>
            </span>
            <input
              id="password" name="password" type="password" autocomplete="current-password" required
              placeholder="••••••••"
              class="block w-full rounded-lg border border-gray-300 bg-white pl-10 pr-10 py-2.5 text-gray-900 placeholder-gray-400
                     focus:outline-none focus:ring-2 focus:ring-red-500 focus:border-red-500">
            <button type="button" id="toggle-password"
                    class="absolute inset-y-0 right-0 pr-3 flex items-center text-gray-400 hover:text-gray-600"
                    aria-label="Show password">
              <!-- eye icon -->
              <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                      d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"/>
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                      d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z"/>
              </svg>
            </button>
          </div>
          <div class="mt-2 flex items-center justify-between text-sm">
            <label class="inline-flex items-center gap-2 text-gray-700 select-none">
              <input type="checkbox" name="remember" class="h-4 w-4 rounded border-gray-300 text-red-600 focus:ring-red-500">
              Remember me
            </label>
            <a href="" class="text-gray-600 hover:text-red-700 hover:underline">
              Forgot password?
            </a>
          </div>
        </div>

        <!-- Submit -->
        <button type="submit" id="submit-btn"
          class="w-full inline-flex items-center justify-center gap-2 rounded-lg bg-red-700 text-white py-2.5 font-medium
                 hover:bg-red-800 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-red-600 transition">
          <svg id="spinner" class="hidden h-5 w-5 animate-spin" viewBox="0 0 24 24">
            <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
            <path class="opacity-75" fill="currentColor"
                  d="M4 12a8 8 0 018-8v4a4 4 0 00-4 4H4z"></path>
          </svg>
          <span id="btn-text">Login</span>
        </button>
      </form>

      <!-- Small footer -->
      <p class="mt-6 text-xs text-gray-500">© {{ now|date:'Y' }} Barangay Cansaga • LAMBO</p>
    </div>
  </div>

  <script>
    // Show/hide password
    (function () {
      const btn = document.getElementById('toggle-password');
      const input = document.getElementById('password');
      btn?.addEventListener('click', () => {
        const visible = input.type === 'text';
        input.type = visible ? 'password' : 'text';
        btn.setAttribute('aria-label', visible ? 'Show password' : 'Hide password');
      });
    })();

    // Disable button & show spinner on submit
    (function () {
      const form = document.getElementById('login-form');
      const btn  = document.getElementById('submit-btn');
      const spin = document.getElementById('spinner');
      const txt  = document.getElementById('btn-text');
      form?.addEventListener('submit', () => {
        btn.disabled = true;
        spin.classList.remove('hidden');
        txt.textContent = 'Signing in…';
      });
    })();
  </script>
</body>
</html>
