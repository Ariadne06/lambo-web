{% load static tailwind_tags %}

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>LAMBO Login</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 h-screen flex items-center justify-center">
  <div class="flex w-[900px] bg-white rounded-xl shadow-md overflow-hidden">
    <!-- Left side: Logo and branding -->
    <div class="bg-red-700 w-1/2 flex items-center justify-center p-8">
      <img src="{% static 'images/brgylogo.jpg' %}"  alt="Barangay Cansaga Logo" class="h-60 w-60 object-contain">
    </div>

    <!-- Right side: Login form -->
    <div class="w-1/2 p-10">
      <h2 class="text-xl font-semibold mb-6">Login</h2>

      <!-- Display messages -->
      {% if messages %}
        {% for message in messages %}
          <div class="mb-4 p-3 rounded-md text-sm font-medium 
            {% if message.tags == 'error' %}
              bg-red-100 text-red-700 border border-red-400
            {% elif message.tags == 'success' %}
              bg-green-100 text-green-700 border border-green-400
            {% else %}
              bg-gray-100 text-gray-700 border border-gray-300
            {% endif %}
          ">
            {{ message }}
          </div>
        {% endfor %}
      {% endif %}


      <form method="POST" action="{% url 'authentication:login' %}">
        {% csrf_token %}
        {% if error_message %}
          <div class="alert alert-danger alert-dismissible fade show">
            {{ error_message }}
            <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
          </div>
        {% endif %}

        <div class="mb-4">
          <label class="block text-sm font-medium mb-1">Username</label>
          <div class="relative">
            <span class="absolute inset-y-0 left-0 pl-3 flex items-center text-gray-500">
              <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none"
                viewBox="0 0 24 24" stroke="currentColor">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                  d="M5.121 17.804A13.937 13.937 0 0112 15c2.5 0 4.847.655 6.879 1.804M15 11a3 3 0 11-6 0 3 3 0 016 0z" />
              </svg>
            </span>
            <input type="text" placeholder="username"
              class="pl-10 pr-4 py-2 w-full border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-red-500" id="username" name="username" required/>
          </div>
        </div>

        <div class="mb-2">
          <label class="block text-sm font-medium mb-1">Password</label>
          <div class="relative">
            <span class="absolute inset-y-0 left-0 pl-3 flex items-center text-gray-500">
              <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none"
                viewBox="0 0 24 24" stroke="currentColor">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                  d="M12 11c0-1.105.895-2 2-2s2 .895 2 2m-2 2c0 1.105-.895 2-2 2s-2-.895-2-2m-2 0a4 4 0 018 0 4 4 0 01-8 0z" />
              </svg>
            </span>
            <input type="password" placeholder="password"
              class="pl-10 pr-10 py-2 w-full border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-red-500" id="password" name="password" required/>
            <span class="absolute inset-y-0 right-0 pr-3 flex items-center text-gray-500 cursor-pointer">
              <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none"
                viewBox="0 0 24 24" stroke="currentColor">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                  d="M15 12a3 3 0 11-6 0 3 3 0 016 0z" />
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z" />
              </svg>
            </span>
          </div>
        </div>

        <div class="mb-6 text-sm">
          <a href="#" class="text-gray-600 hover:underline">Forgot Password?</a>
        </div>

        <button type="submit"
          class="w-full bg-red-700 text-white py-2 rounded-md hover:bg-red-800 transition-colors">
          Login
        </button>
      </form>
    </div>
  </div>
</body>
</html>
