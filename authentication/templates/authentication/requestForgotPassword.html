{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Password Reset</title>
  <style>
    body {
      font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      margin: 0;
      background: #f5f6fa;
    }
    .reset-container {
      position: relative;
      background: #fff;
      padding: 2rem;
      border-radius: 15px;
      box-shadow: 0 8px 20px rgba(0, 0, 0, 0.1);
      width: 350px;
      text-align: center;
    }
    .reset-container h2 {
      margin-bottom: 1.5rem;
      color: #d32f2f;
    }
    .form-group { margin-bottom: 1rem; text-align: left; }
    .form-group label {
      display: block;
      margin-bottom: 0.5rem;
      font-weight: 600;
      font-size: 0.9rem;
      color: #333;
    }
    .form-group input,
    .reset-btn {
      width: 100%;
      padding: 0.75rem;
      border-radius: 8px;
      font-size: 1rem;
      box-sizing: border-box;
    }
    .form-group input {
      border: 1px solid #ccc;
      transition: border 0.3s;
    }
    .form-group input:focus {
      outline: none;
      border-color: #d32f2f;
      box-shadow: 0 0 4px rgba(211,47,47,0.3);
    }
    .reset-btn {
      background: #d32f2f;
      color: #fff;
      border: none;
      font-weight: bold;
      cursor: pointer;
      transition: background 0.3s;
    }
    .reset-btn:hover { background: #b71c1c; }
    .note { font-size: 0.8rem; margin-top: 1rem; color: #777; text-align: left; }

    /* Messages styling (no Tailwind) — stronger colors */
    .banner {
      margin-bottom: 1rem;
      padding: .9rem .95rem;
      border-radius: 10px;
      font-size: .95rem;
      text-align: left;
      border: 1.5px solid;
      font-weight: 600;
    }
    /* Success: greener */
    .banner.success {
      background: #d1fae5;   /* light green */
      color: #065f46;        /* deep green text */
      border-color: #10b981; /* emerald-500 */
    }
    /* Error: redder */
    .banner.error {
      background: #fee2e2;   /* light red */
      color: #7f1d1d;        /* deep red text */
      border-color: #ef4444; /* red-500 */
    }
    /* Info: grayer */
    .banner.info {
      background: #e5e7eb;   /* gray-200 */
      color: #374151;        /* gray-700 text */
      border-color: #9ca3af; /* gray-400 */
    }

    /* X close button */
    .close-btn {
      position: absolute;
      top: 10px;
      right: 10px;
      width: 36px;
      height: 36px;
      border: none;
      background: transparent;
      font-size: 24px;
      line-height: 1;
      color: #777;
      cursor: pointer;
      border-radius: 8px;
      transition: background .2s, color .2s;
    }
    .close-btn:hover { background: #f1f5f9; color: #b71c1c; }
    .close-btn:focus { outline: 2px solid #d32f2f; outline-offset: 2px; }
  </style>
</head>
<body>

  <div class="reset-container">
    <!-- X Close -->
    <button type="button" class="close-btn" aria-label="Close" onclick="handleClose()">&times;</button>

    <h2>Request Password Change</h2>

    <!-- Messages -->
    {% if message %}
      <div class="banner {% if message_level == 'success' %}success{% elif message_level == 'error' %}error{% else %}info{% endif %}">
        {{ message }}
      </div>
    {% endif %}

    <form method="POST" action="{% url 'authentication:req_pwd_change' %}">
      {% csrf_token %}

      <div class="form-group">
        <label for="username">Username</label>
        <input
          type="text"
          id="username"
          name="username"
          placeholder="Enter your username"
          autocomplete="username"
          required
        >
      </div>

      <div class="form-group">
        <label for="email">Email</label>
        <input
          type="email"
          id="email"
          name="email"
          placeholder="Enter your email"
          autocomplete="email"
          required
        >
      </div>

      <div class="form-group">
        <button type="submit" class="reset-btn">Submit Request</button>
      </div>

      <p class="note">Make sure your username is correct.</p>
    </form>
  </div>

  <script>
    function handleClose() {
      if (window.history.length > 1 && document.referrer) {
        window.location.href = "{% url 'authentication:login' %}";
      }
    }

    document.addEventListener("DOMContentLoaded", function () {
      var hasSuccessBanner = !!document.querySelector(".banner.success");
      var level = "{{ message_level|default:'' }}".trim().toLowerCase();
      var shouldDelay = hasSuccessBanner || level === "success";

      if (shouldDelay) {
        setTimeout(function () {
          window.location.href = "{% url 'authentication:login' %}";
        }, 2000);
      }
    });
  </script>

</body>
</html>
