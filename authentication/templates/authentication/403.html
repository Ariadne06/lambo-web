{% load static tailwind_tags %}
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <title>Access Denied - LAMBO</title>
  {% tailwind_css %}
</head>
<body class="bg-gray-100 min-h-screen font-[Poppins] flex items-center justify-center">
  <div class="max-w-md w-full mx-auto">
    <div class="bg-white rounded-lg shadow-lg p-8 text-center">
      <!-- Logo -->
      <div class="mb-6">
        <img src="{% static 'images/brgylogo.jpg' %}" alt="Logo" class="w-20 h-20 rounded-full mx-auto shadow-lg border-4 border-red-500">
        <h1 class="mt-4 text-2xl font-bold text-gray-800">Barangay Cansaga</h1>
      </div>
      
      <!-- Error Message -->
      <div class="mb-6">
        <div class="text-6xl font-bold text-red-500 mb-4">403</div>
        <h2 class="text-xl font-semibold text-gray-800 mb-2">Access Denied</h2>
        <p class="text-gray-600">You don't have permission to access this page.</p>
      </div>
      
      <!-- Actions -->
      <div class="space-y-3">
        <button onclick="history.back()" 
                class="w-full bg-red-600 text-white py-2 px-4 rounded-lg hover:bg-red-700 transition">
          Go Back
        </button>
        <a href="{% url 'authentication:login' %}" 
           class="block w-full bg-gray-600 text-white py-2 px-4 rounded-lg hover:bg-gray-700 transition">
          Return to Login
        </a>
      </div>
    </div>
  </div>
</body>
</html>
