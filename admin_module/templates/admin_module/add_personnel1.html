{% extends 'base_admin.html' %}

{% block title %}
    Admin
{% endblock %}

{% block content %}
    <div class="flex flex-col min-h-screen bg-gray-100 p-6">

    <!-- Page Title -->
    <h1 class="text-2xl font-bold text-red-700 mb-6">Add Personnel</h1>

    <!-- Form Container -->
        <div class="w-full max-w-screen-2xl mx-auto bg-white shadow-md rounded-lg p-10">


        <!-- Step Indicator -->
        <div class="flex justify-center mb-8 space-x-6 text-sm font-medium">
            <span class="text-red-700 border-b-2 border-red-700 pb-1">1. Personal Data</span>
            <span class="text-gray-400">2. Log In Details</span>
        </div>

        <!-- Form -->
        <form>
            <div class="grid grid-cols-1 md:grid-cols-2 gap-6">

                <!-- Left Column -->
                <div class="space-y-4">
                    <div>
                        <label class="block text-sm font-semibold text-gray-700">First Name</label>
                        <input type="text" value="Adriane" class="w-full border rounded px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-red-500" />
                    </div>
                    <div>
                        <label class="block text-sm font-semibold text-gray-700">Middle Name</label>
                        <input type="text" value="Medalla" class="w-full border rounded px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-red-500" />
                    </div>
                    <div>
                        <label class="block text-sm font-semibold text-gray-700">Last Name</label>
                        <input type="text" value="Villarta" class="w-full border rounded px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-red-500" />
                    </div>
                    <div>
                        <label class="block text-sm font-semibold text-gray-700">Date of Birth</label>
                        <input type="date" value="2000-01-01" class="w-full border rounded px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-red-500" />
                    </div>
                    <div>
                        <label class="block text-sm font-semibold text-gray-700">Sex</label>
                        <select class="w-full border rounded px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-red-500">
                            <option>Male</option>
                            <option>Female</option>
                        </select>
                    </div>
                </div>

                <!-- Right Column -->
                <div class="space-y-4">
                    <div>
                        <label class="block text-sm font-semibold text-gray-700">House Number</label>
                        <input type="text" value="Lot 15 Block 11" class="w-full border rounded px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-red-500" />
                    </div>
                    <div>
                        <label class="block text-sm font-semibold text-gray-700">Street</label>
                        <input type="text" value="Washington Street" class="w-full border rounded px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-red-500" />
                    </div>
                    <div>
                        <label class="block text-sm font-semibold text-gray-700">Barangay</label>
                        <input type="text" value="Cansaga" class="w-full border rounded px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-red-500" />
                    </div>
                    <div>
                        <label class="block text-sm font-semibold text-gray-700">Role / Position</label>
                        <select class="w-full border rounded px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-red-500">
                            <option>Treasurer</option>
                            <option>Secretary</option>
                            <option>Kagawad</option>
                            <option>Barangay Captain</option>
                        </select>
                    </div>
                </div>
            </div>

            <!-- Action Buttons -->
            <div class="flex justify-between mt-10">
                <button type="button" class="bg-red-700 text-white text-sm px-6 py-2 rounded hover:bg-red-800 transition">Back</button>
                <button type="submit" class="bg-red-700 text-white text-sm px-6 py-2 rounded hover:bg-red-800 transition">Next</button>
            </div>
        </form>
    </div>
</div>

 
{% endblock %}
