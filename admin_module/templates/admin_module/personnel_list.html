{% extends 'base_admin.html' %}

{% block title %}
    Personnel List
{% endblock %}

{% block content %}
<div class="flex flex-col min-h-screen bg-gray-100 p-6">

    <!-- Page Title -->
    <h1 class="text-2xl font-bold text-red-700 mb-6">Personnel List</h1>

    <!-- Search & Filter -->
    <div class="flex justify-between items-center mb-4">
        <div class="relative w-full max-w-sm">
            <input type="text" placeholder="Search Personnel" class="w-full border rounded px-4 py-2 pl-10 text-sm shadow-sm focus:outline-none focus:ring-2 focus:ring-red-500" />
            <svg class="absolute left-3 top-2.5 w-4 h-4 text-gray-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-4.35-4.35m0 0A7.5 7.5 0 1011.5 3a7.5 7.5 0 005.15 13.65z" />
            </svg>
        </div>
        <div class="text-sm text-gray-600 flex items-center space-x-1 cursor-pointer hover:text-red-600">
            <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                      d="M3 4a1 1 0 011-1h16a1 1 0 011 1v2a1 1 0 01-.293.707L15 13.414V19a1 1 0 01-1.447.894l-4-2A1 1 0 019 17V13.414L3.293 6.707A1 1 0 013 6V4z" />
            </svg>
            <span>Advanced Filters</span>
        </div>
    </div>

    <!-- Personnel Table -->
    <div class="overflow-x-auto bg-white rounded shadow">
        <table class="min-w-full table-auto border border-gray-300">
            <thead class="bg-gray-100 text-sm font-semibold text-gray-700">
                <tr>
                    <th class="px-4 py-2 border">Personnel ID</th>
                    <th class="px-4 py-2 border">Full Name</th>
                    <th class="px-4 py-2 border">Sex</th>
                    <th class="px-4 py-2 border">Position</th>
                    <th class="px-4 py-2 border">Username</th>
                    <th class="px-4 py-2 border text-center">Action</th>
                </tr>
            </thead>
            <tbody class="text-sm text-gray-800 text-center">
                <!-- Sample Row -->
                <tr>
                    <td class="px-4 py-2 border">00001</td>
                    <td class="px-4 py-2 border">Adrianne Villarta</td>
                    <td class="px-4 py-2 border">Male</td>
                    <td class="px-4 py-2 border">Treasurer</td>
                    <td class="px-4 py-2 border">
                        <a href="mailto:Villarta@gmail.com" class="text-blue-700 underline">Villarta@gmail.com</a>
                    </td>
                    <td class="px-4 py-2 border">
                        <div class="flex justify-center gap-3">
                            <!-- Update Button -->
                            <a href="#" class="hover:text-blue-700" title="Update">
                                <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                                          d="M11 5H6a2 2 0 00-2 2v11a2 2 0 002 2h11a2 2 0 002-2v-5M18.5 2.5a2.121 2.121 0 113 3L12 15l-4 1 1-4 9.5-9.5z" />
                                </svg>
                            </a>
                            <!-- Deactivate Button -->
                            <a href="#" class="hover:text-red-700" title="Deactivate">
                                <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                                          d="M18.364 5.636l-1.414 1.414L12 12l-4.95-4.95-1.414 1.414L10.586 13.5 5.636 18.464l1.414 1.414L12 14.914l4.95 4.95 1.414-1.414L13.414 13.5l4.95-4.95z" />
                                </svg>
                            </a>
                        </div>
                    </td>
                </tr>
            </tbody>
        </table>
    </div>

    <!-- Print Button -->
    <div class="flex justify-end mt-4">
        <button onclick="window.print()" class="flex items-center bg-red-700 text-white text-sm px-4 py-2 rounded hover:bg-red-800 transition">
            <svg class="w-4 h-4 mr-2" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                      d="M6 9V2h12v7M6 18H4a2 2 0 01-2-2v-5a2 2 0 012-2h16a2 2 0 012 2v5a2 2 0 01-2 2h-2m-4 0h-4v4h4v-4z" />
            </svg>
            Print List
        </button>
    </div>
</div>
{% endblock %}
