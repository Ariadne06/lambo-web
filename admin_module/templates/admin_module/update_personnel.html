{% extends 'base_admin.html' %}

{% block title %}Admin{% endblock %}

{% block content %}
<div class="flex flex-col min-h-screen bg-gray-100 p-6">
  <!-- Page Title -->
  <h1 class="text-2xl font-bold text-red-700 mb-6">Update Personnel</h1>

  <!-- Messages -->
  {% if message %}
    <div id="messages" class="mb-4 px-4 py-3 rounded border
        {% if message_level == 'success' %}  bg-green-100 text-green-700 border border-green-400
        {% elif message_level == 'error' %} bg-red-100 text-red-700 border border-red-400
        {% else %} bg-gray-200 text-gray-800 border border-gray-400 {% endif %}">
      {{ message }}
    </div>
  {% endif %}
  
  <!-- Form Container -->
  <div class="w-full max-w-screen-2xl mx-auto bg-white shadow-md rounded-lg p-10">
    <!-- Form -->
    <form method="post" action="{% url 'admin_module:update_personnel' %}" class="space-y-8" id="updateForm">
      {% csrf_token %}

      <!-- Hidden PID -->
      <input type="hidden" name="pid" value="{{ pid }}">

      <div class="grid grid-cols-1 md:grid-cols-3 gap-8">
        <!-- Fields -->
        <div class="md:col-span-2">
          <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
            <div>
              <label for="username" class="block text-sm font-semibold text-gray-700">Username</label>
              <input
                id="username"
                name="username"
                type="text"
                value="{{ personnel.username }}"
                class="w-full border rounded px-3 py-2 text-sm focus:ring-2 focus:ring-red-500"
                maxlength="150"
                required
              />
            </div>
            <div>
              <label for="email" class="block text-sm font-semibold text-gray-700">Email</label>
              <input
                id="email"
                name="email"
                type="email"
                value="{{ personnel.email }}"
                class="w-full border rounded px-3 py-2 text-sm focus:ring-2 focus:ring-red-500"
                maxlength="254"
                required
              />
            </div>

            <div>
              <label class="block text-sm font-semibold text-gray-700">Role / Position</label>
              <select name="role_id" class="w-full border rounded px-3 py-2 text-sm" required>
                <option value="">-- Select Role --</option>
                <option value="2" {% if personnel.role_id == "Barangay Captain" %}selected{% endif %}>Barangay Captain</option>
                <option value="3" {% if personnel.role_id == "Barangay Secretary" %}selected{% endif %}>Barangay Secretary</option>
                <option value="4" {% if personnel.role_id == "Barangay Assistant Secretary" %}selected{% endif %}>Asst. Secretary</option>
                <option value="5" {% if personnel.role_id == "Barangay Treasurer" %}selected{% endif %}>Barangay Treasurer</option>
                <option value="6" {% if personnel.role_id == "Barangay Health Worker" %}selected{% endif %}>Barangay Health Worker</option>
                <option value="7" {% if personnel.role_id == "Midwife" %}selected{% endif %}>Midwife</option>
              </select>
            </div>
          </div>
        </div>
      </div>

      <!-- Action Buttons -->
      <div class="flex justify-between">
        <a href="javascript:history.back()" class="bg-gray-200 text-gray-800 text-sm px-6 py-2 rounded hover:bg-gray-300 transition">
          Cancel
        </a>
        <button
          type="submit"
          class="bg-red-700 text-white text-sm px-6 py-2 rounded hover:bg-red-800 transition"
          id="submitBtn"
        >
          Save Changes
        </button>
      </div>
    </form>
  </div>
</div>

<script>
  // Prevent double submit
  (function () {
    const form = document.getElementById('updateForm');
    const btn = document.getElementById('submitBtn');
    form.addEventListener('submit', function () {
      btn.disabled = true;
      btn.classList.add('opacity-70', 'cursor-not-allowed');
      btn.textContent = 'Saving...';
    });
  })();

  // Redirect after success message
document.addEventListener("DOMContentLoaded", function () {
  const msgBox = document.getElementById("messages");
  if (msgBox && msgBox.classList.contains("bg-green-100")) {
    setTimeout(function () {
      window.location.href = "{% url 'admin_module:personnel_list' %}";
    }, 2000);
  }
});
</script>
{% endblock %}
