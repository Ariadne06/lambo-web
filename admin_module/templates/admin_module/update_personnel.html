{% extends 'base_admin.html' %}

{% block title %}Admin{% endblock %}

{% block content %}
<div class="flex flex-col min-h-screen bg-gray-100 p-6">
  <!-- Page Title -->
  <h1 class="text-2xl font-bold text-red-700 mb-6">Update Personnel</h1>

  <!-- Messages -->
  {% if messages %}
    <div class="mb-4 space-y-2" id="messages">
      {% for message in messages %}
        <div class="px-4 py-3 rounded border
                    {% if message.tags == 'success' %} bg-green-50 border-green-200 text-green-800
                    {% elif message.tags == 'error' %} bg-red-50 border-red-200 text-red-800
                    {% else %} bg-gray-50 border-gray-200 text-gray-800 {% endif %}">
          {{ message }}
        </div>
      {% endfor %}
    </div>
  {% endif %}

  <!-- Form Container -->
  <div class="w-full max-w-screen-2xl mx-auto bg-white shadow-md rounded-lg p-10">
    <!-- Form -->
    <form method="post" action="{% url 'admin_module:update_personnel' %}" class="space-y-8" id="updateForm">
      {% csrf_token %}

      <!-- Hidden PID -->
      <input type="hidden" name="pid" value="{{ pid }}">

      <div class="grid grid-cols-1 md:grid-cols-3 gap-8">
        <!-- Fields -->
        <div class="md:col-span-2">
          <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
            <div>
              <label for="username" class="block text-sm font-semibold text-gray-700">Username</label>
              <input
                id="username"
                name="username"
                type="text"
                value="{{ personnel.username }}"
                class="w-full border rounded px-3 py-2 text-sm focus:ring-2 focus:ring-red-500"
                maxlength="150"
                required
              />
            </div>
            <div>
              <label for="email" class="block text-sm font-semibold text-gray-700">Email</label>
              <input
                id="email"
                name="email"
                type="email"
                value="{{ personnel.email }}"
                class="w-full border rounded px-3 py-2 text-sm focus:ring-2 focus:ring-red-500"
                maxlength="254"
                required
              />
            </div>
          </div>
        </div>
      </div>

      <!-- Action Buttons -->
      <div class="flex justify-between">
        <a href="javascript:history.back()" class="bg-gray-200 text-gray-800 text-sm px-6 py-2 rounded hover:bg-gray-300 transition">
          Cancel
        </a>
        <button
          type="submit"
          class="bg-red-700 text-white text-sm px-6 py-2 rounded hover:bg-red-800 transition"
          id="submitBtn"
        >
          Save Changes
        </button>
      </div>
    </form>
  </div>
</div>

<script>
  // Prevent double submit
  (function () {
    const form = document.getElementById('updateForm');
    const btn = document.getElementById('submitBtn');
    form.addEventListener('submit', function () {
      btn.disabled = true;
      btn.classList.add('opacity-70', 'cursor-not-allowed');
      btn.textContent = 'Saving...';
    });
  })();

  // Redirect after success message
  document.addEventListener("DOMContentLoaded", function () {
    const msgBox = document.getElementById("messages");
    if (msgBox && msgBox.querySelector(".bg-green-50")) {
      setTimeout(function () {
        window.location.href = "{% url 'admin_module:personnel_list' %}";
      }, 2000); // 2 seconds delay before redirect
    }
  });
</script>
{% endblock %}
