{% extends 'base_admin.html' %}

{% block title %}
    Admin
{% endblock %}

{% block content %}
<div class="flex flex-col min-h-screen bg-gray-100 p-6">

    <!-- Page Title -->
    <h1 class="text-2xl font-bold text-red-700 mb-6">Add Personnel</h1>

    <!-- Form Container -->
    <div class="w-full max-w-screen-2xl mx-auto bg-white shadow-md rounded-lg p-10">

        <!-- Step Indicator -->
        <div class="flex justify-center mb-8 space-x-6 text-sm font-medium">
            <span class="text-gray-400">1. Personal Data</span>
            <span class="text-red-700 border-b-2 border-red-700 pb-1">2. Log In Details</span>
        </div>

        <!-- Form -->
        <form method="POST">
            {% csrf_token %}
            <div class="grid grid-cols-1 md:grid-cols-2 gap-6">

                <!-- Username and Password Fields -->
                <div class="space-y-4">
                    <div>
                        <label class="block text-sm font-semibold text-gray-700">Username</label>
                        <input type="text" name="username" placeholder="Enter Username" class="w-full border rounded px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-red-500" />
                    </div>

                    <div>
                        <label class="block text-sm font-semibold text-gray-700">Password</label>
                        <input type="password" name="password" placeholder="Enter Password" class="w-full border rounded px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-red-500" />
                    </div>

                    <div>
                        <label class="block text-sm font-semibold text-gray-700">Re-enter Password</label>
                        <input type="password" name="confirm_password" placeholder="Re-enter Password" class="w-full border rounded px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-red-500" />
                    </div>
                </div>

                <!-- Email Field -->
                <div class="space-y-4">
                    <div>
                        <label class="block text-sm font-semibold text-gray-700">Email</label>
                        <input type="email" name="email" placeholder="Enter Email" class="w-full border rounded px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-red-500" />
                    </div>
                </div>
            </div>

            <!-- Action Buttons -->
            <div class="flex justify-between mt-10">
                <button type="button" onclick="window.history.back()" class="bg-red-700 text-white text-sm px-6 py-2 rounded hover:bg-red-800 transition">Back</button>
                <button type="submit" class="bg-red-700 text-white text-sm px-6 py-2 rounded hover:bg-red-800 transition">Add Personnel</button>
            </div>
        </form>
    </div>
</div>
{% endblock %}
