{% extends 'base_admin.html' %}

{% block title %}Admin{% endblock %}

{% block content %}
<div class="flex flex-col min-h-screen bg-gray-100 p-6">

  <!-- Page Title -->
  <h1 class="text-2xl font-bold text-red-700 mb-6">Add Personnel</h1>

  <!-- Form Container -->
  <div class="w-full max-w-screen-2xl mx-auto bg-white shadow-md rounded-lg p-10">

    <!-- Step Indicator -->
    <div class="flex justify-center mb-8 space-x-6 text-sm font-medium">
      <span class="text-gray-400">1. Personal Data</span>
      <span class="text-red-700 border-b-2 border-red-700 pb-1">2. Log In Details</span>
    </div>

      <!-- Display messages -->
      {% if message %}
        <div class="mb-4 p-3 rounded-md text-sm font-medium
          {% if message_level == 'error' %}
            bg-red-100 text-red-700 border border-red-400
          {% elif message_level == 'success' %}
            bg-green-100 text-green-700 border border-green-400
          {% else %}
            bg-gray-100 text-gray-700 border border-gray-300
          {% endif %}
        ">
          {{ message }}
        </div>
      {% endif %}


    <!-- Form -->
    <form method="post" id="addPersonnelForm">
      {% csrf_token %}

      <!-- Hidden fields -->
      <input type="hidden" name="resident_id" value="{{ resident_id }}">
      <input type="hidden" name="role_id" value="{{ role_id }}">

      <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
        <!-- Username -->
        <div class="space-y-4">
          <div>
            <label class="block text-sm font-semibold text-gray-700">Username</label>
            <input type="text"
                   name="username"
                   placeholder="Enter Username"
                   value="{{ username|default:'' }}"
                   required
                   class="w-full border rounded px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-red-500" />
          </div>
        </div>

        <!-- Email (read-only but will submit) -->
        <div class="space-y-4">
          <div>
            <label class="block text-sm font-semibold text-gray-700">Email</label>
            <input type="email"
                   name="email"
                   value="{{ email|default_if_none:'' }}"
                   readonly
                   class="w-full border rounded px-3 py-2 text-sm bg-gray-100 text-gray-700 focus:outline-none" />
          </div>
        </div>
      </div>

      <!-- Action Buttons -->
      <div class="flex justify-between mt-10">
        <button type="button"
                onclick="window.history.back()"
                class="bg-red-700 text-white text-sm px-6 py-2 rounded hover:bg-red-800 transition">
          Back
        </button>
        <button type="submit"
                class="bg-red-700 text-white text-sm px-6 py-2 rounded hover:bg-red-800 transition">
          Add Personnel
        </button>
      </div>
    </form>
  </div>
</div>

<script>
  // Redirect after success message
  document.addEventListener("DOMContentLoaded", function () {
    var level = "{{ message_level|default:'' }}";
    if (level === "success") {
      setTimeout(function () {
        window.location.href = "{% url 'admin_module:personnel_list' %}";
      }, 2000);
    }
  });

</script>
{% endblock %}
