{% extends 'base_admin.html' %}

{% block title %}
    Password Request
{% endblock %}

{% block content %}
<div class="flex flex-col min-h-screen bg-gray-100 p-6">

    <!-- Page Title -->
    <h1 class="text-2xl font-bold text-red-700 mb-6">Password Request</h1>

    <!-- Search & Filters -->
    <div class="flex justify-between items-center mb-4">
        <!-- Search -->
        <div class="relative w-full max-w-sm">
            <input type="text" placeholder="Search Resident" class="w-full border rounded px-4 py-2 pl-10 text-sm focus:outline-none focus:ring-2 focus:ring-red-500" />
            <svg class="absolute left-3 top-2.5 w-4 h-4 text-gray-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                      d="M21 21l-4.35-4.35m0 0A7.5 7.5 0 1011.5 3a7.5 7.5 0 005.15 13.65z" />
            </svg>
        </div>

        <!-- Advanced Filters -->
        <div class="text-sm text-gray-600 flex items-center space-x-1 cursor-pointer hover:text-red-600">
            <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                      d="M3 4a1 1 0 011-1h16a1 1 0 011 1v2a1 1 0 01-.293.707L15 13.414V19a1 1 0 01-1.447.894l-4-2A1 1 0 019 17V13.414L3.293 6.707A1 1 0 013 6V4z" />
            </svg>
            <span>Advanced Filters</span>
        </div>
    </div>

    <!-- Table -->
    <div class="overflow-x-auto bg-white rounded shadow">
        <table class="min-w-full table-auto border border-gray-300 text-sm">
            <thead class="bg-gray-100 text-gray-700 font-semibold">
                <tr>
                    <th class="px-4 py-2 border">Personnel ID</th>
                    <th class="px-4 py-2 border">Full Name</th>
                    <th class="px-4 py-2 border">Sex</th>
                    <th class="px-4 py-2 border">Position</th>
                    <th class="px-4 py-2 border">Username</th>
                    <th class="px-4 py-2 border text-center">Action</th>
                </tr>
            </thead>
            <tbody class="text-center text-gray-800">
                <!-- Sample Row -->
                <tr class="hover:bg-gray-50">
                    <td class="px-4 py-2 border">00011</td>
                    <td class="px-4 py-2 border">Adrianne Villarta</td>
                    <td class="px-4 py-2 border">Male</td>
                    <td class="px-4 py-2 border">Treasurer</td>
                    <td class="px-4 py-2 border">adriannevillarta@gmail.com</td>
                    <td class="px-4 py-2 border">
                        <div class="flex justify-center gap-2">
                            <!-- Cancel -->
                            <button title="Cancel" class="text-red-600 hover:text-red-800">
                                <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                                          d="M6 18L18 6M6 6l12 12" />
                                </svg>
                            </button>
                            <!-- Approve -->
                            <button title="Approve" class="text-green-600 hover:text-green-800">
                                <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                                          d="M5 13l4 4L19 7" />
                                </svg>
                            </button>
                        </div>
                    </td>
                </tr>
              
            </tbody>
        </table>
    </div>
</div>
{% endblock %}
