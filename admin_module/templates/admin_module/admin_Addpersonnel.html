{% extends 'base_admin.html' %}

{% block title %}
    Admin
{% endblock %}

{% block content %}
<div class="flex flex-col min-h-screen bg-gray-100 p-6">

    <!-- Page Title -->
    <h1 class="text-2xl font-bold text-red-700 mb-6">Add Personnel</h1>

    <!-- Resident List Card -->
    <div class="bg-white shadow-md rounded-lg p-6">

        <!-- Title -->
        <div class="mb-6">
            <h2 class="text-xl font-bold text-gray-800">Resident List</h2>
        </div>

        <!-- Search and Filter Bar -->
        <div class="flex items-center justify-between mb-4 flex-wrap gap-2">
            <!-- Search Bar -->
            <div class="relative w-full max-w-xs">
                <input type="search" placeholder="Search"
                    class="w-full bg-gray-100 h-10 px-5 pr-10 rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-red-500">
                <span class="absolute right-3 top-2.5 text-gray-500">
                    <svg class="h-4 w-4 fill-current" viewBox="0 0 20 20">
                        <path
                            d="M12.9 14.32a8 8 0 111.414-1.414l4.387 4.387-1.414 1.414-4.387-4.387zM8 14a6 6 0 100-12 6 6 0 000 12z" />
                    </svg>
                </span>
            </div>

            <!-- Advanced Filters Button -->
            <button class="text-sm text-gray-600 hover:underline flex items-center gap-1">
                <svg class="h-4 w-4" fill="currentColor" viewBox="0 0 20 20">
                    <path
                        d="M3 5h14a1 1 0 100-2H3a1 1 0 000 2zm0 6h10a1 1 0 100-2H3a1 1 0 000 2zm0 6h6a1 1 0 100-2H3a1 1 0 000 2z" />
                </svg>
                Advanced Filters
            </button>
        </div>

        <!-- Resident Table -->
        <div class="overflow-x-auto">
            <table class="min-w-full table-auto border border-red-800 text-sm text-left">
                <thead class="bg-gray-200 text-gray-800 font-semibold">
                    <tr>
                        <th class="py-2 px-4 border">Resident ID</th>
                        <th class="py-2 px-4 border">Full Name</th>
                        <th class="py-2 px-4 border">Status</th>
                    </tr>
                </thead>
                <tbody class="text-gray-700">
                    <tr class="hover:bg-gray-50">
                        <td class="py-2 px-4 border">00001</td>
                        <td class="py-2 px-4 border">Juan Dela Cruz</td>
                        <td class="py-2 px-4 border">Resident</td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>
</div>

 
{% endblock %}
