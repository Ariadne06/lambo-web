{% extends 'base_admin.html' %}
{% block title %}Resident — Personal{% endblock %}

{% block content %}
<div class="px-6 py-6">
  <!-- CARD -->
  <div class="relative bg-white rounded-2xl border border-gray-200 shadow-sm p-6 max-w-5xl mx-auto">
    <!-- thin red strip -->
    <div class="absolute left-0 top-0 h-full w-1 bg-red-700 rounded-l-2xl"></div>

    <!-- Top: avatar + steps -->
    <div class="flex items-start gap-8 mb-6">
      <!-- Avatar -->
      <div class="shrink-0">
        <div class="w-32 h-32 rounded-full ring-2 ring-gray-200 overflow-hidden grid place-items-center bg-gray-50">
          <!-- simple avatar icon -->
          <svg xmlns="http://www.w3.org/2000/svg" class="w-20 h-20 text-gray-400" viewBox="0 0 24 24" fill="currentColor">
            <path d="M12 2a5 5 0 1 0 0 10 5 5 0 0 0 0-10Zm0 12c-5.33 0-8 2.67-8 6v2h16v-2c0-3.33-2.67-6-8-6Z"/>
          </svg>
        </div>
      </div>

      <!-- Steps -->
      <div class="grow">
        <div class="flex items-center gap-8 text-sm font-medium mb-4">
          <div class="flex items-center gap-2">
            <span class="text-red-700">1</span>
            <span class="text-red-700">Personal</span>
          </div>
          <div class="flex items-center gap-2 text-gray-400">
            <span>2</span>
            <span>Health</span>
          </div>
        </div>

        <!-- FORM -->
        <form class="grid grid-cols-1 md:grid-cols-2 gap-x-10 gap-y-4">
          <!-- LEFT column -->
          <div>
            <label class="block text-sm text-gray-700 mb-1">First Name</label>
            <input type="text" value="Adrianne" class="w-full rounded-md border border-gray-300 px-3 py-2">
          </div>
          <div>
            <label class="block text-sm text-gray-700 mb-1">Relationship of the HH Head</label>
            <input type="text" value="Brother" class="w-full rounded-md border border-gray-300 px-3 py-2">
          </div>

          <div>
            <label class="block text-sm text-gray-700 mb-1">Middle Name</label>
            <input type="text" value="Villarta" class="w-full rounded-md border border-gray-300 px-3 py-2">
          </div>
          <div>
            <label class="block text-sm text-gray-700 mb-1">Civil Status</label>
            <input type="text" value="Single" class="w-full rounded-md border border-gray-300 px-3 py-2">
          </div>

          <div>
            <label class="block text-sm text-gray-700 mb-1">Last Name</label>
            <input type="text" value="Medalla" class="w-full rounded-md border border-gray-300 px-3 py-2">
          </div>
          <div>
            <label class="block text-sm text-gray-700 mb-1">Religion</label>
            <input type="text" value="Catholic" class="w-full rounded-md border border-gray-300 px-3 py-2">
          </div>

          <div>
            <label class="block text-sm text-gray-700 mb-1">Date of Birth</label>
            <input type="text" value="01/01/2020" class="w-full rounded-md border border-gray-300 px-3 py-2">
          </div>
          <div>
            <label class="block text-sm text-gray-700 mb-1">Membership Type</label>
            <input type="text" value="Non Member" class="w-full rounded-md border border-gray-300 px-3 py-2">
          </div>

          <div>
            <label class="block text-sm text-gray-700 mb-1">Sex</label>
            <input type="text" value="Male" class="w-full rounded-md border border-gray-300 px-3 py-2">
          </div>
          <div>
            <label class="block text-sm text-gray-700 mb-1">PhilHealth ID Number</label>
            <input type="text" value="000000" class="w-full rounded-md border border-gray-300 px-3 py-2">
          </div>
        </form>

        <!-- Actions -->
        <div class="mt-6 flex items-center justify-between">
          <a href="#"
             class="inline-flex items-center justify-center rounded-xl bg-red-600 px-5 py-2 text-white text-sm font-medium shadow hover:bg-red-700">
            Back
          </a>
          <a href="#"
             class="inline-flex items-center justify-center rounded-xl bg-red-600 px-5 py-2 text-white text-sm font-medium shadow hover:bg-red-700">
            Next
          </a>
        </div>
      </div>
    </div>
  </div>
</div>
{% endblock %}
