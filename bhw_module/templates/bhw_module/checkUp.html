{% extends "base_admin.html" %}
{% block title %}Maternal Check Ups{% endblock %}

{% block content %}
<div class="px-6 py-8 bg-gradient-to-br from-rose-50 to-white">

  <!-- Header -->
  <div class="mb-4 flex items-center justify-between">
    <h1 class="text-2xl font-extrabold tracking-tight text-gray-900">
      Check Ups
    </h1>

    <!-- Add Check Up -->
    <a href="#"
       class="btn-red inline-flex items-center gap-2 rounded-lg px-4 py-2 text-sm font-semibold shadow">
      <!-- clipboard-plus -->
      <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4" viewBox="0 0 24 24" fill="currentColor">
        <path d="M9 2h6a2 2 0 0 1 2 2h2v6h-2V6h-2a2 2 0 0 1-2 2H9a2 2 0 0 1-2-2H5v12h5v2H3V4h2a2 2 0 0 1 2-2Zm2 2h2v2h-2V4Zm8 10v-3h2v3h3v2h-3v3h-2v-3h-3v-2h3Z"/>
      </svg>
      Add Check Up
    </a>
  </div>

  <!-- Card -->
  <div class="rounded-2xl border border-gray-200 bg-white shadow-sm">
    <div class="overflow-x-auto">
      <table class="min-w-full text-sm">
        <thead class="bg-red-600 text-white">
          <tr>
            <th class="py-3 px-4 text-left">Trimester</th>
            <th class="py-3 px-4 text-left">Date</th>
            <th class="py-3 px-4 text-left">AOG</th>
            <th class="py-3 px-4 text-left">Height</th>
            <th class="py-3 px-4 text-left">Weight</th>
            <th class="py-3 px-4 text-left">BP</th>
            <th class="py-3 px-4 text-left">Notes</th>
          </tr>
        </thead>
        <tbody class="divide-y">
          <tr class="hover:bg-rose-50/40 transition">
            <td class="py-3 px-4">1</td>
            <td class="py-3 px-4">01/02/2020</td>
            <td class="py-3 px-4">20</td>
            <td class="py-3 px-4">80 cm</td>
            <td class="py-3 px-4">5 kg</td>
            <td class="py-3 px-4">36.7</td>
            <td class="py-3 px-4">None</td>
          </tr>
          <tr class="hover:bg-rose-50/40 transition">
            <td class="py-3 px-4">2</td>
            <td class="py-3 px-4"></td>
            <td class="py-3 px-4"></td>
            <td class="py-3 px-4"></td>
            <td class="py-3 px-4"></td>
            <td class="py-3 px-4"></td>
            <td class="py-3 px-4"></td>
          </tr>
          <tr class="hover:bg-rose-50/40 transition">
            <td class="py-3 px-4">3</td>
            <td class="py-3 px-4"></td>
            <td class="py-3 px-4"></td>
            <td class="py-3 px-4"></td>
            <td class="py-3 px-4"></td>
            <td class="py-3 px-4"></td>
            <td class="py-3 px-4"></td>
          </tr>
        </tbody>
      </table>
    </div>

    <!-- Footer / Back -->
    <div class="flex items-center justify-between border-t bg-gray-50 px-4 py-3">
      <a href="#" class="btn-gray inline-flex items-center gap-2 rounded-lg px-4 py-2 text-sm font-semibold shadow ring-1 ring-black/5">
        <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4" viewBox="0 0 24 24" fill="currentColor">
          <path d="m11 6-6 6 6 6 1.41-1.41L8.83 13H20v-2H8.83l3.58-3.59L11 6Z"/>
        </svg>
        Back
      </a>

    </div>
  </div>
</div>

<!-- Local styles to ensure buttons never appear white -->
<style>
  .btn-red{
    background:linear-gradient(90deg,#f43f5e,#dc2626)!important;
    color:#fff!important;
  }
  .btn-red:hover{filter:brightness(.97)}
  .btn-gray{
    background:#f3f4f6!important;
    color:#111827!important;
  }
  .btn-gray:hover{background:#e5e7eb!important}
  .btn-dark{
    background:#111827!important; /* near black */
    color:#fff!important;
  }
  .btn-dark:hover{background:#0b1220!important}
</style>
{% endblock %}
