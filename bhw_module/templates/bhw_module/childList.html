{% extends "base_admin.html" %}

{% block content %}
<div class="p-6">

  <style>
    /* Scoped overrides so buttons inside the table keep their colors */
    .ch-btn{display:inline-flex;align-items:center;gap:.4rem;padding:.375rem .75rem;border-radius:.5rem;
      font-weight:600;box-shadow:0 2px 6px rgba(0,0,0,.15);color:#fff !important}
    .ch-btn--green{background:#22c55e !important}
    .ch-btn--blue {background:#3b82f6 !important}
    .ch-btn:hover{filter:brightness(.95)}

    /* Top bar buttons fallback */
    .ch-topbtn{background:linear-gradient(90deg,#f43f5e,#dc2626) !important;color:#fff !important}
    .ch-topbtn:hover{background:linear-gradient(90deg,#fb7185,#ef4444) !important}
  </style>

  <!-- Header -->
  <div class="flex justify-between items-center mb-6">
    <h1 class="text-2xl font-bold text-red-700">Child Health List</h1>
    <div class="flex gap-3">
      <a href="#"
         class="inline-flex items-center gap-2 rounded-lg px-4 py-2 text-sm font-semibold shadow ch-topbtn">
        ➕ Add Child Record
      </a>
      <button type="button" onclick="window.print()"
              class="inline-flex items-center gap-2 rounded-lg px-4 py-2 text-sm font-semibold shadow ch-topbtn">
        <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" viewBox="0 0 24 24" fill="currentColor">
          <path d="M6 9V3h12v6h1a3 3 0 0 1 3 3v5a3 3 0 0 1-3 3h-2v-4H8v4H6v-4H5a3 3 0 0 1-3-3v-5a3 3 0 0 1 3-3h1Zm2 0h8V5H8v4Z"/>
        </svg>
        Print Report
      </button>
    </div>
  </div>

  <!-- Table -->
  <div class="bg-white shadow-md rounded-xl overflow-hidden border border-gray-200">
    <table class="min-w-full text-sm text-gray-700">
      <thead class="bg-red-600 text-white">
        <tr>
          <th class="py-3 px-4 text-left">Child ID</th>
          <th class="py-3 px-4 text-left">Full Name</th>
          <th class="py-3 px-4 text-left">DOB</th>
          <th class="py-3 px-4 text-left">Sex</th>
          <th class="py-3 px-4 text-left">Mother’s Name</th>
          <th class="py-3 px-4 text-center">Actions</th>
        </tr>
      </thead>
      <tbody>
        <tr class="border-b hover:bg-gray-50">
          <td class="py-3 px-4">C1001</td>
          <td class="py-3 px-4">Juan Dela Cruz</td>
          <td class="py-3 px-4">05/12/2020</td>
          <td class="py-3 px-4">Male</td>
          <td class="py-3 px-4">Maria Dela Cruz</td>
          <td class="py-3 px-4 text-center">
            <div class="inline-flex gap-2">
              <a href="#" class="ch-btn ch-btn--green">View</a>
              <button onclick="toggleModal('editModal')" class="ch-btn ch-btn--blue">Edit</button>
            </div>
          </td>
        </tr>
      </tbody>
    </table>
  </div>

  <!-- Pagination -->
  <div class="flex justify-center mt-6">
    <nav class="flex items-center space-x-2 text-sm">
      <a href="#" class="px-3 py-1 border rounded-md hover:bg-gray-200">1</a>
      <a href="#" class="px-3 py-1 border rounded-md hover:bg-gray-200">2</a>
      <a href="#" class="px-3 py-1 border rounded-md hover:bg-gray-200">3</a>
      <span class="px-3 py-1">...</span>
      <a href="#" class="px-3 py-1 border rounded-md hover:bg-gray-200">45</a>
    </nav>
  </div>
</div>
<!-- ================== MODALS ================== -->

<!-- Edit Modal (enhanced) -->
<div id="editModal" class="hidden fixed inset-0 z-50">
  <!-- Backdrop -->
  <div class="absolute inset-0 bg-black/50" onclick="toggleModal('editModal')"></div>

  <!-- Modal container -->
  <div class="relative mx-auto my-8 w-[95%] max-w-4xl">
    <div class="bg-white rounded-xl shadow-lg border border-gray-200 overflow-hidden">
      <!-- Top Accent -->
      <div class="bg-gradient-to-r from-red-600 to-red-500 text-white px-6 py-3 flex items-center justify-between">
        <h2 class="text-lg font-semibold tracking-wide">Update Child Health Record</h2>
        <button type="button" onclick="toggleModal('editModal')" class="text-white/90 hover:text-white text-xl leading-none font-bold">
          &times;
        </button>
      </div>

      <!-- Scrollable Body -->
      <div class="p-6 max-h-[75vh] overflow-y-auto bg-white">
        <form class="grid grid-cols-1 md:grid-cols-2 gap-6" onsubmit="event.preventDefault(); /* TODO: submit via fetch/ajax */">
          <!-- Left Side -->
          <div class="space-y-4">
            <div>
              <label class="block text-sm font-medium text-gray-700">Child Full Name</label>
              <input type="text" placeholder="Input Child Name"
                     class="mt-1 w-full rounded-lg border-gray-300 shadow-sm text-sm p-2 focus:border-red-500 focus:ring-red-500"/>
            </div>

            <div>
              <label class="block text-sm font-medium text-gray-700">Mother's Full Name</label>
              <input type="text" placeholder="Input Mother's Name"
                     class="mt-1 w-full rounded-lg border-gray-300 shadow-sm text-sm p-2 focus:border-red-500 focus:ring-red-500"/>
            </div>

            <div>
              <label class="block text-sm font-medium text-gray-700">Father's Full Name</label>
              <input type="text" placeholder="Input Father's Name"
                     class="mt-1 w-full rounded-lg border-gray-300 shadow-sm text-sm p-2 focus:border-red-500 focus:ring-red-500"/>
            </div>

            <div>
              <label class="block text-sm font-medium text-gray-700">PhilHealth ID Number</label>
              <input type="text" placeholder="Enter ID Number"
                     class="mt-1 w-full rounded-lg border-gray-300 shadow-sm text-sm p-2 focus:border-red-500 focus:ring-red-500"/>
            </div>

            <div>
              <label class="block text-sm font-medium text-gray-700">Phone Number</label>
              <input type="text" placeholder="Input Phone Number"
                     class="mt-1 w-full rounded-lg border-gray-300 shadow-sm text-sm p-2 focus:border-red-500 focus:ring-red-500"/>
            </div>

            <div>
              <label class="block text-sm font-medium text-gray-700">Feeding Method</label>
              <div class="flex gap-6 mt-1 text-sm text-gray-700">
                <label class="flex items-center"><input type="radio" name="feeding" class="text-red-600 focus:ring-red-500 mr-2">Breastfeeding</label>
                <label class="flex items-center"><input type="radio" name="feeding" class="text-red-600 focus:ring-red-500 mr-2">Bottle</label>
                <label class="flex items-center"><input type="radio" name="feeding" class="text-red-600 focus:ring-red-500 mr-2">Mixed</label>
              </div>
            </div>
          </div>

          <!-- Right Side -->
          <div class="space-y-4">
            <div>
              <label class="block text-sm font-medium text-gray-700">Sex</label>
              <select class="mt-1 w-full rounded-lg border-gray-300 shadow-sm text-sm p-2 focus:border-red-500 focus:ring-red-500">
                <option>Select Sex</option>
                <option>Male</option>
                <option>Female</option>
              </select>
            </div>

            <div>
              <label class="block text-sm font-medium text-gray-700">Date of Birth</label>
              <input type="date"
                     class="mt-1 w-full rounded-lg border-gray-300 shadow-sm text-sm p-2 focus:border-red-500 focus:ring-red-500"/>
            </div>

            <div>
              <label class="block text-sm font-medium text-gray-700">Time of Birth</label>
              <input type="time"
                     class="mt-1 w-full rounded-lg border-gray-300 shadow-sm text-sm p-2 focus:border-red-500 focus:ring-red-500"/>
            </div>

            <div>
              <label class="block text-sm font-medium text-gray-700">Birth Weight (Kg)</label>
              <input type="number" placeholder="Input Birth Weight"
                     class="mt-1 w-full rounded-lg border-gray-300 shadow-sm text-sm p-2 focus:border-red-500 focus:ring-red-500"/>
            </div>

            <div>
              <label class="block text-sm font-medium text-gray-700">Birth Height (Cm)</label>
              <input type="number" placeholder="Input Birth Height"
                     class="mt-1 w-full rounded-lg border-gray-300 shadow-sm text-sm p-2 focus:border-red-500 focus:ring-red-500"/>
            </div>

            <div>
              <label class="block text-sm font-medium text-gray-700">Place of Delivery</label>
              <input type="text" placeholder="Input Place of Delivery"
                     class="mt-1 w-full rounded-lg border-gray-300 shadow-sm text-sm p-2 focus:border-red-500 focus:ring-red-500"/>
            </div>
          </div>

          <!-- Bottom Section -->
          <div class="col-span-2 grid grid-cols-1 md:grid-cols-2 gap-6">
            <div>
              <label class="block text-sm font-medium text-gray-700">TT Status of Mother</label>
              <input type="text" placeholder="Input Status"
                     class="mt-1 w-full rounded-lg border-gray-300 shadow-sm text-sm p-2 focus:border-red-500 focus:ring-red-500"/>
            </div>
            <div>
              <label class="block text-sm font-medium text-gray-700">Date TT Status is Assessed</label>
              <input type="date"
                     class="mt-1 w-full rounded-lg border-gray-300 shadow-sm text-sm p-2 focus:border-red-500 focus:ring-red-500"/>
            </div>
          </div>

          <div class="col-span-2 grid grid-cols-1 md:grid-cols-2 gap-6">
            <div>
              <label class="block text-sm font-medium text-gray-700">Newborn Screening Status</label>
              <select class="mt-1 w-full rounded-lg border-gray-300 shadow-sm text-sm p-2 focus:border-red-500 focus:ring-red-500">
                <option>Select Done/Not Done</option>
                <option>Done</option>
                <option>Not Done</option>
              </select>
            </div>
            <div>
              <label class="block text-sm font-medium text-gray-700">If Done, input Date</label>
              <input type="date"
                     class="mt-1 w-full rounded-lg border-gray-300 shadow-sm text-sm p-2 focus:border-red-500 focus:ring-red-500"/>
            </div>
          </div>

          <!-- Buttons -->
          <div class="col-span-2 flex justify-end gap-3 mt-6">
            <button type="button"
                    class="px-5 py-2.5 rounded-lg bg-gray-100 text-gray-700 font-medium shadow-sm hover:bg-gray-200 transition flex items-center gap-2"
                    onclick="toggleModal('editModal')">
              ✖ Cancel
            </button>
            <button type="submit"
                    class="px-5 py-2.5 rounded-lg bg-red-600 text-white font-semibold shadow hover:bg-red-700 transition flex items-center gap-2">
              💾 Update
            </button>
          </div>
        </form>
      </div>
    </div>
  </div>
</div>



<script>
function toggleModal(id) {
  const el = document.getElementById(id);
  const isHidden = el.classList.contains('hidden');
  el.classList.toggle('hidden');

  // prevent body scroll when a modal is open
  if (isHidden) {
    document.body.classList.add('overflow-hidden');
  } else {
    document.body.classList.remove('overflow-hidden');
  }
}

// close on ESC
document.addEventListener('keydown', (e) => {
  if (e.key === 'Escape') {
    const modals = ['viewModal','editModal'];
    for (const id of modals) {
      const el = document.getElementById(id);
      if (el && !el.classList.contains('hidden')) {
        toggleModal(id);
      }
    }
  }
});
</script>

{% endblock %}
