{% extends "base_admin.html" %}

{% block title %}Add Growth Monitoring{% endblock %}

{% block content %}
<div class="px-6 py-6 bg-gray-50">
  <!-- Header -->
  <div class="mb-6 flex items-center gap-3">
    <span class="inline-flex h-10 w-10 items-center justify-center rounded-xl bg-red-100 text-red-600">
      <!-- Ruler icon -->
      <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" viewBox="0 0 24 24" fill="currentColor">
        <path d="M3 6a3 3 0 013-3h12a3 3 0 013 3v12a3 3 0 01-3 3H6a3 3 0 01-3-3V6zm4 2h2v2H7V8zm4 0h2v2h-2V8zm4 0h2v2h-2V8zM7 12h2v2H7v-2zm4 0h2v2h-2v-2zm4 0h2v2h-2v-2zM7 16h2v2H7v-2zm4 0h2v2h-2v-2zm4 0h2v2h-2v-2z"/>
      </svg>
    </span>
    <h1 class="text-xl font-semibold text-gray-900 tracking-tight">Add Growth Monitoring</h1>
  </div>

  <!-- Card -->
  <div class="rounded-xl border border-gray-200 bg-white shadow-sm">
    <form class="p-5 space-y-5">
      <!-- Grid -->
      <div class="grid grid-cols-1 lg:grid-cols-2 gap-5">
        <!-- Left -->
        <div class="space-y-3">
          <div>
            <label class="block text-sm font-medium text-gray-700">Age in Month</label>
            <input type="number" placeholder="12" class="w-full rounded-md border-gray-300 px-3 py-1.5 text-sm focus:ring-red-500">
          </div>
          <div>
            <label class="block text-sm font-medium text-gray-700">Date of Visit</label>
            <input type="text" placeholder="MM/DD/YYYY" class="w-full rounded-md border-gray-300 px-3 py-1.5 text-sm focus:ring-red-500">
          </div>
          <div>
            <label class="block text-sm font-medium text-gray-700">Weight (kg)</label>
            <input type="text" placeholder="Input weight" class="w-full rounded-md border-gray-300 px-3 py-1.5 text-sm focus:ring-red-500">
          </div>
          <div>
            <label class="block text-sm font-medium text-gray-700">Height (cm)</label>
            <input type="text" placeholder="Input height" class="w-full rounded-md border-gray-300 px-3 py-1.5 text-sm focus:ring-red-500">
          </div>
          <div>
            <label class="block text-sm font-medium text-gray-700">Temperature (°C)</label>
            <input type="text" placeholder="Input temperature" class="w-full rounded-md border-gray-300 px-3 py-1.5 text-sm focus:ring-red-500">
          </div>
        </div>

        <!-- Right -->
        <div>
          <label class="block text-sm font-medium text-gray-700">Note</label>
          <textarea rows="9" placeholder="Observations..." class="w-full rounded-md border-gray-300 px-3 py-2 text-sm focus:ring-red-500"></textarea>
        </div>
      </div>

      <!-- Footer -->
      <div class="flex items-center justify-between pt-3">
        <!-- Note -->
      <div class="rounded-xl border border-amber-200 bg-amber-50 text-amber-800 px-4 py-3 text-xs flex items-start gap-2">
        <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4 mt-0.5" viewBox="0 0 24 24" fill="currentColor">
          <path d="M12 2 1 21h22L12 2Zm1 15h-2v-2h2v2Zm0-4h-2V9h2v4Z"/>
        </svg>
        <p><b>Note:</b> Please review the information before saving. Make sure all fields are complete and accurate.</p>
      </div>

        <!-- Buttons -->
        <div class="flex gap-3">
          <button type="submit" 
                  class="inline-flex items-center gap-1.5 rounded-lg border border-gray-300 px-4 py-1.5 text-sm font-medium text-black hover:bg-gray-50">
            <!-- Save icon -->
            <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4 text-black" viewBox="0 0 24 24" fill="currentColor">
              <path d="M5 3h11l3 3v13a2 2 0 01-2 2H5a2 2 0 01-2-2V5a2 2 0 012-2Zm7 2H6v4h6V5Zm-6 8h12v6H6v-6Z"/>
            </svg>
            Save
          </button>
          <a href="#" 
             class="inline-flex items-center gap-1.5 rounded-lg border border-gray-300 bg-red-700 px-4 py-1.5 text-sm font-medium text-white hover:bg-red-500">
            <!-- Cancel icon -->
            <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4 text-white" viewBox="0 0 24 24" fill="currentColor">
              <path d="M6.225 4.811 4.81 6.225 10.586 12 4.81 17.775l1.414 1.414L12 13.414l5.775 5.775 1.414-1.414L13.414 12l5.775-5.775-1.414-1.414L12 10.586 6.225 4.811Z"/>
            </svg>
            Cancel
          </a>
        </div>
      </div>
    </form>
  </div>
</div>
{% endblock %}
