{% extends "base_admin.html" %}
{% block title %}Infectious Disease Screening{% endblock %}

{% block content %}
<div class="px-6 py-8 bg-gradient-to-br from-rose-50 to-white">

  <!-- Header -->
  <div class="mb-6 flex items-center justify-between">
    <div class="inline-flex items-center gap-2 rounded-2xl px-4 py-1.5 text-white text-sm font-semibold shadow ring-1 ring-black/5"
         style="background-image:linear-gradient(90deg,#ef4444 0%,#dc2626 50%,#b91c1c 100%);">
      <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4" viewBox="0 0 24 24" fill="currentColor">
        <path d="M20 6h-8l-2-2H4a2 2 0 0 0-2 2v12a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2V8a2 2 0 0 0-2-2Z"/>
      </svg>
      Infectious Disease Screening
    </div>

    <!-- Add button -->
    <a href="#"
       class="btn-red inline-flex items-center gap-2 rounded-lg px-4 py-2 text-sm font-semibold shadow">
        <path d="M12 5v14m-7-7h14" />
      </svg>
      Add Screening Record
    </a>
  </div>

  <!-- Table -->
  <div class="mx-auto max-w-4xl overflow-hidden rounded-2xl border border-gray-200 bg-white shadow">
    <table class="min-w-full text-sm">
      <thead class="bg-rose-600 text-white">
        <tr>
          <th class="px-6 py-3 text-left font-semibold">Disease Type</th>
          <th class="px-6 py-3 text-left font-semibold">Date Screened</th>
          <th class="px-6 py-3 text-left font-semibold">Result</th>
        </tr>
      </thead>
      <tbody class="text-gray-700">
        <tr class="odd:bg-white even:bg-gray-50 hover:bg-rose-50">
          <td class="px-6 py-3 font-medium">Syphilis</td>
          <td class="px-6 py-3">—</td>
          <td class="px-6 py-3">—</td>
        </tr>
        <tr class="odd:bg-white even:bg-gray-50 hover:bg-rose-50">
          <td class="px-6 py-3 font-medium">Hepatitis B</td>
          <td class="px-6 py-3">—</td>
          <td class="px-6 py-3">—</td>
        </tr>
        <tr class="odd:bg-white even:bg-gray-50 hover:bg-rose-50">
          <td class="px-6 py-3 font-medium">HIV Screening</td>
          <td class="px-6 py-3">—</td>
          <td class="px-6 py-3">—</td>
        </tr>
      </tbody>
    </table>
  </div>

  <!-- Footer -->
  <div class="mt-6">
    <a href="#"
       class="btn-gray inline-flex items-center gap-2 rounded-lg px-4 py-2 text-sm font-semibold shadow ring-1 ring-black/5">
      <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4" viewBox="0 0 24 24" fill="currentColor">
        <path d="m11 6-6 6 6 6 1.41-1.41L8.83 13H20v-2H8.83l3.58-3.59L11 6Z"/>
      </svg>
      Back
    </a>
  </div>
</div>

<!-- Local Styles -->
<style>
  .btn-red {
    background:linear-gradient(90deg,#f43f5e,#dc2626)!important;
    color:#fff!important;
  }
  .btn-red:hover{filter:brightness(.95)}
  .btn-gray {
    background:#f3f4f6!important;
    color:#111827!important;
  }
  .btn-gray:hover {background:#e5e7eb!important}
</style>
{% endblock %}
