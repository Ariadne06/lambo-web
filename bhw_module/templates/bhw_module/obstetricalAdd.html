{% extends "base_admin.html" %}
{% block title %}Edit Obstetrical History{% endblock %}

{% block content %}

<div class="px-6 py-8 bg-gradient-to-br from-rose-50 to-white"> <!-- Header --> <div class="mb-5 flex items-center justify-between"> <h1 class="text-xl font-extrabold tracking-tight text-gray-900 flex items-center gap-2"> <span class="inline-block h-2 w-2 rounded-full bg-rose-600"></span> Edit Obstetrical History </h1> </div> <!-- Card --> <div class="mx-auto max-w-3xl overflow-hidden rounded-2xl border border-gray-200 bg-white shadow-sm"> <form class="px-6 py-6 space-y-6">
      <!-- GPA Row -->
  <div class="grid grid-cols-1 gap-4 sm:grid-cols-3">
    <!-- Gravida -->
    <div>
      <label class="text-[11px] font-semibold text-gray-500">Gravida (Pregnancies)</label>
      <div class="relative mt-1">
        <span class="pointer-events-none absolute left-3 top-2.5 text-gray-400">
          <svg class="h-4 w-4" viewBox="0 0 24 24" fill="currentColor"><path d="M12 2a6 6 0 0 0-6 6c0 3 2 6 6 10 4-4 6-7 6-10a6 6 0 0 0-6-6Zm0 8a2 2 0 1 1 .001-3.999A2 2 0 0 1 12 10Z"/></svg>
        </span>
        <input type="number" min="0" value="0"
          class="w-full rounded-lg border border-gray-300 bg-white pl-9 pr-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-rose-500">
      </div>
    </div>

    <!-- Para -->
    <div>
      <label class="text-[11px] font-semibold text-gray-500">Para (Live Births)</label>
      <div class="relative mt-1">
        <span class="pointer-events-none absolute left-3 top-2.5 text-gray-400">
          <svg class="h-4 w-4" viewBox="0 0 24 24" fill="currentColor"><path d="M12 21a8 8 0 1 1 8-8 8.01 8.01 0 0 1-8 8Zm-1-7h2v5h-2v-5Zm1-6a1.5 1.5 0 1 1-1.5 1.5A1.5 1.5 0 0 1 12 8Z"/></svg>
        </span>
        <input type="number" min="0" value="0"
          class="w-full rounded-lg border border-gray-300 bg-white pl-9 pr-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-rose-500">
      </div>
    </div>

    <!-- Abortion -->
    <div>
      <label class="text-[11px] font-semibold text-gray-500">Abortion (Miscarriages)</label>
      <div class="relative mt-1">
        <span class="pointer-events-none absolute left-3 top-2.5 text-gray-400">
          <svg class="h-4 w-4" viewBox="0 0 24 24" fill="currentColor"><path d="M12 22C7 18 4 14 4 10a8 8 0 0 1 16 0c0 4-3 8-8 12Zm0-10a2 2 0 1 0-2-2 2 2 0 0 0 2 2Z"/></svg>
        </span>
        <input type="number" min="0" value="0"
          class="w-full rounded-lg border border-gray-300 bg-white pl-9 pr-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-rose-500">
      </div>
    </div>
  </div>

  <!-- Dates Row -->
  <div class="grid grid-cols-1 gap-4 sm:grid-cols-2">
    <div>
      <label class="text-[11px] font-semibold text-gray-500">Last Menstrual Period</label>
      <div class="relative mt-1">
        <span class="pointer-events-none absolute left-3 top-2.5 text-gray-400">
          <svg class="h-4 w-4" viewBox="0 0 24 24" fill="currentColor"><path d="M7 2h2v2h6V2h2v2h3v18H4V4h3V2Zm12 6H5v12h14V8Z"/></svg>
        </span>
        <input type="date" value="2020-01-01"
          class="w-full rounded-lg border border-gray-300 bg-white pl-9 pr-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-rose-500">
      </div>
    </div>

    <div>
      <label class="text-[11px] font-semibold text-gray-500">Expected Delivery Date</label>
      <div class="relative mt-1">
        <span class="pointer-events-none absolute left-3 top-2.5 text-gray-400">
          <svg class="h-4 w-4" viewBox="0 0 24 24" fill="currentColor"><path d="M19 3H5v2h14V3Zm1 4H4v14h16V7ZM8 12h3v3H8v-3Z"/></svg>
        </span>
        <input type="date" value="2020-10-01"
          class="w-full rounded-lg border border-gray-300 bg-white pl-9 pr-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-rose-500">
      </div>
    </div>
  </div>

  <!-- Note -->
  <div class="rounded-lg border border-rose-200 bg-rose-50 px-3 py-2 text-[12px] text-rose-700">
    <span class="mr-1 inline-block align-middle">
      <svg class="h-3.5 w-3.5" viewBox="0 0 24 24" fill="currentColor"><path d="M1 21h22L12 2 1 21Zm12-3h-2v-2h2v2Zm0-4h-2v-4h2v4Z"/></svg>
    </span>
    Please review the information before saving. Make sure all fields are complete and accurate.
  </div>

  <!-- Actions -->
  <div class="flex items-center justify-end gap-2">
    <button type="button"
            class="btn-gray inline-flex items-center gap-2 rounded-lg px-4 py-2 text-sm font-semibold shadow ring-1 ring-black/5">
      Cancel
    </button>
    <button type="submit"
            class="btn-red inline-flex items-center gap-2 rounded-lg px-4 py-2 text-sm font-semibold shadow">
      <svg class="h-4 w-4" viewBox="0 0 24 24" fill="currentColor"><path d="m5 13 4 4L19 7l-1.4-1.4L9 14.2 6.4 11.6 5 13Z"/></svg>
      Save
    </button>
  </div>
</form>
</div> </div> <!-- Local styles (prevents “white buttons” if global CSS overrides anchors/buttons) --> <style> .btn-red{background:linear-gradient(90deg,#f43f5e,#dc2626)!important;color:#fff!important} .btn-red:hover{filter:brightness(.97)} .btn-gray{background:#f3f4f6!important;color:#111827!important} .btn-gray:hover{background:#e5e7eb!important} </style>

{% endblock %}
