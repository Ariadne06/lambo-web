{% extends 'base_admin.html' %}
{% block title %}Update Information — Address{% endblock %}

{% block content %}
<div class="px-6 py-6">
  <div class="relative bg-white rounded-2xl border border-gray-200 shadow-sm p-6 max-w-5xl mx-auto">
    <!-- thin red accent -->
    <div class="absolute left-0 top-0 h-full w-1 bg-red-700 rounded-l-2xl"></div>

    <!-- Page title -->
    <h2 class="text-xl font-semibold text-gray-800 mb-6">Update Information</h2>

    <!-- Step header -->
    <div class="flex items-center gap-10 text-sm font-medium mb-6">
      <div class="flex items-center gap-2 text-gray-400">
        <span>1</span><span>Personal Data</span>
      </div>
      <div class="flex items-center gap-2">
        <span class="text-red-700">2</span><span class="text-red-700">Address</span>
      </div>
    </div>

    <h3 class="text-sm font-semibold text-gray-800 mb-4">Address</h3>

    <form class="grid grid-cols-1 md:grid-cols-2 gap-x-10 gap-y-4">
      <!-- Left column -->
      <div>
        <label class="block text-sm text-gray-700 mb-1">House Number</label>
        <input type="text" value="Block 12 Lot 5"
               class="w-full rounded-md border border-gray-300 px-3 py-2 focus:outline-none focus:ring-2 focus:ring-red-600">
      </div>

      <!-- Right column label (Registered Voter) occupies its spot -->
      <div class="md:row-span-3">
        <p class="block text-sm text-gray-700 mb-2">Registered Voter</p>
        <label class="flex items-center gap-2 mb-2 cursor-pointer">
          <input type="radio" name="voter" class="h-4 w-4 text-red-600 focus:ring-red-600">
          <span class="text-sm text-gray-700">Yes</span>
        </label>
        <label class="flex items-center gap-2 cursor-pointer">
          <input type="radio" name="voter" class="h-4 w-4 text-red-600 focus:ring-red-600">
          <span class="text-sm text-gray-700">No</span>
        </label>
      </div>

      <div>
        <label class="block text-sm text-gray-700 mb-1">Street</label>
        <input type="text" value="12 Street"
               class="w-full rounded-md border border-gray-300 px-3 py-2 focus:outline-none focus:ring-2 focus:ring-red-600">
      </div>

      <div>
        <label class="block text-sm text-gray-700 mb-1">Barangay</label>
        <input type="text" value="Cansaga"
               class="w-full rounded-md border border-gray-300 px-3 py-2 focus:outline-none focus:ring-2 focus:ring-red-600">
      </div>
    </form>

    <!-- Actions -->
    <div class="mt-10 flex items-center justify-between">
      <a href="#"
         class="inline-flex items-center justify-center rounded-xl bg-gray-200 px-5 py-2 text-gray-700 text-sm font-medium shadow hover:bg-gray-300">
        Back Page
      </a>
      <button type="submit"
              class="inline-flex items-center justify-center rounded-xl bg-red-600 px-6 py-2 text-white text-sm font-semibold shadow hover:bg-red-700">
        Submit
      </button>
    </div>
  </div>
</div>
{% endblock %}
