{% extends "base_admin.html" %}
{% load static %}

{% block content %}
<div class="p-6">
    <!-- Header -->
    <h2 class="text-xl font-semibold text-red-600 mb-4">Child Growth Monitoring</h2>

    <!-- Add Button -->
    <button class="bg-red-600 text-white px-4 py-2 rounded-lg shadow hover:bg-red-700 transition flex items-center space-x-2 mb-4">
        <i class="fas fa-plus-circle"></i>
        <span>➕ Add Growth Monitoring</span>
    </button>

    <!-- Table -->
    <div class="bg-white rounded-xl shadow p-4">
        <table class="table-auto w-full border border-gray-200 rounded-lg overflow-hidden">
            <thead class="bg-red-600 text-white">
                <tr>
                    <th class="px-4 py-2 text-left">Age (mos)</th>
                    <th class="px-4 py-2 text-left">Date</th>
                    <th class="px-4 py-2 text-left">Height</th>
                    <th class="px-4 py-2 text-left">Weight</th>
                    <th class="px-4 py-2 text-left">Temp</th>
                    <th class="px-4 py-2 text-left">Notes</th>
                </tr>
            </thead>
            <tbody class="divide-y divide-gray-200">
                <tr>
                    <td class="px-4 py-2">4</td>
                    <td class="px-4 py-2">01/02/2020</td>
                    <td class="px-4 py-2">80 cm</td>
                    <td class="px-4 py-2">5 kg</td>
                    <td class="px-4 py-2">36.7</td>
                    <td class="px-4 py-2">None</td>
                </tr>
                <tr>
                    <td class="px-4 py-2">5</td>
                    <td class="px-4 py-2">01/02/2020</td>
                    <td class="px-4 py-2">90 cm</td>
                    <td class="px-4 py-2">6 kg</td>
                    <td class="px-4 py-2">36.7</td>
                    <td class="px-4 py-2">Fever</td>
                </tr>
                <tr>
                    <td class="px-4 py-2">6</td>
                    <td class="px-4 py-2">01/02/2020</td>
                    <td class="px-4 py-2">100 cm</td>
                    <td class="px-4 py-2">7 kg</td>
                    <td class="px-4 py-2">36.7</td>
                    <td class="px-4 py-2">Cough</td>
                </tr>
            </tbody>
        </table>
    </div>

    <!-- Pagination -->
    <div class="flex justify-center mt-4">
        <nav class="flex space-x-2">
            <button class="px-3 py-1 border rounded hover:bg-red-100">1</button>
            <button class="px-3 py-1 border rounded hover:bg-red-100">2</button>
            <button class="px-3 py-1 border rounded hover:bg-red-100">3</button>
            <span class="px-3 py-1">...</span>
            <button class="px-3 py-1 border rounded hover:bg-red-100">60</button>
        </nav>
    </div>

    <!-- Back Button -->
    <div class="mt-6">
        <button class="bg-red-600 text-white px-5 py-2 rounded-lg shadow hover:bg-red-700 transition flex items-center space-x-2">
            <i class="fas fa-arrow-left"></i>
            <span>Back</span>
        </button>
    </div>
</div>
{% endblock %}
