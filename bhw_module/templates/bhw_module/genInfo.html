{% extends "base_admin.html" %}
{% block title %}General Health Information{% endblock %}

{% block content %}
<div class="px-6 py-6 bg-gray-50">

  <!-- Page title -->
  <div class="mb-5">
    <h1 class="text-2xl font-extrabold tracking-tight text-red-700">General Health Information</h1>
  </div>

  <!-- Top tools: search + filters + right actions -->
  <div class="mb-4 flex flex-col gap-3 sm:flex-row sm:items-center sm:justify-between">
    <!-- Search + filters -->
    <div class="flex items-center gap-3 w-full sm:max-w-xl">
      <div class="relative flex-1">
        <input type="text" placeholder="Search household or resident…"
               class="w-full rounded-lg border border-gray-300 pl-10 pr-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-red-500 focus:border-red-500">
        <span class="pointer-events-none absolute left-3 top-2.5 text-gray-400">
          <!-- search icon -->
          <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" viewBox="0 0 24 24" fill="currentColor">
            <path d="m21 21-4.35-4.35M11 18a7 7 0 1 1 0-14 7 7 0 0 1 0 14Z"/>
          </svg>
        </span>
      </div>

      <button type="button"
        class="gh-gray inline-flex items-center gap-2 rounded-lg px-3 py-2 text-sm font-semibold shadow ring-1 ring-black/5">
        <!-- filter icon -->
        <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4" viewBox="0 0 24 24" fill="currentColor">
          <path d="M3 4h18v2l-7 7v5l-4 2v-7L3 6V4Z"/>
        </svg>
        Advanced Filters
      </button>
    </div>

    <!-- Right actions -->
    <div class="flex items-center gap-2">
      <button type="button"
        class="gh-gray inline-flex items-center gap-2 rounded-lg px-3 py-2 text-sm font-semibold shadow ring-1 ring-black/5">
        <!-- download icon -->
        <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4" viewBox="0 0 24 24" fill="currentColor">
          <path d="M12 3v10l3-3 1.41 1.41L12 17.82l-4.41-4.41L9 10l3 3V3h0Z"/>
          <path d="M5 19h14v2H5z"/>
        </svg>
        Export CSV
      </button>

    </div>
  </div>

  <!-- Table -->
  <div class="overflow-hidden rounded-xl border border-gray-200 bg-white shadow-sm">
    <table class="min-w-full text-sm">
      <thead class="bg-gray-100 text-gray-700">
        <tr>
          <th class="px-4 py-3 text-left font-semibold">Resident ID</th>
          <th class="px-4 py-3 text-left font-semibold">Household No.</th>
          <th class="px-4 py-3 text-left font-semibold">Smoker</th>
          <th class="px-4 py-3 text-left font-semibold">Resident Full Name</th>
          <th class="px-4 py-3 text-center font-semibold">Action</th>
        </tr>
      </thead>
      <tbody class="divide-y divide-gray-100 text-gray-700">
        <!-- Row sample 1 -->
        <tr class="hover:bg-gray-50">
          <td class="px-4 py-3">1000</td>
          <td class="px-4 py-3">0001</td>
          <td class="px-4 py-3">
            <span class="inline-flex items-center gap-1 rounded-full bg-emerald-50 px-2 py-0.5 text-emerald-700 text-xs font-semibold">No</span>
          </td>
          <td class="px-4 py-3">Adrianne Villarta</td>
          <td class="px-4 py-3">
            <div class="flex items-center justify-center gap-2">
              <a href="#" class="gh-green inline-flex items-center gap-1 rounded-md px-3 py-1.5 text-xs font-semibold shadow">
                <!-- eye -->
                <svg xmlns="http://www.w3.org/2000/svg" class="h-3.5 w-3.5" viewBox="0 0 24 24" fill="currentColor">
                  <path d="M12 5c-7 0-10 7-10 7s3 7 10 7 10-7 10-7-3-7-10-7Zm0 11a4 4 0 1 1 0-8 4 4 0 0 1 0 8Z"/>
                </svg>
                View
              </a>
            </div>
          </td>
        </tr>

        <!-- Row sample 2 -->
        <tr class="hover:bg-gray-50">
          <td class="px-4 py-3">1001</td>
          <td class="px-4 py-3">0002</td>
          <td class="px-4 py-3">
            <span class="inline-flex items-center gap-1 rounded-full bg-rose-50 px-2 py-0.5 text-rose-700 text-xs font-semibold">Yes</span>
          </td>
          <td class="px-4 py-3">Adrian Medalla</td>
          <td class="px-4 py-3">
            <div class="flex items-center justify-center gap-2">
              <a href="#" class="gh-green inline-flex items-center gap-1 rounded-md px-3 py-1.5 text-xs font-semibold shadow">
                <svg xmlns="http://www.w3.org/2000/svg" class="h-3.5 w-3.5" viewBox="0 0 24 24" fill="currentColor">
                  <path d="M12 5c-7 0-10 7-10 7s3 7 10 7 10-7 10-7-3-7-10-7Zm0 11a4 4 0 1 1 0-8 4 4 0 0 1 0 8Z"/>
                </svg>
                View
              </a>
            </div>
          </td>
        </tr>

        <!-- Repeat more rows as needed … -->

      </tbody>
    </table>
  </div>

  <!-- Pagination -->
  <div class="mt-5 flex justify-center">
    <nav class="flex items-center gap-1 text-sm">
      <a href="#" class="px-3 py-1 rounded-md border hover:bg-gray-100">1</a>
      <a href="#" class="px-3 py-1 rounded-md border hover:bg-gray-100">2</a>
      <a href="#" class="px-3 py-1 rounded-md border hover:bg-gray-100">3</a>
      <span class="px-3 py-1">…</span>
      <a href="#" class="px-3 py-1 rounded-md border hover:bg-gray-100">60</a>
    </nav>
  </div>

  <!-- Floating bottom-right chip (like your sample) -->
  <div class="fixed right-5 bottom-5">
    <button type="button" onclick="window.print()"
      class="gh-red inline-flex items-center gap-2 rounded-xl px-4 py-2 text-sm font-semibold shadow-lg ring-1 ring-black/5">
      <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4" viewBox="0 0 24 24" fill="currentColor">
        <path d="M6 9V3h12v6h1.5A2.5 2.5 0 0 1 22 11.5V17a2 2 0 0 1-2 2h-2v-4H6v4H4a2 2 0 0 1-2-2v-5.5A2.5 2.5 0 0 1 4.5 9H6Zm2 0h8V5H8v4Z"/>
      </svg>
      General Health Info
    </button>
  </div>

  <!-- Scoped button colors (prevents global CSS from turning them white) -->
  <style>
    .gh-red{background:linear-gradient(90deg,#f43f5e,#dc2626);color:#fff!important}
    .gh-red:hover{background:linear-gradient(90deg,#fb7185,#ef4444)}
    .gh-gray{background:#f3f4f6;color:#111827!important}
    .gh-gray:hover{background:#e5e7eb}
    .gh-green{background:#22c55e;color:#fff!important}
    .gh-green:hover{filter:brightness(.95)}
    .gh-blue{background:#3b82f6;color:#fff!important}
    .gh-blue:hover{filter:brightness(.95)}
  </style>
</div>
{% endblock %}
