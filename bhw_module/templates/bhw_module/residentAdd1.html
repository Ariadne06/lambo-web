{% extends 'base_bhw.html' %}

{% block content %}
<div class="px-6 py-8 bg-gray-100 min-h-screen">
  <!-- Card -->
  <div class="relative mx-auto max-w-4xl bg-white border border-gray-200 rounded-2xl shadow-sm">
    <!-- Accent strip -->
    <div class="absolute left-0 top-0 h-full w-1 bg-red-700 rounded-l-2xl"></div>

    <!-- Header -->
    <div class="px-6 pt-6">
      <h2 class="text-2xl font-semibold text-red-600">ID or Document Scanning</h2>
      <p class="text-gray-500 text-sm mt-1">Please upload a clear photo or PDF of your ID/document.</p>
    </div>

    <!-- Body -->
    <div class="p-6">
      <!-- Upload zone -->
      <label
        class="block cursor-pointer">
        <div class="flex flex-col items-center justify-center w-full max-w-md h-40 mx-auto border-2 border-dashed border-gray-300 rounded-xl bg-gray-50 hover:bg-gray-100 transition">
          <svg class="w-10 h-10 text-gray-500 mb-2" fill="none" viewBox="0 0 24 24" stroke="currentColor">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                  d="M12 4v12m0-12l-3 3m3-3l3 3M6 16h12" />
          </svg>
          <span class="text-gray-700 font-medium">Click to upload</span>
          <span class="text-xs text-gray-500 mt-1">PNG, JPG, or PDF • up to 10 MB</span>
        </div>
        <input type="file" accept=".png,.jpg,.jpeg,.pdf" class="hidden">
      </label>

      <!-- Optional file note (static for frontend demo) -->
      <div class="max-w-md mx-auto mt-3 text-center text-xs text-gray-500">
        No file selected.
      </div>

      <!-- Actions -->
      <div class="mt-10 flex items-center justify-between">
        <a href="#"
           class="inline-flex items-center justify-center rounded-xl bg-gray-200 px-5 py-2 text-gray-800 text-sm font-medium shadow hover:bg-gray-300">
          Back
        </a>
        <a href="#"
           class="inline-flex items-center justify-center rounded-xl bg-red-600 px-5 py-2 text-white text-sm font-medium shadow hover:bg-red-700">
          Next Page
        </a>
      </div>
    </div>
  </div>
</div>
{% endblock %}
