{% extends 'base_admin.html' %}
{% block title %}Update Information — Personal{% endblock %}

{% block content %}
<div class="px-6 py-6">
  <div class="relative bg-white rounded-2xl border border-gray-200 shadow-sm p-6 max-w-5xl mx-auto">
    <!-- thin red accent -->
    <div class="absolute left-0 top-0 h-full w-1 bg-red-700 rounded-l-2xl"></div>
     <!-- Page Header -->
    <h2 class="text-xl font-semibold text-gray-800 mb-6">Update Information</h2>

    <!-- Step header -->
    <div class="flex items-center gap-10 text-sm font-medium mb-6">
      <div class="flex items-center gap-2">
        <span class="text-red-700">1</span>
        <span class="text-red-700">Personal Data</span>
      </div>
      <div class="flex items-center gap-2 text-gray-400">
        <span>2</span>
        <span>Address</span>
      </div>
    </div>

    <h3 class="text-sm font-semibold text-gray-800 mb-4">Personal Data</h3>

    <!-- Form -->
    <form class="grid grid-cols-1 md:grid-cols-2 gap-x-10 gap-y-4">
      <!-- First Name -->
      <div>
        <label class="block text-sm text-gray-700 mb-1">First Name</label>
        <input type="text" value="Adrianne"
               class="w-full rounded-md border border-gray-300 px-3 py-2 focus:outline-none focus:ring-2 focus:ring-red-600">
      </div>

      <!-- Religion -->
      <div>
        <label class="block text-sm text-gray-700 mb-1">Religion</label>
        <div class="relative">
          <select class="w-full rounded-md border border-gray-300 px-3 py-2 bg-white focus:outline-none focus:ring-2 focus:ring-red-600">
            <option selected>Catholic</option>
            <option>Christian</option>
            <option>Muslim</option>
            <option>Other</option>
          </select>
        </div>
      </div>

      <!-- Middle Name -->
      <div>
        <label class="block text-sm text-gray-700 mb-1">Middle Name</label>
        <input type="text" value="Cabunilas"
               class="w-full rounded-md border border-gray-300 px-3 py-2 focus:outline-none focus:ring-2 focus:ring-red-600">
      </div>

      <!-- Civil Status -->
      <div>
        <label class="block text-sm text-gray-700 mb-1">Civil Status</label>
        <select class="w-full rounded-md border border-gray-300 px-3 py-2 bg-white focus:outline-none focus:ring-2 focus:ring-red-600">
          <option selected>Single</option>
          <option>Married</option>
          <option>Widowed</option>
          <option>Separated</option>
        </select>
      </div>

      <!-- Last Name -->
      <div>
        <label class="block text-sm text-gray-700 mb-1">Last Name</label>
        <input type="text" value="Villarta"
               class="w-full rounded-md border border-gray-300 px-3 py-2 focus:outline-none focus:ring-2 focus:ring-red-600">
      </div>

      <!-- Educational Attainment -->
      <div>
        <label class="block text-sm text-gray-700 mb-1">Educational Attainment</label>
        <select class="w-full rounded-md border border-gray-300 px-3 py-2 bg-white focus:outline-none focus:ring-2 focus:ring-red-600">
          <option>Elementary</option>
          <option>High School</option>
          <option selected>College Graduate</option>
          <option>Post-graduate</option>
        </select>
      </div>

      <!-- Date of Birth -->
      <div>
        <label class="block text-sm text-gray-700 mb-1">Date of Birth</label>
        <div class="relative">
          <input type="text" value="08/31/2020"
                 class="w-full rounded-md border border-gray-300 px-3 py-2 pr-10 focus:outline-none focus:ring-2 focus:ring-red-600">
          <span class="pointer-events-none absolute inset-y-0 right-3 flex items-center text-gray-400">
            <!-- calendar icon -->
            <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4" viewBox="0 0 24 24" fill="currentColor">
              <path d="M7 2a1 1 0 0 0-1 1v1H5a3 3 0 0 0-3 3v11a3 3 0 0 0 3 3h14a3 3 0 0 0 3-3V7a3 3 0 0 0-3-3h-1V3a1 1 0 1 0-2 0v1H8V3a1 1 0 0 0-1-1Zm13 9H4v7a1 1 0 0 0 1 1h14a1 1 0 0 0 1-1v-7Z"/>
            </svg>
          </span>
        </div>
      </div>

      <!-- Resident Status -->
      <div>
        <label class="block text-sm text-gray-700 mb-1">Resident Status</label>
        <select class="w-full rounded-md border border-gray-300 px-3 py-2 bg-white focus:outline-none focus:ring-2 focus:ring-red-600">
          <option selected>Permanent</option>
          <option>Non-Resident</option>
          <option>Temporary</option>
        </select>
      </div>

      <!-- Sex -->
      <div>
        <label class="block text-sm text-gray-700 mb-1">Sex</label>
        <select class="w-full rounded-md border border-gray-300 px-3 py-2 bg-white focus:outline-none focus:ring-2 focus:ring-red-600">
          <option selected>Male</option>
          <option>Female</option>
          <option>Prefer not to say</option>
        </select>
      </div>
    </form>

    <!-- Actions -->
<div class="mt-8 flex items-center justify-between">
  <a href="residentList.html"
     class="inline-flex items-center justify-center rounded-xl bg-red-600 px-5 py-2 text-white text-sm font-medium shadow hover:bg-red-700">
    Cancel
  </a>

  <a href="residentUpdate1.html"
     class="inline-flex items-center justify-center rounded-xl bg-red-600 px-5 py-2 text-white text-sm font-medium shadow hover:bg-red-700">
    Next Page
  </a>
</div>

  </div>
</div>
{% endblock %}
