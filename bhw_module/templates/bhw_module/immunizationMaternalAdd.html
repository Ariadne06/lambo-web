{% extends "base_admin.html" %}
{% block title %}Add Maternal Immunization{% endblock %}

{% block content %}
<div class="px-6 py-8 bg-gradient-to-br from-rose-50 to-white">

  <!-- Page chip -->
  <div class="mb-6">
    <div class="inline-flex items-center gap-2 rounded-2xl px-4 py-1.5 text-white text-sm font-semibold shadow ring-1 ring-black/5"
         style="background-image:linear-gradient(90deg,#ef4444 0%,#dc2626 50%,#b91c1c 100%);">
      <span class="inline-block h-2 w-2 rounded-full bg-white"></span>
      Add Maternal Immunization
    </div>
  </div>

  <!-- Card -->
  <div class="mx-auto max-w-3xl overflow-hidden rounded-2xl border border-gray-200 bg-white shadow-sm">
    <form class="p-6 space-y-6">

      <!-- Vaccine Type -->
      <div>
        <label class="text-[12px] font-semibold text-gray-600">Vaccine Type</label>
        <div class="relative mt-1">
          <select class="w-full appearance-none rounded-lg border border-gray-300 bg-white px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-rose-500">
            <option value="" selected disabled>Select a Vaccine</option>
            <option>TT (Tetanus Toxoid)</option>
            <option>Hepatitis B</option>
            <option>Influenza</option>
            <option>COVID‑19</option>
          </select>
          <span class="pointer-events-none absolute right-3 top-2.5 text-gray-400">
            <!-- chevron -->
            <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4" viewBox="0 0 24 24" fill="currentColor">
              <path d="m12 15 5-5-1.4-1.4L12 12.2 8.4 8.6 7 10l5 5Z"/>
            </svg>
          </span>
        </div>
      </div>

      <!-- Date of Visit -->
      <div>
        <label class="text-[12px] font-semibold text-gray-600">Date of Visit</label>
        <div class="relative mt-1">
          <input type="date"
                 class="w-full rounded-lg border border-gray-300 bg-white px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-rose-500" />
          <span class="pointer-events-none absolute right-3 top-2.5 text-gray-400">
            <!-- calendar -->
            <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4" viewBox="0 0 24 24" fill="currentColor">
              <path d="M7 2h2v2h6V2h2v2h3v18H4V4h3V2Zm12 6H5v12h14V8Z"/>
            </svg>
          </span>
        </div>
      </div>

      <!-- Dose Number -->
      <div>
        <label class="text-[12px] font-semibold text-gray-600">Dose Number</label>
        <div class="relative mt-1">
          <select class="w-full appearance-none rounded-lg border border-gray-300 bg-white px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-rose-500">
            <option value="" selected disabled>Select Dose</option>
            <option>1st Dose</option>
            <option>2nd Dose</option>
            <option>3rd Dose</option>
            <option>4th Dose</option>
            <option>5th Dose</option>
          </select>
          <span class="pointer-events-none absolute right-3 top-2.5 text-gray-400">
            <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4" viewBox="0 0 24 24" fill="currentColor">
              <path d="m12 15 5-5-1.4-1.4L12 12.2 8.4 8.6 7 10l5 5Z"/>
            </svg>
          </span>
        </div>
      </div>

      <!-- Note -->
      <div class="rounded-lg border border-amber-200 bg-amber-50 px-3 py-2 text-[12px] text-amber-800">
        <span class="mr-1">⚠️</span>
        Please review the information before saving. Make sure all fields are complete and accurate.
      </div>

      <!-- Actions -->
      <div class="flex items-center justify-end gap-3 pt-2">
        <a href="#"
           class="btn-gray inline-flex items-center gap-2 rounded-lg px-4 py-2 text-sm font-semibold shadow ring-1 ring-black/5">
          <!-- back -->
          <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4" viewBox="0 0 24 24" fill="currentColor">
            <path d="m11 6-6 6 6 6 1.41-1.41L8.83 13H20v-2H8.83l3.58-3.59L11 6Z"/>
          </svg>
          Cancel
        </a>

        <button type="button"
                class="btn-red inline-flex items-center gap-2 rounded-lg px-5 py-2 text-sm font-semibold shadow">
          <!-- save -->
          <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4" viewBox="0 0 24 24" fill="currentColor">
            <path d="M17 3H5a2 2 0 0 0-2 2v14l5-2 5 2 5-2 5 2V7l-6-4Z"/>
          </svg>
          Save
        </button>
      </div>
    </form>
  </div>
</div>

<!-- Local button color guards so they never appear white -->
<style>
  .btn-red{
    background:linear-gradient(90deg,#f43f5e,#dc2626)!important;
    color:#fff!important;
  }
  .btn-red:hover{filter:brightness(.95)}
  .btn-gray{
    background:#f3f4f6!important;
    color:#111827!important;
  }
  .btn-gray:hover{background:#e5e7eb!important}
</style>
{% endblock %}
