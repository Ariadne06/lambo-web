{% extends "base_admin.html" %}
{% block title %}Resident Health Profile{% endblock %}

{% block content %}
<div class="px-6 py-6 bg-gradient-to-br from-rose-50 to-white">

  <!-- Header chip -->
  <div class="mb-6 flex items-center justify-between">
    <div class="inline-flex items-center gap-2 rounded-2xl px-4 py-1.5 text-white text-sm font-semibold shadow ring-1 ring-black/5"
         style="background-image:linear-gradient(90deg,#ef4444 0%,#dc2626 50%,#b91c1c 100%);">
      <span class="inline-block h-2 w-2 rounded-full bg-white"></span>
      Resident Health Profile
    </div>

    <!-- Quick ID pill -->
    <div class="hidden sm:flex items-center gap-2 rounded-full bg-white px-3 py-1 text-[12px] font-semibold text-gray-700 shadow ring-1 ring-gray-200">
      <svg xmlns="http://www.w3.org/2000/svg" class="h-3.5 w-3.5 text-rose-600" viewBox="0 0 24 24" fill="currentColor"><path d="M12 2 4 5v6c0 5 3.4 9.4 8 11 4.6-1.6 8-6 8-11V5l-8-3Zm0 10a3 3 0 1 1 0-6 3 3 0 0 1 0 6Z"/></svg>
      PhilHealth #: <span class="ml-1 text-gray-900">000000</span>
    </div>
  </div>

  <!-- Card -->
  <div class="mx-auto max-w-5xl overflow-hidden rounded-2xl border border-gray-200 bg-white shadow-sm">

    <!-- Top: avatar + name & membership -->
    <div class="grid grid-cols-1 gap-6 p-6 md:grid-cols-3">
     <!-- Avatar -->
<div class="flex items-center justify-center">
  <div class="relative h-44 w-44 rounded-full overflow-hidden ring-4 ring-white shadow-inner bg-gray-100 flex items-center justify-center">
    
    <!-- If image loads -->
    <img src="{{ avatar_url }}" alt="Resident photo"
         class="h-full w-full object-cover object-center"
         onerror="this.classList.add('hidden'); this.parentNode.querySelector('.avatar-fallback').classList.remove('hidden');" />

    <!-- Fallback icon -->
    <div class="avatar-fallback hidden absolute inset-0 flex items-center justify-center">
      <svg xmlns="http://www.w3.org/2000/svg"
           class="h-20 w-20 text-gray-400" viewBox="0 0 24 24" fill="currentColor">
        <path d="M12 12a5 5 0 1 0-5-5 5 5 0 0 0 5 5Zm0 2c-4.42 0-8 2.24-8 5v1h16v-1c0-2.76-3.58-5-8-5Z"/>
      </svg>
    </div>
  </div>
</div>




      <!-- Name + quick tags -->
      <div class="md:col-span-2 grid grid-cols-1 gap-4">
        <div>
          <label class="text-[11px] font-semibold text-gray-500">Full Name</label>
          <div class="mt-1 flex items-center gap-2 rounded-xl border border-gray-200 bg-gray-50 px-3 py-2 text-sm">
            <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4 text-gray-400" viewBox="0 0 24 24" fill="currentColor">
              <path d="M12 12a5 5 0 1 0-5-5 5 5 0 0 0 5 5Zm0 2c-4.42 0-8 2.24-8 5v1h16v-1c0-2.76-3.58-5-8-5Z"/>
            </svg>
            <input value="Adrianne Villarta" class="w-full bg-transparent outline-none" readonly>
          </div>
        </div>

        <div class="grid grid-cols-1 gap-4 sm:grid-cols-2">
          <div>
            <label class="text-[11px] font-semibold text-gray-500">Membership Type</label>
            <div class="mt-1 inline-flex items-center gap-2 rounded-xl border border-rose-200 bg-rose-50 px-3 py-2 text-[13px] font-semibold text-rose-700">
              <span class="inline-block h-2 w-2 rounded-full bg-rose-600"></span> Non‑Member
            </div>
          </div>
          <div>
            <label class="text-[11px] font-semibold text-gray-500">FP Use</label>
            <div class="mt-1 inline-flex items-center gap-2 rounded-xl border border-emerald-200 bg-emerald-50 px-3 py-2 text-[13px] font-semibold text-emerald-700">
              <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4" viewBox="0 0 24 24" fill="currentColor"><path d="M9 16.17 4.83 12 3.41 13.41 9 19l12-12L19.59 5.59 9 16.17Z"/></svg>
              Yes
            </div>
          </div>
        </div>
      </div>
    </div>

    <div class="h-px w-full bg-gray-100"></div>

    <!-- Body -->
    <div class="grid grid-cols-1 gap-6 p-6 md:grid-cols-2">

      <!-- Lifestyle -->
      <section class="space-y-4">
        <h3 class="flex items-center gap-2 text-sm font-semibold text-gray-800">
          <span class="h-1.5 w-1.5 rounded-full bg-rose-600"></span> Lifestyle & History
        </h3>

        <div>
          <label class="text-[11px] font-semibold text-gray-500">Medical History</label>
          <input value="Diabetes" class="mt-1 w-full rounded-lg border border-gray-200 bg-gray-50 px-3 py-2 text-sm" readonly>
        </div>

        <div class="grid grid-cols-2 gap-4">
          <div>
            <label class="text-[11px] font-semibold text-gray-500">Smoker</label>
            <input value="Yes" class="mt-1 w-full rounded-lg border border-gray-200 bg-gray-50 px-3 py-2 text-sm" readonly>
          </div>
          <div>
            <label class="text-[11px] font-semibold text-gray-500">Alcohol Drinker</label>
            <input value="Yes" class="mt-1 w-full rounded-lg border border-gray-200 bg-gray-50 px-3 py-2 text-sm" readonly>
          </div>
        </div>

        <div>
          <label class="text-[11px] font-semibold text-gray-500">Sexually Active</label>
          <input value="No" class="mt-1 w-full rounded-lg border border-gray-200 bg-gray-50 px-3 py-2 text-sm" readonly>
        </div>

        <div>
          <label class="text-[11px] font-semibold text-gray-500">Last Menstrual Period</label>
          <div class="relative mt-1">
            <input value="Select Date" class="w-full rounded-lg border border-gray-200 bg-gray-50 px-3 py-2 text-sm" readonly>
            <span class="pointer-events-none absolute right-3 top-2.5 text-gray-400">
              <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4" viewBox="0 0 24 24" fill="currentColor"><path d="M7 2h2v2h6V2h2v2h3v18H4V4h3V2Zm12 6H5v12h14V8Z"/></svg>
            </span>
          </div>
        </div>

        <div>
          <label class="text-[11px] font-semibold text-gray-500">Age of Menarche</label>
          <input value="Enter Age" class="mt-1 w-full rounded-lg border border-gray-200 bg-gray-50 px-3 py-2 text-sm" readonly>
        </div>
      </section>

      <!-- Clinical -->
      <section class="space-y-4">
        <h3 class="flex items-center gap-2 text-sm font-semibold text-gray-800">
          <span class="h-1.5 w-1.5 rounded-full bg-rose-600"></span> Clinical & Risk Group
        </h3>

        <div>
          <label class="text-[11px] font-semibold text-gray-500">Education Attainment</label>
          <input value="College Degree" class="mt-1 w-full rounded-lg border border-gray-200 bg-gray-50 px-3 py-2 text-sm" readonly>
        </div>

        <div>
          <label class="text-[11px] font-semibold text-gray-500">Classification by Age / Risk</label>
          <div class="mt-1 grid grid-cols-3 gap-3">
            <input value="25" class="rounded-lg border border-gray-200 bg-gray-50 px-3 py-2 text-sm" readonly>
            <input value="2nd Quarter" class="rounded-lg border border-gray-200 bg-gray-50 px-3 py-2 text-sm" readonly>
            <input value="AB" class="rounded-lg border border-gray-200 bg-gray-50 px-3 py-2 text-sm" readonly>
          </div>
        </div>

        <div>
          <label class="text-[11px] font-semibold text-gray-500">Remarks</label>
          <div class="mt-1 grid grid-cols-2 gap-3">
            <div class="flex items-center gap-2 rounded-lg border border-emerald-200 bg-emerald-50 px-3 py-2 text-sm font-medium text-emerald-700">
              <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4" viewBox="0 0 24 24" fill="currentColor"><path d="M12 2 4 5v6c0 5 3.4 9.4 8 11 4.6-1.6 8-6 8-11V5l-8-3Zm-1 14-4-4 1.4-1.4L11 12.2l5.6-5.6L18 8l-7 8Z"/></svg>
              Vaccinated
            </div>
            <div class="flex items-center gap-2 rounded-lg border border-gray-200 bg-gray-50 px-3 py-2 text-sm text-gray-700">
              <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4" viewBox="0 0 24 24" fill="currentColor"><path d="M5 11h14v2H5z"/></svg>
              None
            </div>
          </div>
        </div>
      </section>
    </div>
<!-- Footer actions -->
<div class="border-t bg-gray-50 px-4 py-3">
  <a href="#"
     class="btn-back inline-flex items-center gap-2 rounded-lg px-4 py-2 text-sm font-semibold shadow ring-1 ring-black/5">
    <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4"
         viewBox="0 0 24 24" fill="currentColor">
      <path d="m11 6-6 6 6 6 1.41-1.41L8.83 13H20v-2H8.83l3.58-3.59L11 6Z"/>
    </svg>
    Back
  </a>
</div>

<!-- Local styles to guarantee the back button is never white -->
<style>
  .btn-back{
    background:#f3f4f6;            /* gray-100 */
    color:#111827 !important;       /* gray-900 */
  }
  .btn-back:hover{
    background:#e5e7eb;             /* gray-200 */
  }
</style>

  </div>
</div>

<!-- Local styles to keep buttons from turning white if a global CSS overrides anchors -->
<style>
  .gh-red{background:linear-gradient(90deg,#f43f5e,#dc2626);color:#fff!important}
  .gh-red:hover{background:linear-gradient(90deg,#fb7185,#ef4444)}
  .gh-blue{background:#2563eb;color:#fff!important}
  .gh-blue:hover{filter:brightness(.95)}
  .gh-gray{background:#f3f4f6;color:#111827!important}
  .gh-gray:hover{background:#e5e7eb}
</style>
{% endblock %}
