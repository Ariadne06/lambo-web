{% extends "base_admin.html" %}
{% block content %}
<!-- Font Awesome (icons) -->
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"/>

<div class="min-h-screen bg-gray-100 p-6">

  <!-- Header + Actions -->
  <div class="flex items-center justify-between mb-5">
    <h1 class="text-2xl font-bold text-red-700 flex items-center gap-2">
      <i class="fa-solid fa-pills"></i> Child Supplements Record
    </h1>

    <!-- Actions (match Immunization styles) -->
    <div class="flex items-center gap-3">
      <!-- Add Supplements (same gradient + left icon style) -->
      <button
        class="inline-flex items-center gap-2 rounded-xl px-4 py-2 text-sm font-semibold text-white shadow-md ring-1 ring-black/5 hover:opacity-90 transition"
        style="background-image:linear-gradient(90deg,#ef4444 0%,#dc2626 100%);">
        <i class="fa-solid fa-capsules"></i>
        Add Supplements
      </button>
    </div>
  </div>

  <!-- Search (optional – remove if you don’t need it) -->
  <!--
  <div class="max-w-md mb-4">
    <div class="relative">
      <input
        type="text"
        placeholder="Search supplement..."
        class="w-full rounded-lg border border-gray-300 pl-10 pr-3 py-2 text-sm focus:ring-2 focus:ring-red-400 focus:outline-none">
      <i class="fa-solid fa-magnifying-glass absolute left-3 top-1/2 -translate-y-1/2 text-gray-400"></i>
    </div>
  </div>
  -->

  <!-- Table Card -->
  <div class="bg-white shadow-lg rounded-xl overflow-hidden border border-gray-200">
    <table class="w-full text-sm text-gray-700">
      <thead class="bg-red-600 text-white">
        <tr>
          <th class="px-6 py-3 text-left"><i class="fa-solid fa-capsules mr-2"></i>Type</th>
          <th class="px-6 py-3 text-center"><i class="fa-solid fa-baby mr-2"></i>Age (mos)</th>
          <th class="px-6 py-3 text-center"><i class="fa-solid fa-calendar-day mr-2"></i>Date</th>
          <th class="px-6 py-3 text-left"><i class="fa-solid fa-user-nurse mr-2"></i>Given By</th>
        </tr>
      </thead>
      <tbody class="[&>tr:nth-child(even)]:bg-gray-50/40">
        <tr class="hover:bg-gray-50">
          <td class="px-6 py-3">Vitamin A</td>
          <td class="px-6 py-3 text-center">4</td>
          <td class="px-6 py-3 text-center">01/02/2020</td>
          <td class="px-6 py-3">Adrianne Villarta</td>
        </tr>
        <tr class="hover:bg-gray-50">
          <td class="px-6 py-3">Vitamin C</td>
          <td class="px-6 py-3 text-center">5</td>
          <td class="px-6 py-3 text-center">01/02/2020</td>
          <td class="px-6 py-3">Adrian Medalla</td>
        </tr>
        <tr class="hover:bg-gray-50">
          <td class="px-6 py-3">Deworming</td>
          <td class="px-6 py-3 text-center">6</td>
          <td class="px-6 py-3 text-center">01/02/2020</td>
          <td class="px-6 py-3">Prescious Bugtai</td>
        </tr>
        <!-- more rows ... -->
      </tbody>
    </table>
  </div>

  <!-- Footer: Back + Pagination -->
  <div class="flex items-center justify-between mt-6">
    <!-- Back button (match Immunization page) -->
    <a href="#"
       class="inline-flex items-center gap-2 rounded-xl px-4 py-2 text-sm font-semibold text-white shadow-md ring-1 ring-black/5 hover:opacity-90 transition"
       style="background-image:linear-gradient(90deg,#ef4444 0%,#dc2626 100%);">
      <i class="fa-solid fa-arrow-left"></i>
      Back
    </a>

    <!-- Pagination -->
    <nav class="flex items-center gap-2 text-sm">
      <button class="px-3 py-1 rounded-md border border-gray-300 bg-white hover:bg-gray-100">1</button>
      <button class="px-3 py-1 rounded-md text-white"
              style="background-image:linear-gradient(90deg,#ef4444 0%,#dc2626 100%);">
        2
      </button>
      <button class="px-3 py-1 rounded-md border border-gray-300 bg-white hover:bg-gray-100">3</button>
      <span class="px-2">…</span>
      <button class="px-3 py-1 rounded-md border border-gray-300 bg-white hover:bg-gray-100">60</button>
    </nav>
  </div>
</div>

{% endblock %}
