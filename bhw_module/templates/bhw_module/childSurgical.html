{% extends 'base_admin.html' %}
{% load static %}

{% block content %}
<div class="p-6">

    <!-- Medical Conditions -->
    <div class="bg-white rounded-2xl shadow-md mb-8 p-6">
        <div class="flex justify-between items-center mb-4 border-b pb-2">
            <h2 class="text-xl font-semibold text-red-700">Medical Conditions</h2>
            <button class="flex items-center bg-red-600 text-white px-4 py-2 rounded-lg shadow hover:bg-red-700 transition">
                <i class="fas fa-notes-medical mr-2"></i>➕ Add Medical Condition
            </button>
        </div>
        <div class="overflow-x-auto">
            <table class="table-auto w-full border rounded-lg">
                <thead class="bg-gray-100 text-gray-700">
                    <tr>
                        <th class="px-4 py-2 text-left">Condition</th>
                        <th class="px-4 py-2 text-left">Notes</th>
                    </tr>
                </thead>
                <tbody>
                    <tr class="border-t hover:bg-gray-50">
                        <td class="px-4 py-2">Asthma</td>
                        <td class="px-4 py-2">Diagnosed 2019</td>
                    </tr>
                    <tr class="border-t hover:bg-gray-50">
                        <td class="px-4 py-2">Allergy</td>
                        <td class="px-4 py-2">Penicillin</td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>

    <!-- Surgical History -->
    <div class="bg-white rounded-2xl shadow-md mb-8 p-6">
        <div class="flex justify-between items-center mb-4 border-b pb-2">
            <h2 class="text-xl font-semibold text-red-700">Surgical History</h2>
            <button class="flex items-center bg-red-600 text-white px-4 py-2 rounded-lg shadow hover:bg-red-700 transition">
                <i class="fas fa-user-md mr-2"></i>➕ Add Surgical History
            </button>
        </div>
        <div class="overflow-x-auto">
            <table class="table-auto w-full border rounded-lg">
                <thead class="bg-gray-100 text-gray-700">
                    <tr>
                        <th class="px-4 py-2 text-left">Procedure</th>
                        <th class="px-4 py-2 text-left">Notes</th>
                    </tr>
                </thead>
                <tbody>
                    <tr class="border-t hover:bg-gray-50">
                        <td class="px-4 py-2">Appendectomy</td>
                        <td class="px-4 py-2">Done in 2018</td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>

    <!-- Back Button -->
    <div class="mt-6">
        <button class="flex items-center px-4 py-2 rounded-lg bg-red-600 text-white hover:bg-red-700 shadow transition">
            <i class="fas fa-arrow-left mr-2"></i> Back
        </button>
    </div>

</div>
{% endblock %}
