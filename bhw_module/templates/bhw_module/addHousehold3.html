{% extends 'base_admin.html' %}
{% block title %}Household Profiling — Respondent{% endblock %}

{% block content %}
<div class="px-6 py-8">
  <div class="relative max-w-5xl mx-auto bg-white rounded-2xl border border-gray-200 shadow-sm p-8">
    <!-- Thin left accent -->
    <div class="absolute left-0 top-0 h-full w-1 bg-red-700 rounded-l-2xl"></div>

    <!-- Step header (current step in red) -->
    <div class="flex items-center gap-10 text-sm font-medium mb-8">
      <div class="flex items-center gap-2 text-gray-400">
        <span>1</span><span>Household Data</span>
      </div>
      <div class="flex items-center gap-2">
        <span class="text-red-700">2</span><span class="text-red-700">Respondent</span>
      </div>
      <div class="flex items-center gap-2 text-gray-400">
        <span>3</span><span>Socio Economic</span>
      </div>
      <div class="flex items-center gap-2 text-gray-400">
        <span>4</span><span>Household Members</span>
      </div>
    </div>

    <h3 class="text-sm font-semibold text-gray-800 mb-4">Name of Respondent</h3>

    <!-- Form -->
    <form class="grid grid-cols-1 md:grid-cols-2 gap-x-12 gap-y-5 text-sm">
      <!-- Left column -->
      <div>
        <label class="block text-gray-700 mb-1">First Name</label>
        <input type="text" placeholder="Enter First Name"
               class="w-full rounded-md border border-gray-300 px-3 py-2 focus:outline-none focus:ring-2 focus:ring-red-600">
      </div>

      <!-- Right column -->
      <div>
        <label class="block text-gray-700 mb-1">Renter (Y/N)</label>
        <select class="w-full rounded-md border border-gray-300 px-3 py-2 bg-white focus:outline-none focus:ring-2 focus:ring-red-600">
          <option value="" selected disabled>Select</option>
          <option>Yes</option>
          <option>No</option>
        </select>
      </div>

      <div>
        <label class="block text-gray-700 mb-1">Middle Name</label>
        <input type="text" placeholder="Enter Middle Name"
               class="w-full rounded-md border border-gray-300 px-3 py-2 focus:outline-none focus:ring-2 focus:ring-red-600">
      </div>

      <div>
        <label class="block text-gray-700 mb-1">If Yes, No. of Months</label>
        <input type="number" min="0" placeholder="Enter No of Months"
               class="w-full rounded-md border border-gray-300 px-3 py-2 focus:outline-none focus:ring-2 focus:ring-red-600">
      </div>

      <div>
        <label class="block text-gray-700 mb-1">Last Name</label>
        <input type="text" placeholder="Enter Last Name"
               class="w-full rounded-md border border-gray-300 px-3 py-2 focus:outline-none focus:ring-2 focus:ring-red-600">
      </div>

      <div>
        <label class="block text-gray-700 mb-1">Relationship to HH Head</label>
        <select class="w-full rounded-md border border-gray-300 px-3 py-2 bg-white focus:outline-none focus:ring-2 focus:ring-red-600">
          <option value="" selected disabled>Select</option>
          <option>Head</option>
          <option>Spouse</option>
          <option>Child</option>
          <option>Parent</option>
          <option>Sibling</option>
          <option>Relative</option>
          <option>Boarder</option>
          <option>Others</option>
        </select>
      </div>
    </form>

    <!-- Actions -->
    <div class="mt-10 flex items-center justify-between">
      <a href="#"
         class="inline-flex items-center justify-center rounded-xl bg-red-600 px-5 py-2 text-white text-sm font-medium shadow hover:bg-red-700">
        Back
      </a>
      <a href="#"
         class="inline-flex items-center justify-center rounded-xl bg-red-600 px-5 py-2 text-white text-sm font-medium shadow hover:bg-red-700">
        Next Page
      </a>
    </div>
  </div>
</div>
{% endblock %}
