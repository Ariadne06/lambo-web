{% extends "base_admin.html" %}
{% block content %}
<!-- Add Immunization – Frontend Only (Tailwind) -->
<div class="p-6 bg-gradient-to-br from-rose-50 to-white min-h-[calc(100vh-3rem)]">

  <!-- Local helpers so colors never get overridden -->
  <style>
    .immx-btn{display:inline-flex;align-items:center;gap:.5rem;padding:.65rem 1rem;border-radius:.75rem;
      font-weight:700;box-shadow:0 8px 22px rgba(0,0,0,.08);white-space:nowrap}
    .immx-primary{background:linear-gradient(90deg,#ef4444,#dc2626) !important;color:#fff !important}
    .immx-primary:hover{filter:brightness(.96)}
    .immx-ghost{background:#fff !important;color:#dc2626 !important;border:2px solid #fecaca !important}
    .immx-ghost:hover{background:#fff5f5 !important}
    .immx-chip{background:linear-gradient(90deg,#ef4444,#dc2626);color:#fff;display:inline-flex;align-items:center;gap:.6rem;
      padding:.55rem 1rem;border-radius:9999px;box-shadow:0 4px 16px rgba(220,38,38,.25)}
    .immx-field{appearance:none}
  </style>

  <!-- Header chip -->
  <div class="flex items-center justify-between mb-6">
    <div class="immx-chip">
      <!-- syringe icon -->
      <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4" viewBox="0 0 24 24" fill="currentColor">
        <path d="M22 2l-2 2-.7-.7-1.6 1.6 1.4 1.4L18 7.9l-1.4-1.4L13.5 9.6l1.4 1.4-8.5 8.6c-.6.5-1.3.8-2.1.8H2v-2c0-.8.3-1.5.9-2.1l8.6-8.6 1.4 1.4L15.5 7 14 5.6l1.6-1.6L15 3l2-2 1.3 1.3L19.9 1 22 3.1 20.7 4.4 22 5.7 24 3.7 22 2z"/>
      </svg>
      <span class="font-semibold">Add Immunization</span>
    </div>

    <a href="#" class="immx-btn immx-ghost">
      <!-- back icon -->
      <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4" viewBox="0 0 24 24" fill="currentColor">
        <path d="M20 11H7.8l5.6-5.6L12 4 4 12l8 8 1.4-1.4L7.8 13H20z"/>
      </svg>
      Back
    </a>
  </div>

  <!-- Card -->
  <div class="max-w-3xl rounded-2xl border border-gray-200 bg-white shadow-sm">
    <div class="px-6 py-4 border-b bg-gray-50/60 rounded-t-2xl">
      <p class="text-sm font-semibold text-gray-700">Dose Details</p>
    </div>

    <form class="p-6 grid grid-cols-1 gap-6">

      <!-- Vaccine Type -->
      <div class="grid gap-2">
        <label class="text-sm font-medium text-gray-700">Vaccine Type</label>
        <div class="relative">
          <select class="immx-field w-full rounded-lg border border-gray-300 px-4 py-3 text-sm pr-10 focus:outline-none focus:ring-2 focus:ring-red-500">
            <option value="">Select Vaccine</option>
            <option>BCG</option>
            <option>Hepa B</option>
            <option>DPT‑HepB‑HiB</option>
            <option>Oral Polio</option>
            <option>IPV</option>
            <option>MMR</option>
            <option>PCV 13</option>
            <option>Vitamin K</option>
          </select>
          <!-- chevron -->
          <svg xmlns="http://www.w3.org/2000/svg" class="pointer-events-none absolute right-3 top-1/2 -translate-y-1/2 h-4 w-4 text-gray-400" viewBox="0 0 24 24" fill="currentColor">
            <path d="M7 10l5 5 5-5z"/>
          </svg>
        </div>
        <input type="text" placeholder="Input if not listed"
               class="w-full rounded-lg border border-gray-300 px-4 py-3 text-sm focus:outline-none focus:ring-2 focus:ring-red-500" />
      </div>

      <!-- Dose Label -->
      <div class="grid gap-2">
        <label class="text-sm font-medium text-gray-700">Dose Label</label>
        <div class="relative">
          <select class="immx-field w-full rounded-lg border border-gray-300 px-4 py-3 text-sm pr-10 focus:outline-none focus:ring-2 focus:ring-red-500">
            <option value="">Select Dose</option>
            <option>At Birth</option>
            <option>1st Dose</option>
            <option>2nd Dose</option>
            <option>3rd Dose</option>
            <option>Booster</option>
          </select>
          <svg xmlns="http://www.w3.org/2000/svg" class="pointer-events-none absolute right-3 top-1/2 -translate-y-1/2 h-4 w-4 text-gray-400" viewBox="0 0 24 24" fill="currentColor">
            <path d="M7 10l5 5 5-5z"/>
          </svg>
        </div>
      </div>

      <!-- Date Given -->
      <div class="grid gap-2">
        <label class="text-sm font-medium text-gray-700">Date Given</label>
        <input type="date" class="w-full rounded-lg border border-gray-300 px-4 py-3 text-sm focus:outline-none focus:ring-2 focus:ring-red-500" />
      </div>

      <!-- Given By -->
      <div class="grid gap-2">
        <label class="text-sm font-medium text-gray-700">Given By</label>
        <input type="text" placeholder="Input name of nurse / midwife"
               class="w-full rounded-lg border border-gray-300 px-4 py-3 text-sm focus:outline-none focus:ring-2 focus:ring-red-500" />
      </div>

      <!-- Note -->
      <div class="rounded-xl border border-amber-200 bg-amber-50 text-amber-800 px-4 py-3 text-xs flex items-start gap-2">
        <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4 mt-0.5" viewBox="0 0 24 24" fill="currentColor">
          <path d="M12 2 1 21h22L12 2Zm1 15h-2v-2h2v2Zm0-4h-2V9h2v4Z"/>
        </svg>
        <p><b>Note:</b> Please review the information before saving. Make sure all fields are complete and accurate.</p>
      </div>

      <!-- Actions -->
      <div class="flex items-center justify-end gap-3 pt-2">
        <button type="button" class="immx-btn immx-ghost">
          <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4" viewBox="0 0 24 24" fill="currentColor">
            <path d="M6 6h12v12H6z" opacity=".15"/><path d="M7 7h10v10H7z"/>
          </svg>
        Cancel
        </button>

        <button type="button" class="immx-btn immx-primary">
          <!-- check icon -->
          <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4" viewBox="0 0 24 24" fill="currentColor">
            <path d="M9 16.2 4.8 12l-1.4 1.4L9 19 21 7l-1.4-1.4z"/>
          </svg>
          Save Dose
        </button>
      </div>
    </form>
  </div>
</div>

{% endblock %}
