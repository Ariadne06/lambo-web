{% extends "base_bhw.html" %}

{% block content %}
<div class="px-6 py-10 bg-gradient-to-br from-rose-50 to-white">
  <!-- Harden button colors locally -->
  <style>
    .btn-primary{
      background:linear-gradient(90deg,#f43f5e,#dc2626) !important;
      color:#fff !important;
      border-radius:.5rem;font-weight:700;
      box-shadow:0 6px 18px rgba(220,38,38,.25);
    }
    .btn-primary:hover{background:linear-gradient(90deg,#fb7185,#ef4444) !important; filter:brightness(.98)}
    .btn-ghost{background:#f3f4f6 !important;color:#374151 !important;border-radius:.5rem;font-weight:700}
    .btn-ghost:hover{background:#e5e7eb !important}
  </style>

  <!-- Height-capped card with comfy outside spacing -->
  <div class="relative mx-auto my-6 max-w-6xl rounded-2xl border border-gray-200 bg-white shadow-sm overflow-hidden
              max-h-[calc(100vh-6rem)] flex flex-col">

    <!-- Accent rail -->
    <div class="absolute left-0 top-0 h-full w-1 bg-red-600 rounded-l-2xl"></div>

    <!-- Sticky header -->
    <div class="sticky top-0 z-10 border-b bg-white/95 backdrop-blur px-6 py-5">
      <div class="flex items-start justify-between">
        <div>
          <div class="flex items-center gap-3">
            <span class="inline-block h-7 w-1.5 rounded-full bg-red-600"></span>
            <h1 class="text-2xl font-bold tracking-tight text-gray-900">Add Child Health Record</h1>
          </div>
          <p class="mt-1 text-sm text-gray-500">Step 2 of 3 • Health information</p>
        </div>

      </div>
    </div>

    <!-- Body (scrolls) -->
    <div class="flex-1 overflow-auto px-6 py-6">
      <form id="childForm2" method="post" action="{% url 'bhw_module:addchild3' %}" class="space-y-8">
        {% csrf_token %}

        <div class="grid grid-cols-1 gap-8 md:grid-cols-2">
          <!-- LEFT: Personal recap fields -->
          <div class="rounded-2xl border border-gray-200 p-5 shadow-sm">
            <p class="mb-4 text-sm font-semibold text-gray-900">Child Health Record</p>

            <div class="space-y-4">
              <div>
                <label class="block text-sm text-gray-600 mb-1">Child Full Name</label>
                <input id="child_name" name="child_name" type="text" readonly
                       class="w-full rounded-lg border border-gray-300 px-3 py-2 bg-gray-50 cursor-not-allowed">
              </div>

              <div>
                <label class="block text-sm text-gray-600 mb-1">Mother’s Full Name</label>
                <input id="mother_name" name="mother_name" type="text" readonly
                       class="w-full rounded-lg border border-gray-300 px-3 py-2 bg-gray-50 cursor-not-allowed">
              </div>

              <div>
                <label class="block text-sm text-gray-600 mb-1">Father’s Full Name</label>
                <input id="father_name" name="father_name" type="text" readonly
                       class="w-full rounded-lg border border-gray-300 px-3 py-2 bg-gray-50 cursor-not-allowed">
              </div>

              <div>
                <label class="block text-sm text-gray-600 mb-1">PhilHealth ID Number</label>
                <input id="philhealth_no" name="philhealth_no" type="text" readonly
                       class="w-full rounded-lg border border-gray-300 px-3 py-2 bg-gray-50 cursor-not-allowed">
              </div>

              <div>
                <label class="block text-sm text-gray-600 mb-1">Phone Number</label>
                <input id="phone_number" name="phone_number" type="text" readonly
                       class="w-full rounded-lg border border-gray-300 px-3 py-2 bg-gray-50 cursor-not-allowed">
              </div>
            </div>
          </div>

          <!-- RIGHT: Health fields -->
          <div class="rounded-2xl border border-gray-200 p-5 shadow-sm">
            <div class="grid grid-cols-1 gap-4">
              <div>
                <label class="block text-sm text-gray-600 mb-1">Sex</label>
                <select id="sex" name="sex" disabled
                        class="w-full rounded-lg border border-gray-300 px-3 py-2 bg-gray-50 cursor-not-allowed">
                  <option value="">Select sex</option>
                  <option value="Male">Male</option>
                  <option value="Female">Female</option>
                </select>
              </div>

              <div>
                <label class="block text-sm text-gray-600 mb-1">Date of Birth</label>
                <input id="dob" name="dob" type="text" readonly
                       class="w-full rounded-lg border border-gray-300 px-3 py-2 bg-gray-50 cursor-not-allowed">
              </div>

              <div>
                <label class="block text-sm text-gray-600 mb-1">Time of Birth</label>
                <input id="time_of_birth" name="time_of_birth" type="time" required
                       class="w-full rounded-lg border border-gray-300 px-3 py-2 focus:outline-none focus:ring-2 focus:ring-red-500">
              </div>

              <div>
                <label class="block text-sm text-gray-600 mb-1">Birth Weight (Kg)</label>
                <input id="birth_weight" name="birth_weight" type="number" step="0.01" required placeholder="Input Birth Weight"
                       class="w-full rounded-lg border border-gray-300 px-3 py-2 focus:outline-none focus:ring-2 focus:ring-red-500">
              </div>

              <div>
                <label class="block text-sm text-gray-600 mb-1">Birth Height (Cm)</label>
                <input id="birth_height" name="birth_height" type="number" step="0.1" required placeholder="Input Birth Height"
                       class="w-full rounded-lg border border-gray-300 px-3 py-2 focus:outline-none focus:ring-2 focus:ring-red-500">
              </div>

              <div>
                <label class="block text-sm text-gray-600 mb-1">Place of Delivery</label>
                <input id="place_of_delivery" name="place_of_delivery" type="text" required placeholder="Input Place of Delivery"
                       class="w-full rounded-lg border border-gray-300 px-3 py-2 focus:outline-none focus:ring-2 focus:ring-red-500">
              </div>
            </div>
          </div>
        </div>

        <!-- Hidden fields for IDs -->
        <input type="hidden" id="child_id" name="child_id">
        <input type="hidden" id="mother_id" name="mother_id">
        <input type="hidden" id="father_id" name="father_id">
      </form>
    </div>

    <!-- Footer actions (outside scrollable area) -->
    <div class="border-t bg-white px-6 py-4">
      <div class="flex items-center justify-between">
        <a href="{% url 'bhw_module:addchild1' %}" class="btn-ghost inline-flex h-10 items-center gap-2 px-4 text-sm">← Back</a>
        <button type="submit" form="childForm2" class="btn-primary inline-flex h-10 items-center gap-2 px-5 text-sm">Next →</button>
      </div>
    </div>
  </div>
</div>

<script>
(function() {

  
  // Completely disable silent logout
  window.fetch = new Proxy(window.fetch, {
    apply: function(target, thisArg, argumentsList) {
      const url = argumentsList[0];
      if (typeof url === 'string' && url.includes('silent_logout')) {
        console.log('Blocked silent logout request');
        return Promise.resolve(new Response('', {status: 204}));
      }
      return target.apply(thisArg, argumentsList);
    }
  });
  
  // Override XMLHttpRequest for silent logout
  const originalOpen = XMLHttpRequest.prototype.open;
  XMLHttpRequest.prototype.open = function(method, url, ...args) {
    if (typeof url === 'string' && url.includes('silent_logout')) {
      console.log('Blocked XMLHttpRequest silent logout');
      return;
    }
    return originalOpen.apply(this, [method, url, ...args]);
  };
  
  // Auto-fill form fields from POST data (server-side rendered values)
  {% if request.method == 'POST' %}
    const postData = {
      child_name: '{{ request.POST.child_name|default:"" }}',
      mother_name: '{{ request.POST.mother_name|default:"" }}',
      father_name: '{{ request.POST.father_name|default:"" }}',
      child_id: '{{ request.POST.child_id|default:"" }}',
      mother_id: '{{ request.POST.mother_id|default:"" }}',
      father_id: '{{ request.POST.father_id|default:"" }}',
      sex: '{{ request.POST.sex|default:"" }}',
      dob: '{{ request.POST.dob|default:"" }}',
      philhealth_no: '{{ request.POST.philhealth_no|default:"" }}',
      phone_number: '{{ request.POST.phone_number|default:"" }}'
    };
    
    if (postData.child_name) document.getElementById('child_name').value = postData.child_name;
    if (postData.mother_name) document.getElementById('mother_name').value = postData.mother_name;
    if (postData.father_name) document.getElementById('father_name').value = postData.father_name;
    if (postData.child_id) document.getElementById('child_id').value = postData.child_id;
    if (postData.mother_id) document.getElementById('mother_id').value = postData.mother_id;
    if (postData.father_id) document.getElementById('father_id').value = postData.father_id;
    if (postData.sex) document.getElementById('sex').value = postData.sex;
    if (postData.dob) document.getElementById('dob').value = postData.dob;
    if (postData.philhealth_no) document.getElementById('philhealth_no').value = postData.philhealth_no;
    if (postData.phone_number) document.getElementById('phone_number').value = postData.phone_number;
  {% endif %}
  
  // Keep session active with multiple methods
  setInterval(function() {
    document.dispatchEvent(new Event('mousemove'));
    document.dispatchEvent(new Event('keydown'));
  }, 10000);
})();
</script>
{% endblock %}
