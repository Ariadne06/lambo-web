{% extends 'base_admin.html' %}
{% block title %}Household Profiling — Household Data{% endblock %}

{% block content %}
<div class="px-6 py-8">
  <div class="relative max-w-5xl mx-auto bg-white rounded-2xl border border-gray-200 shadow-sm p-8">
    <!-- Thin left accent -->
    <div class="absolute left-0 top-0 h-full w-1 bg-red-700 rounded-l-2xl"></div>

    <!-- Step header (current step in red) -->
    <div class="flex items-center gap-10 text-sm font-medium mb-8">
      <div class="flex items-center gap-2">
        <span class="text-red-700">1</span><span class="text-red-700">Household Data</span>
      </div>
      <div class="flex items-center gap-2 text-gray-400">
        <span>2</span><span>Respondent</span>
      </div>
      <div class="flex items-center gap-2 text-gray-400">
        <span>3</span><span>Socio Economic</span>
      </div>
      <div class="flex items-center gap-2 text-gray-400">
        <span>4</span><span>Household Members</span>
      </div>
    </div>

    <h3 class="text-sm font-semibold text-gray-800 mb-4">Household Information</h3>

    <!-- Form -->
    <form class="max-w-xl">
      <div class="space-y-5 text-sm">
        <div>
          <label class="block text-gray-700 mb-1">Sitio/Purok</label>
          <input type="text" placeholder="Enter Sitio/Purok"
                 class="w-full rounded-md border border-gray-300 px-3 py-2 focus:outline-none focus:ring-2 focus:ring-red-600">
        </div>

        <div>
          <label class="block text-gray-700 mb-1">Household Number</label>
          <input type="text" placeholder="Enter Household Number"
                 class="w-full rounded-md border border-gray-300 px-3 py-2 focus:outline-none focus:ring-2 focus:ring-red-600">
        </div>

        <div>
          <label class="block text-gray-700 mb-1">Barangay</label>
          <input type="text" value="Cansaga"
                 class="w-full rounded-md border border-gray-300 px-3 py-2 focus:outline-none focus:ring-2 focus:ring-red-600">
        </div>

        <div>
          <label class="block text-gray-700 mb-1">Family Number</label>
          <input type="text" value="0000"
                 class="w-full rounded-md border border-gray-300 px-3 py-2 focus:outline-none focus:ring-2 focus:ring-red-600">
        </div>
      </div>
    </form>

    <!-- Actions -->
    <div class="mt-10 flex items-center justify-between">
      <a href="#"
         class="inline-flex items-center justify-center rounded-xl bg-red-600 px-5 py-2 text-white text-sm font-medium shadow hover:bg-red-700">
        Back
      </a>
      <a href="#"
         class="inline-flex items-center justify-center rounded-xl bg-red-600 px-5 py-2 text-white text-sm font-medium shadow hover:bg-red-700">
        Next Page
      </a>
    </div>
  </div>
</div>
{% endblock %}
