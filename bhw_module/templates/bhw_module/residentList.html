{% extends "base_admin.html" %}

{% block content %}
<div class="p-6">
    <!-- Header -->
    <div class="flex justify-between items-center mb-6">
        <h1 class="text-2xl font-bold text-red-700">Resident List</h1>
        <button class="bg-red-600 text-white px-4 py-2 rounded-lg shadow hover:bg-red-700 transition">
            + Add Resident
        </button>
    </div>

    <!-- Search & Filters -->
    <div class="flex justify-between items-center mb-4">
        <div class="relative w-1/3">
            <input type="text" placeholder="Search Resident..." 
                   class="w-full border border-gray-300 rounded-lg pl-10 pr-4 py-2 focus:ring-2 focus:ring-red-400 focus:outline-none">
            <svg xmlns="http://www.w3.org/2000/svg" 
                 class="h-5 w-5 text-gray-400 absolute left-3 top-2.5" 
                 fill="none" viewBox="0 0 24 24" stroke="currentColor">
                 <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" 
                       d="M21 21l-4.35-4.35m0 0A7.5 7.5 0 1110.5 3a7.5 7.5 0 016.15 13.65z" />
            </svg>
        </div>
        <button class="flex items-center gap-2 text-gray-600 hover:text-red-600 transition">
            <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" 
                      d="M3 4a1 1 0 011-1h16a1 1 0 011 1v2a1 1 0 01-.293.707L14 13.414V19a1 1 0 01-.447.894l-4 2.5A1 1 0 018 21.5V13.414L3.293 6.707A1 1 0 013 6V4z" />
            </svg>
            Advanced Filters
        </button>
    </div>

    <!-- Table -->
    <div class="bg-white shadow-md rounded-xl overflow-hidden border border-gray-200">
        <table class="min-w-full text-sm text-gray-700">
            <thead class="bg-red-600 text-white">
                <tr>
                    <th class="py-3 px-4 text-left">Resident ID</th>
                    <th class="py-3 px-4 text-left">Full Name</th>
                    <th class="py-3 px-4 text-left">Date of Birth</th>
                    <th class="py-3 px-4 text-left">Sex</th>
                    <th class="py-3 px-4 text-left">Religion</th>
                    <th class="py-3 px-4 text-left">Status</th>
                    <th class="py-3 px-4 text-center">Action</th>
                </tr>
            </thead>
            <tbody>
                <tr class="border-b hover:bg-gray-50">
                    <td class="py-3 px-4">1000</td>
                    <td class="py-3 px-4">Adrianne C. Villarta</td>
                    <td class="py-3 px-4">08/08/2028</td>
                    <td class="py-3 px-4">Male</td>
                    <td class="py-3 px-4">Catholic</td>
                    <td class="py-3 px-4">Single</td>
                    <td style="text-align:center; padding:12px;">
  <button 
    style="background:#109fd3; color:#fff; padding:8px 16px; 
           border-radius:6px; font-weight:600; border:none; 
           cursor:pointer; box-shadow:0 2px 6px rgba(0,0,0,0.2);">
    Update
  </button>
</td>

                </tr>
                <!-- More rows here -->
            </tbody>
        </table>
    </div>

    <!-- Pagination -->
    <div class="flex justify-center mt-6">
        <nav class="flex items-center space-x-2 text-sm">
            <a href="#" class="px-3 py-1 border rounded-md hover:bg-gray-200">1</a>
            <a href="#" class="px-3 py-1 border rounded-md hover:bg-gray-200">2</a>
            <a href="#" class="px-3 py-1 border rounded-md hover:bg-gray-200">3</a>
            <span class="px-3 py-1">...</span>
            <a href="#" class="px-3 py-1 border rounded-md hover:bg-gray-200">60</a>
        </nav>
    </div>
</div>
{% endblock %}
