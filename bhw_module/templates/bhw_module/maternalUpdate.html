{% extends "base_admin.html" %}
{% block title %}Edit Maternal Health Record{% endblock %}

{% block content %}

<div class="px-6 py-6 bg-gradient-to-br from-rose-50 to-white"> <!-- Header --> <div class="mb-6 flex items-center justify-between"> <div class="inline-flex items-center gap-2 rounded-2xl px-4 py-1.5 text-white text-sm font-semibold shadow ring-1 ring-black/5" style="background-image:linear-gradient(90deg,#ef4444 0%,#dc2626 50%,#b91c1c 100%);"> <span class="inline-block h-2 w-2 rounded-full bg-white"></span> Maternal Health Record — Edit </div>

</div> <!-- Card --> <div class="mx-auto max-w-3xl overflow-hidden rounded-2xl border border-gray-200 bg-white shadow-sm"> <form class="p-6 space-y-6">
      <!-- NHTS -->
  <div>
    <label class="text-[11px] font-semibold text-gray-500">NHTS Status</label>
    <select class="mt-1 w-full rounded-lg border border-gray-300 bg-white px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-rose-500">
      <option selected>NHTS</option>
      <option>Non‑NHTS</option>
    </select>
  </div>

  <!-- Address -->
  <div>
    <label class="text-[11px] font-semibold text-gray-500">Address</label>
    <div class="relative mt-1">
      <span class="pointer-events-none absolute left-3 top-2.5 text-gray-400">
        <svg class="h-4 w-4" viewBox="0 0 24 24" fill="currentColor"><path d="M12 2C8.1 2 5 5.1 5 9c0 5.2 7 13 7 13s7-7.8 7-13c0-3.9-3.1-7-7-7Zm0 9.5A2.5 2.5 0 1 1 12 6a2.5 2.5 0 0 1 0 5.5Z"/></svg>
      </span>
      <input type="text" value="Purok 3, Cansaga"
             class="w-full rounded-lg border border-gray-300 bg-white pl-9 pr-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-rose-500">
    </div>
  </div>

  <!-- Contact -->
  <div>
    <label class="text-[11px] font-semibold text-gray-500">Contact Number</label>
    <div class="relative mt-1">
      <span class="pointer-events-none absolute left-3 top-2.5 text-gray-400">
        <svg class="h-4 w-4" viewBox="0 0 24 24" fill="currentColor"><path d="M6.6 10.8c1.5 3 3.6 5.1 6.6 6.6l2.2-2.2c.3-.3.8-.4 1.1-.2 1.2.4 2.6.6 3.9.6.6 0 1 .4 1 1V20c0 .6-.4 1-1 1C11.8 21 3 12.2 3 2.5 3 1.9 3.4 1.5 4 1.5H7c.6 0 1 .4 1 1 0 1.4.2 2.7.6 3.9.1.4 0 .8-.3 1.1l-1.7 2.3Z"/></svg>
      </span>
      <input type="tel" value="09672687206"
             class="w-full rounded-lg border border-gray-300 bg-white pl-9 pr-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-rose-500">
    </div>
  </div>

  <!-- Footer actions (sticky inside card) -->
  <div class="sticky bottom-0 -mx-6 mt-2 bg-gradient-to-t from-white to-white/70 px-6 py-4">
    <div class="flex items-center justify-end gap-3">
      <button type="button" class="btn-gray inline-flex items-center gap-2 rounded-lg px-4 py-2 text-sm font-semibold shadow ring-1 ring-black/5">
        <svg class="h-4 w-4" viewBox="0 0 24 24" fill="currentColor"><path d="M6 18 18 6l-1.4-1.4L4.6 16.6 6 18Zm0 0v4h4l10.6-10.6-4-4L6 18Z"/></svg>
        Cancel
      </button>

      <button type="submit" class="btn-red inline-flex items-center gap-2 rounded-lg px-4 py-2 text-sm font-semibold shadow">
        <svg class="h-4 w-4" viewBox="0 0 24 24" fill="currentColor"><path d="M21 7 9 19l-6-6 1.4-1.4L9 16.2 19.6 5.6 21 7Z"/></svg>
        Update
      </button>
    </div>
  </div>

  <!-- small note -->
  <div class="rounded-lg border border-rose-200 bg-rose-50 px-3 py-2 text-xs text-rose-700">
    <span class="font-semibold">Note:</span> Please review the information before saving. Make sure all fields are complete and accurate.
  </div>

</form>
</div> </div> <!-- Local styles to ensure buttons never appear white due to global overrides --> <style> .btn-red{background:linear-gradient(90deg,#f43f5e,#dc2626)!important;color:#fff!important} .btn-red:hover{filter:brightness(.97)} .btn-gray{background:#f3f4f6!important;color:#111827!important} .btn-gray:hover{background:#e5e7eb!important} </style>

{% endblock %}
