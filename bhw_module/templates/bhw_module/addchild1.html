{% extends "base_bhw.html" %}

{% block content %}
<div class="px-6 py-10 bg-gradient-to-br from-rose-50 to-white">
  <!-- Scoped button hardening to defeat global overrides -->
  <style>
    .btn-primary{
      background:linear-gradient(90deg,#f43f5e,#dc2626) !important;
      color:#fff !important;
      box-shadow:0 4px 14px rgba(220,38,38,.25);
      border-radius:.5rem;
      font-weight:600;
    }
    .btn-primary:hover{
      background:linear-gradient(90deg,#fb7185,#ef4444) !important;
      filter:brightness(.98);
    }
    .btn-primary:disabled{
      opacity:.6;
      cursor:not-allowed;
      filter:saturate(.8);
    }
    .btn-ghost{
      background:#f3f4f6 !important; /* gray-100 */
      color:#374151 !important;       /* gray-700 */
      border-radius:.5rem;
      font-weight:600;
      box-shadow:0 2px 8px rgba(0,0,0,.06);
    }
    .btn-ghost:hover{ background:#e5e7eb !important; }
  </style>

  <!-- Height-limited card with outside spacing so it won't hug the edges or overlap the sidebar -->
  <div class="relative mx-auto my-6 max-w-5xl rounded-2xl border border-gray-200 bg-white shadow-sm overflow-hidden
              max-h-[calc(100vh-6rem)]">

    <!-- Accent rail -->
    <div class="absolute left-0 top-0 h-full w-1 bg-red-600 rounded-l-2xl"></div>

    <!-- Header (sticky) -->
    <div class="sticky top-0 z-10 border-b bg-white/95 backdrop-blur px-6 py-5">
      <div class="flex items-start justify-between">
        <!-- Title group -->
        <div>
          <div class="flex items-center gap-3">
            <span class="inline-block h-7 w-1.5 rounded-full bg-red-600"></span>
            <h1 class="text-2xl font-bold tracking-tight text-gray-900">Add Child Record</h1>
          </div>
          <p class="mt-1 text-sm text-gray-500">Step 1 of 3 • Select the child and parents</p>
        </div>

      </div>

      <!-- Live summary (auto-fills when selections are made) -->
      <div id="summary" class="mt-3 hidden flex-wrap gap-2 text-xs">
        <span class="rounded-full bg-gray-100 px-3 py-1 text-gray-700">👶 Child: <b id="sumChild" class="font-semibold"></b></span>
        <span class="rounded-full bg-gray-100 px-3 py-1 text-gray-700">👩 Mother: <b id="sumMother" class="font-semibold"></b></span>
        <span class="rounded-full bg-gray-100 px-3 py-1 text-gray-700">👨 Father: <b id="sumFather" class="font-semibold"></b></span>
      </div>
    </div>

    <!-- Body (scrolls inside the card) -->
    <div class="h-full overflow-auto px-6 py-6">
      <form id="familyForm" class="space-y-6">

        <div class="grid grid-cols-1 gap-6 md:grid-cols-3">
          <!-- Child -->
          <div class="rounded-2xl border border-gray-200 p-4 shadow-sm">
            <div class="mb-3 flex items-center gap-3">
              <div class="flex h-10 w-10 items-center justify-center rounded-xl bg-rose-50 text-rose-600 text-lg">👶</div>
              <div>
                <p class="text-sm font-semibold text-gray-900">Select Child</p>
                <p class="text-xs text-gray-500">Choose the child record</p>
              </div>
            </div>
            <select id="child" class="w-full rounded-lg border border-gray-300 px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-red-500">
              <option value="">Choose a child...</option>
              <option value="Alex Johnson">C1001 — Alex Johnson</option>
              <option value="Emma Williams">C1002 — Emma Williams</option>
              <option value="Liam Brown">C1003 — Liam Brown</option>
            </select>
          </div>

          <!-- Mother -->
          <div class="rounded-2xl border border-gray-200 p-4 shadow-sm">
            <div class="mb-3 flex items-center gap-3">
              <div class="flex h-10 w-10 items-center justify-center rounded-xl bg-rose-50 text-rose-600 text-lg">👩</div>
              <div>
                <p class="text-sm font-semibold text-gray-900">Select Mother</p>
                <p class="text-xs text-gray-500">Choose the mother</p>
              </div>
            </div>
            <select id="mother" class="w-full rounded-lg border border-gray-300 px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-red-500">
              <option value="">Choose mother...</option>
              <option value="Sarah Johnson">R2001 — Sarah Johnson</option>
              <option value="Jessica Williams">R2002 — Jessica Williams</option>
              <option value="Olivia Brown">R2003 — Olivia Brown</option>
            </select>
          </div>

          <!-- Father -->
          <div class="rounded-2xl border border-gray-200 p-4 shadow-sm">
            <div class="mb-3 flex items-center gap-3">
              <div class="flex h-10 w-10 items-center justify-center rounded-xl bg-rose-50 text-rose-600 text-lg">👨</div>
              <div>
                <p class="text-sm font-semibold text-gray-900">Select Father</p>
                <p class="text-xs text-gray-500">Choose the father</p>
              </div>
            </div>
            <select id="father" class="w-full rounded-lg border border-gray-300 px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-red-500">
              <option value="">Choose father...</option>
              <option value="Michael Johnson">R3001 — Michael Johnson</option>
              <option value="David Williams">R3002 — David Williams</option>
              <option value="Robert Brown">R3003 — Robert Brown</option>
            </select>
          </div>
        </div>

        <!-- Footer (sticky inside card) -->
        <div class="sticky bottom-0 bg-gradient-to-t from-white via-white to-transparent pt-3">
          <div class="flex items-center justify-between rounded-xl border border-gray-200 bg-white px-4 py-3 shadow-sm">
            <a href="#" class="btn-ghost inline-flex h-10 items-center gap-2 px-4 text-sm">
              ← Cancel
            </a>
            <button id="nextBtn" type="submit" disabled
                    class="btn-primary inline-flex h-10 items-center gap-2 px-5 text-sm">
              Next →
            </button>
          </div>
        </div>
      </form>
    </div>
  </div>
</div>

{% endblock %}
