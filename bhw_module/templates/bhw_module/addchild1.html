{% extends "base_bhw.html" %}

{% block content %}
<div class="px-6 py-10 bg-gradient-to-br from-rose-50 to-white">
  <!-- Scoped button hardening to defeat global overrides -->
  <style>
    .btn-primary{
      background:linear-gradient(90deg,#f43f5e,#dc2626) !important;
      color:#fff !important;
      box-shadow:0 4px 14px rgba(220,38,38,.25);
      border-radius:.5rem;
      font-weight:600;
    }
    .btn-primary:hover{
      background:linear-gradient(90deg,#fb7185,#ef4444) !important;
      filter:brightness(.98);
    }
    .btn-primary:disabled{
      opacity:.6;
      cursor:not-allowed;
      filter:saturate(.8);
    }
    .btn-ghost{
      background:#f3f4f6 !important; /* gray-100 */
      color:#374151 !important;       /* gray-700 */
      border-radius:.5rem;
      font-weight:600;
      box-shadow:0 2px 8px rgba(0,0,0,.06);
    }
    .btn-ghost:hover{ background:#e5e7eb !important; }
  </style>

  <!-- Height-limited card with outside spacing so it won't hug the edges or overlap the sidebar -->
  <div class="relative mx-auto my-6 max-w-5xl rounded-2xl border border-gray-200 bg-white shadow-sm overflow-hidden
              max-h-[calc(100vh-6rem)]">

    <!-- Accent rail -->
    <div class="absolute left-0 top-0 h-full w-1 bg-red-600 rounded-l-2xl"></div>

    <!-- Header (sticky) -->
    <div class="sticky top-0 z-10 border-b bg-white/95 backdrop-blur px-6 py-5">
      <div class="flex items-start justify-between">
        <!-- Title group -->
        <div>
          <div class="flex items-center gap-3">
            <span class="inline-block h-7 w-1.5 rounded-full bg-red-600"></span>
            <h1 class="text-2xl font-bold tracking-tight text-gray-900">Add Child Record</h1>
          </div>
          <p class="mt-1 text-sm text-gray-500">Step 1 of 3 • Select the child and parents</p>
        </div>

      </div>

      <!-- Live summary (auto-fills when selections are made) -->
      <div id="summary" class="mt-3 hidden flex-wrap gap-2 text-xs">
        <span class="rounded-full bg-gray-100 px-3 py-1 text-gray-700">👶 Child: <b id="sumChild" class="font-semibold"></b></span>
        <span class="rounded-full bg-gray-100 px-3 py-1 text-gray-700">👩 Mother: <b id="sumMother" class="font-semibold"></b></span>
        <span class="rounded-full bg-gray-100 px-3 py-1 text-gray-700">👨 Father: <b id="sumFather" class="font-semibold"></b></span>
      </div>
    </div>

    <!-- Body (scrolls inside the card) -->
    <div class="h-full overflow-auto px-6 py-6">
      <form id="familyForm" class="space-y-6">
        <div class="grid grid-cols-1 gap-6 md:grid-cols-3">
          <!-- Child -->
          <div class="rounded-2xl border border-gray-200 p-4 shadow-sm">
            <div class="mb-3 flex items-center gap-3">
              <div class="flex h-10 w-10 items-center justify-center rounded-xl bg-rose-50 text-rose-600 text-lg">👶</div>
              <div>
                <p class="text-sm font-semibold text-gray-900">Select Child</p>
                <p class="text-xs text-gray-500">Choose the child record</p>
              </div>
            </div>

            <!-- Family Head (typeahead like Respondent) -->
            <div class="relative">
              <input id="child_name" name="child_name" type="text" required
                    placeholder="Search child by name"
                    autocomplete="off"
                    data-autocomplete="child"
                    data-target-hidden="#child_id"
                    class="mt-1 w-full rounded-xl border-gray-300 shadow-sm focus:border-red-500 focus:ring-red-500">
              <input type="hidden" id="child_id" name="child_id">

              <!-- dropdown -->
              <div class="absolute z-20 mt-1 w-full bg-white border rounded-lg shadow max-h-60 overflow-auto hidden"
                data-autocomplete-list="#child_name">
              </div>
            </div>
          </div>

          <!-- Mother -->
          <div class="rounded-2xl border border-gray-200 p-4 shadow-sm">
            <div class="mb-3 flex items-center gap-3">
              <div class="flex h-10 w-10 items-center justify-center rounded-xl bg-rose-50 text-rose-600 text-lg">👩</div>
              <div>
                <p class="text-sm font-semibold text-gray-900">Mother</p>
                <p class="text-xs text-gray-500">Auto-filled from child record</p>
              </div>
            </div>
            <input id="mother" name="mother" type="text" readonly
                   placeholder="Will be auto-filled when child is selected"
                   class="w-full rounded-lg border border-gray-300 px-3 py-2 text-sm bg-gray-50 cursor-not-allowed">
            <input type="hidden" id="mother_id" name="mother_id">
          </div>

          <!-- Father -->
          <div class="rounded-2xl border border-gray-200 p-4 shadow-sm">
            <div class="mb-3 flex items-center gap-3">
              <div class="flex h-10 w-10 items-center justify-center rounded-xl bg-rose-50 text-rose-600 text-lg">👨</div>
              <div>
                <p class="text-sm font-semibold text-gray-900">Father</p>
                <p class="text-xs text-gray-500">Auto-filled from child record</p>
              </div>
            </div>
            <input id="father" name="father" type="text" readonly
                   placeholder="Will be auto-filled when child is selected"
                   class="w-full rounded-lg border border-gray-300 px-3 py-2 text-sm bg-gray-50 cursor-not-allowed">
            <input type="hidden" id="father_id" name="father_id">
          </div>
        </div>

        <!-- Footer (sticky inside card) -->
        <div class="sticky bottom-0 bg-gradient-to-t from-white via-white to-transparent pt-3">
          <div class="flex items-center justify-between rounded-xl border border-gray-200 bg-white px-4 py-3 shadow-sm">
            <a href="{% url 'bhw_module:childList' %}" class="btn-ghost inline-flex h-10 items-center gap-2 px-4 text-sm">
              ← Cancel
            </a>
            <button id="nextBtn" type="submit" disabled
                    class="btn-primary inline-flex h-10 items-center gap-2 px-5 text-sm">
              Next →
            </button>
          </div>
        </div>
      </form>
    </div>
  </div>
</div>

<script>
(function() {
  const childInput = document.getElementById('child_name');
  const childIdInput = document.getElementById('child_id');
  const dropdown = document.querySelector('[data-autocomplete-list="#child_name"]');

  const motherInput = document.getElementById('mother');
  const fatherInput = document.getElementById('father');
  const motherIdInput = document.getElementById('mother_id');
  const fatherIdInput = document.getElementById('father_id');
  const sumContainer = document.getElementById('summary');
  const sumChild = document.getElementById('sumChild');
  const sumMother = document.getElementById('sumMother');
  const sumFather = document.getElementById('sumFather');
  const nextBtn = document.getElementById('nextBtn');

  let debounceTimeout = null;

  function updateSummary() {
    const childName = childInput.value.trim();
    const motherText = motherInput.value.trim();
    const fatherText = fatherInput.value.trim();

    sumChild.textContent = childName || 'Not selected';
    sumMother.textContent = motherText || 'Not selected';
    sumFather.textContent = fatherText || 'Not selected';

    if (childName || motherText || fatherText) {
      sumContainer.classList.remove('hidden');
      sumContainer.classList.add('flex');
    } else {
      sumContainer.classList.add('hidden');
      sumContainer.classList.remove('flex');
    }
  }

  function updateNextButton() {
    const valid = !!childIdInput.value && !!motherIdInput.value && !!fatherIdInput.value;
    nextBtn.disabled = !valid;
  }

  function clearDropdown() {
    dropdown.innerHTML = '';
    dropdown.classList.add('hidden');
  }

  childInput.addEventListener('input', function() {
    const q = this.value.trim();
    childIdInput.value = '';

    if (debounceTimeout) clearTimeout(debounceTimeout);

    if (!q) {
      clearDropdown();
      motherInput.value = '';
      motherIdInput.value = '';
      fatherInput.value = '';
      fatherIdInput.value = '';
      updateSummary();
      updateNextButton();
      return;
    }

    debounceTimeout = setTimeout(function() {
      fetch("{% url 'bhw_module:child_search_api' %}?q=" + encodeURIComponent(q), {
        headers: { 'X-Requested-With': 'XMLHttpRequest' }
      })
      .then(response => response.json())
      .then(data => {
        dropdown.innerHTML = '';

        if (!data.results || !data.results.length) {
          clearDropdown();
          return;
        }

        data.results.forEach(item => {
          const btn = document.createElement('button');
          btn.type = 'button';
          btn.className = 'block w-full px-3 py-2 text-left text-sm hover:bg-gray-100';

          const dob = item.dob || '';
          const meta = [
            dob,
            item.sex || ''
          ].filter(Boolean).join(' • ');

          btn.innerHTML = `
            <div class="font-medium text-gray-900">${item.full_name}</div>
            <div class="text-xs text-gray-500">${meta}</div>
          `;

          btn.addEventListener('click', function() {
            childInput.value = item.full_name;
            childIdInput.value = item.child_resident_id;
            
            // Auto-fill mother and father
            motherInput.value = item.mother_full_name || 'Not available';
            motherIdInput.value = item.mother_resident_id || '';
            
            fatherInput.value = item.father_full_name || 'Not available';
            fatherIdInput.value = item.father_resident_id || '';
            
            // Store additional data for next step
            childInput.dataset.sex = item.sex || '';
            childInput.dataset.dob = item.dob || '';
            childInput.dataset.philhealth = item.philhealth_no || '';
            childInput.dataset.phone = item.phone_number || '';
            
            clearDropdown();
            updateSummary();
            updateNextButton();
          });

          dropdown.appendChild(btn);
        });

        dropdown.classList.remove('hidden');
      })
      .catch(err => {
        console.error('child_search_api error:', err);
        clearDropdown();
      });
    }, 250);
  });

  // Close dropdown when clicking outside
  document.addEventListener('click', function(e) {
    if (!dropdown.contains(e.target) && e.target !== childInput) {
      clearDropdown();
    }
  });

  // Clear parent fields when child input is cleared
  childInput.addEventListener('input', function() {
    if (!this.value.trim()) {
      motherInput.value = '';
      motherIdInput.value = '';
      fatherInput.value = '';
      fatherIdInput.value = '';
    }
  });

  // Form submission handler
  document.getElementById('familyForm').addEventListener('submit', function(e) {
    e.preventDefault();
    
    if (!nextBtn.disabled) {
      // Build URL with form data as query parameters
      const params = new URLSearchParams({
        child_id: childIdInput.value,
        child_name: childInput.value,
        mother_id: motherIdInput.value,
        mother_name: motherInput.value,
        father_id: fatherIdInput.value,
        father_name: fatherInput.value,
        sex: childInput.dataset.sex || '',
        dob: childInput.dataset.dob || '',
        philhealth_no: childInput.dataset.philhealth || '',
        phone_number: childInput.dataset.phone || ''
      });
      
      window.location.href = "{% url 'bhw_module:addchild2' %}?" + params.toString();
    }
  });

  // Initial state
  updateSummary();
  updateNextButton();
})();
</script>
{% endblock %}
