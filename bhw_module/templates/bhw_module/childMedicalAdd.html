{% extends "base_admin.html" %}
{% block title %}Add Medical Condition{% endblock %}

{% block content %}
<div class="px-6 py-8 bg-gradient-to-br from-rose-50 to-white min-h-[calc(100vh-3rem)]">

  <!-- Card -->
  <div class="mx-auto w-full max-w-2xl">
    <!-- Header -->
    <div class="mb-4 flex items-center gap-3">
      <span class="inline-flex h-9 w-9 items-center justify-center rounded-xl bg-red-100 text-red-600 shadow-sm">
        <!-- medical icon -->
        <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" viewBox="0 0 24 24" fill="currentColor">
          <path d="M11 2a1 1 0 0 1 2 0v3h3a1 1 0 1 1 0 2h-3v3a1 1 0 1 1-2 0V7H8a1 1 0 1 1 0-2h3V2Z"/>
          <path d="M5 9a4 4 0 0 1 4-4h6a4 4 0 0 1 4 4v7a4 4 0 0 1-4 4H9a4 4 0 0 1-4-4V9Z" opacity=".2"/>
        </svg>
      </span>
      <div>
        <h1 class="text-2xl font-extrabold tracking-tight text-gray-900">Add Medical Condition</h1>
        <p class="text-sm text-gray-500 -mt-0.5">Record a condition and any relevant notes.</p>
      </div>
    </div>

    <div class="rounded-2xl border border-gray-200 bg-white p-6 shadow-sm">
      <form class="space-y-5">
        <!-- Condition Name -->
        <div>
          <label class="mb-1 block text-sm font-medium text-gray-700">Condition Name</label>
          <div class="relative">
            <input type="text" placeholder="e.g., Asthma"
                   class="w-full rounded-lg border border-gray-300 pl-10 pr-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-red-500 focus:border-red-500">
            <span class="pointer-events-none absolute left-3 top-2.5 text-gray-400">
              <!-- badge icon -->
              <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" viewBox="0 0 24 24" fill="currentColor">
                <path d="M12 2 2 7l10 5 10-5-10-5Z"/><path d="M2 17l10 5 10-5" opacity=".35"/><path d="M2 12l10 5 10-5" opacity=".35"/>
              </svg>
            </span>
          </div>
        </div>

        <!-- Notes -->
        <div>
          <label class="mb-1 block text-sm font-medium text-gray-700">Notes</label>
          <div class="relative">
            <textarea rows="4" placeholder="e.g., Diagnosed 2019, managed with inhaler"
                      class="w-full rounded-lg border border-gray-300 pl-10 pr-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-red-500 focus:border-red-500"></textarea>
            <span class="pointer-events-none absolute left-3 top-2.5 text-gray-400">
              <!-- note icon -->
              <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" viewBox="0 0 24 24" fill="currentColor">
                <path d="M5 3a2 2 0 0 0-2 2v14l4-3h11a2 2 0 0 0 2-2V5a2 2 0 0 0-2-2H5Z"/>
              </svg>
            </span>
          </div>
        </div>

        <!-- Note alert -->
        <div class="rounded-xl bg-amber-50 text-amber-900 text-xs px-3 py-2 flex items-start gap-2 border border-amber-200">
          <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4 mt-0.5" viewBox="0 0 24 24" fill="currentColor">
            <path d="M10.29 3.86a2 2 0 0 1 3.42 0l8 13.86A2 2 0 0 1 20 20H4a2 2 0 0 1-1.71-3.28l8-12.86Z"/>
            <path d="M11 10h2v4h-2zm0 6h2v2h-2z" fill="#fff"/>
          </svg>
          <p>Please review the information before saving. Make sure all fields are complete and accurate.</p>
        </div>

        <!-- Actions -->
        <div class="flex items-center justify-end gap-3 pt-2">
          <button type="button" class="btn-secondary inline-flex items-center gap-2 rounded-lg px-4 py-2 text-sm font-semibold shadow">
            <!-- back/cancel icon -->
            <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4" viewBox="0 0 24 24" fill="currentColor">
              <path d="M10.828 12 15.9 6.929 14.485 5.515 8 12l6.485 6.485 1.414-1.414z"/>
            </svg>
            Cancel
          </button>

          <button type="submit" class="btn-primary inline-flex items-center gap-2 rounded-lg px-5 py-2 text-sm font-semibold shadow">
            <!-- save icon -->
            <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4" viewBox="0 0 24 24" fill="currentColor">
              <path d="M5 3h11l3 3v13a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2Zm7 0v6h4V3h-4Z"/>
            </svg>
            Save
          </button>
        </div>
      </form>
    </div>
  </div>

  <!-- Buttons color safety (prevents global CSS from turning them white) -->
  <style>
    .btn-primary{background:linear-gradient(90deg,#f43f5e,#dc2626);color:#fff!important}
    .btn-primary:hover{background:linear-gradient(90deg,#fb7185,#ef4444)}
    .btn-secondary{background:#f3f4f6;color:#111827!important}
    .btn-secondary:hover{background:#e5e7eb}
  </style>
</div>
{% endblock %}
