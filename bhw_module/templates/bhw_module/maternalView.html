{% extends "base_admin.html" %}
{% block title %}Maternal Profile Overview{% endblock %}

{% block content %}

<div class="px-6 py-6 bg-gradient-to-br from-rose-50 to-white"> <!-- Title chip --> <div class="mb-6 flex items-center justify-between"> <div class="inline-flex items-center gap-2 rounded-2xl px-4 py-1.5 text-white text-sm font-semibold shadow ring-1 ring-black/5" style="background-image:linear-gradient(90deg,#ef4444 0%,#dc2626 50%,#b91c1c 100%);"> <span class="inline-block h-2 w-2 rounded-full bg-white"></span> Maternal Profile </div>
<a href="#"
   class="btn-gray inline-flex items-center gap-2 rounded-lg px-4 py-2 text-sm font-semibold shadow ring-1 ring-black/5">
  <!-- back -->
  <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4" viewBox="0 0 24 24" fill="currentColor">
    <path d="m11 6-6 6 6 6 1.41-1.41L8.83 13H20v-2H8.83l3.58-3.59L11 6Z"/>
  </svg>
  Back
</a>
</div> <!-- Card --> <div class="mx-auto max-w-5xl overflow-hidden rounded-2xl border border-gray-200 bg-white shadow-sm"> <form class="p-6 space-y-8">
     <!-- 2-column details -->
  <div class="grid grid-cols-1 gap-6 md:grid-cols-2">
    <!-- Left -->
    <div class="space-y-4">
      <div>
        <label class="text-[11px] font-semibold text-gray-500">Registration Date</label>
        <div class="relative mt-1">
          <span class="pointer-events-none absolute left-3 top-2.5 text-gray-400">
            <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4" viewBox="0 0 24 24" fill="currentColor"><path d="M7 2h2v2h6V2h2v2h3v18H4V4h3V2Zm12 6H5v12h14V8Z"/></svg>
          </span>
          <input type="date" value="2025-01-01"
                 class="w-full rounded-lg border border-gray-300 bg-white pl-9 pr-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-rose-500">
        </div>
      </div>

      <div>
        <label class="text-[11px] font-semibold text-gray-500">Maternal Full Name</label>
        <input type="text" value="Jereza Rodrigo"
               class="mt-1 w-full rounded-lg border border-gray-300 bg-white px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-rose-500">
      </div>

      <div>
        <label class="text-[11px] font-semibold text-gray-500">NHTS Status</label>
        <select class="mt-1 w-full rounded-lg border border-gray-300 bg-white px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-rose-500">
          <option>NHTS</option>
          <option>Non‑NHTS</option>
        </select>
      </div>

      <div>
        <label class="text-[11px] font-semibold text-gray-500">Address</label>
        <input type="text" value="Purok 7 Cansaga"
               class="mt-1 w-full rounded-lg border border-gray-300 bg-white px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-rose-500">
      </div>

      <div>
        <label class="text-[11px] font-semibold text-gray-500">Contact Number</label>
        <input type="tel" value="09672687206"
               class="mt-1 w-full rounded-lg border border-gray-300 bg-white px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-rose-500">
      </div>
    </div>

    <!-- Right -->
    <div class="space-y-4">
      <div>
        <label class="text-[11px] font-semibold text-gray-500">Status</label>
        <select class="mt-1 w-full rounded-lg border border-gray-300 bg-white px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-rose-500">
          <option>Active</option>
          <option>Inactive</option>
        </select>
      </div>

      <div>
        <label class="text-[11px] font-semibold text-gray-500">Recorded By</label>
        <input type="text" value="Cristel Mandave"
               class="mt-1 w-full rounded-lg border border-gray-300 bg-gray-50 px-3 py-2 text-sm" readonly>
      </div>

      <!-- Spacer for visual balance -->
      <div class="hidden md:block h-40"></div>
    </div>
  </div>

  <!-- Sticky tool dock -->
  <div class="sticky bottom-0 left-0 right-0 -mx-6 -mb-6 bg-gradient-to-t from-white to-white/70 px-6 pb-6 pt-4">
    <div class="mx-auto flex w-full max-w-5xl flex-wrap items-center justify-center gap-3">
      <!-- Each button: red pill with icon -->
      <a href="#" class="btn-red">
        <!-- house-medical -->
        <svg viewBox="0 0 24 24" class="h-4 w-4"><path fill="currentColor" d="M12 3 3 10h2v10h6v-6h2v6h6V10h2L12 3Zm1 7h-2V8H9V6h2V4h2v2h2v2h-2v2Z"/></svg>
        Medical/Surgical
      </a>

      <a href="#" class="btn-red">
        <!-- pregnancy/heart line -->
        <svg viewBox="0 0 24 24" class="h-4 w-4"><path fill="currentColor" d="M12 21s-6-3.5-6-9a6 6 0 1 1 12 0c0 5.5-6 9-6 9Zm-1-9 1.5-2 1.5 3 1-1h2"/></svg>
        Obstetrical History
      </a>

      <a href="#" class="btn-red">
        <!-- clipboard check -->
        <svg viewBox="0 0 24 24" class="h-4 w-4"><path fill="currentColor" d="M9 3h6v2h3a2 2 0 0 1 2 2v14H4V7a2 2 0 0 1 2-2h3V3Zm2 6-2 2 1.4 1.4L11 12.8l3.6-3.6L16 10l-5 5-3-3 1.4-1.4L11 12.2 15.6 8 11 9Z"/></svg>
        Check Ups
      </a>

      <a href="#" class="btn-red">
        <!-- syringe -->
        <svg viewBox="0 0 24 24" class="h-4 w-4"><path fill="currentColor" d="m19 3 2 2-3 3 1 1-6 6-2-2 6-6 1 1 1-1-3-3 1-1Zm-9 9-7 7 2 2 7-7-2-2Z"/></svg>
        Immunization
      </a>

      <a href="#" class="btn-red">
        <!-- stethoscope -->
        <svg viewBox="0 0 24 24" class="h-4 w-4"><path fill="currentColor" d="M6 2h2v6a4 4 0 1 0 8 0V2h2v6a6 6 0 0 1-5 5.92V18a2 2 0 0 0 4 0h2a4 4 0 1 1-8 0v-4.08A6 6 0 0 1 6 8V2Z"/></svg>
        Screenings
      </a>

      <a href="#" class="btn-red">
        <!-- beaker -->
        <svg viewBox="0 0 24 24" class="h-4 w-4"><path fill="currentColor" d="M7 2h10v2h-1v4l4.5 8A3 3 0 0 1 17.9 21H6.1A3 3 0 0 1 3.5 16L8 8V4H7V2Zm2 6-4 7h10l-4-7H9Z"/></svg>
        Lab Screening + Iron
      </a>

      <a href="#" class="btn-red">
        <!-- pill -->
        <svg viewBox="0 0 24 24" class="h-4 w-4"><path fill="currentColor" d="M8.5 14.5 14.5 8.5a4 4 0 1 1 5.6 5.6L14.1 20.1a4 4 0 1 1-5.6-5.6Zm1.4 1.4-2.1 2.1a2 2 0 0 0 2.8 2.8l2.1-2.1-2.8-2.8Z"/></svg>
        Supplements
      </a>

      <a href="#" class="btn-red">
        <!-- baby -->
        <svg viewBox="0 0 24 24" class="h-4 w-4"><path fill="currentColor" d="M12 3a3 3 0 0 1 3 3H9a3 3 0 0 1 3-3Zm-5 8a5 5 0 0 1 10 0v6a3 3 0 0 1-3 3h-4a3 3 0 0 1-3-3v-6Zm3 2h6v4a1 1 0 0 1-1 1h-4a1 1 0 0 1-1-1v-4Z"/></svg>
        Delivery Outcome
      </a>

      <a href="#" class="btn-red">
        <!-- female symbol -->
        <svg viewBox="0 0 24 24" class="h-4 w-4"><path fill="currentColor" d="M12 2a6 6 0 1 1 0 12h-1v2h2v2h-2v4h-2v-4H7v-2h2v-2h-1a6 6 0 0 1 0-12Zm0 2a4 4 0 1 0 0 8 4 4 0 0 0 0-8Z"/></svg>
        Postpartum Visit
      </a>
    </div>
  </div>
</form>
</div> </div> <!-- Button color utilities --> <style> .btn-red{ display:inline-flex;align-items:center;gap:.5rem; border-radius:.75rem;padding:.5rem .9rem; background:linear-gradient(90deg,#f43f5e,#dc2626)!important; color:#fff!important;font-weight:700;font-size:.85rem; box-shadow:0 4px 12px rgba(220,38,38,.25); } .btn-red:hover{filter:brightness(.97)} .btn-gray{background:#f3f4f6!important;color:#111827!important} .btn-gray:hover{background:#e5e7eb!important} .btn-red svg{color:#fff} </style>

{% endblock %}
