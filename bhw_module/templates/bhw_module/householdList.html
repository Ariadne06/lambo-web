{% extends 'base_admin.html' %}
{% block content %}

<style>
  /* Scoped, reliable button styles (works even if Tailwind utilities are missing/overridden) */
  .btn-action{
    display:inline-flex; align-items:center; gap:.5rem;
    padding:.5rem 1rem; border-radius:12px; font-weight:600; font-size:14px;
    color:#fff; text-decoration:none; box-shadow:0 6px 16px rgba(0,0,0,.08);
    line-height:1; white-space:nowrap; border:0; cursor:pointer;
  }
  .btn-view{ background:#2563eb; }          /* blue-600 */
  .btn-view:hover{ background:#1d4ed8; }     /* blue-700 */
  .btn-visit{ background:#16a34a; }          /* green-600 */
  .btn-visit:hover{ background:#15803d; }    /* green-700 */
  .btn-add{ background:#f59e0b; }            /* amber-500 */
  .btn-add:hover{ background:#d97706; }      /* amber-600 */
  .btn-action svg{ width:16px; height:16px; fill:currentColor; color:#fff; }
</style>

<div class="p-6 bg-gray-50 min-h-screen">
  <!-- Title -->
  <h1 class="text-xl font-bold text-red-600 mb-4">Household List</h1>

  <!-- Top Controls -->
  <div class="flex justify-between items-center mb-4">
    <button class="bg-red-600 text-white px-4 py-2 rounded-lg shadow-md hover:bg-red-700 transition">
      + Add Household
    </button>

    <div class="flex items-center gap-3">
      <input type="text" placeholder="Search Household"
             class="px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-red-500 focus:outline-none">
      <button class="text-gray-600 hover:text-red-600 text-sm flex items-center gap-1">
        <i class="fas fa-sliders-h"></i> Advanced Filters
      </button>
    </div>
  </div>

  <!-- Table -->
  <div class="bg-white shadow-md rounded-xl overflow-hidden">
    <table class="w-full text-left border-collapse">
      <thead>
        <tr class="bg-gray-100 text-gray-700">
          <th class="py-3 px-4 border">Household ID</th>
          <th class="py-3 px-4 border">Household No.</th>
          <th class="py-3 px-4 border">Household Head</th>
          <th class="py-3 px-4 border text-center">Action</th>
        </tr>
      </thead>
      <tbody class="divide-y divide-gray-200">
        <tr class="hover:bg-gray-50">
          <td class="py-3 px-4 border">1000</td>
          <td class="py-3 px-4 border">0001</td>
          <td class="py-3 px-4 border">Adrianne Villarta</td>
          <td class="py-3 px-4 border text-center">
            <div class="flex justify-center gap-3">
              <!-- View -->
              <a href="#" class="btn-action btn-view" title="View">
                <svg viewBox="0 0 24 24" aria-hidden="true">
                  <path d="M12 5C5 5 1.73 12 1.73 12S5 19 12 19s10.27-7 10.27-7S19 5 12 5Zm0 10a3 3 0 1 1 0-6 3 3 0 0 1 0 6Z"/>
                </svg>
                <span>View</span>
              </a>

              <!-- Visit -->
              <a href="#" class="btn-action btn-visit" title="Household Visit">
                <svg viewBox="0 0 24 24" aria-hidden="true">
                  <path d="M12 3 3 10h2v9h6v-6h2v6h6v-9h2L12 3Z"/>
                </svg>
                <span>Visit</span>
              </a>

            </div>
          </td>
        </tr>
        <!-- more rows ... -->
      </tbody>
    </table>
  </div>

  <!-- Pagination -->
  <div class="flex justify-center mt-4">
    <nav class="flex gap-2">
      <button class="px-3 py-1 border rounded hover:bg-gray-200">1</button>
      <button class="px-3 py-1 border rounded hover:bg-gray-200">2</button>
      <button class="px-3 py-1 border rounded hover:bg-gray-200">3</button>
      <span class="px-3 py-1">...</span>
      <button class="px-3 py-1 border rounded hover:bg-gray-200">60</button>
    </nav>
  </div>
</div>
{% endblock %}
