{% extends 'base_admin.html' %}
{% block title %}Resident — Personal Data{% endblock %}

{% block content %}
<div class="px-6 py-8 bg-gray-100 min-h-screen">
  <!-- Card -->
  <div class="relative mx-auto max-w-5xl bg-white border border-gray-200 rounded-2xl shadow-sm">
    <!-- Accent strip -->
    <div class="absolute left-0 top-0 h-full w-1 bg-red-700 rounded-l-2xl"></div>

    <!-- Step header -->
    <div class="px-6 pt-6">
      <div class="flex items-center gap-8 text-sm font-medium">
        <div class="flex items-center gap-2">
          <span class="text-red-700">1</span>
          <span class="text-red-700">Personal Data</span>
        </div>
        <div class="flex items-center gap-2 text-gray-400">
          <span>2</span><span>Address</span>
        </div>
        <div class="flex items-center gap-2 text-gray-400">
          <span>3</span><span>COMELEC</span>
        </div>
      </div>
    </div>

    <!-- Form -->
    <div class="p-6">
      <h3 class="text-sm font-semibold text-gray-800 mb-4">Personal Data</h3>

      <form class="grid grid-cols-1 md:grid-cols-2 gap-x-10 gap-y-4">
        <!-- Left column -->
        <div>
          <label class="block text-sm text-gray-700 mb-1">First Name</label>
          <input type="text" placeholder="Enter First Name"
                 class="w-full rounded-md border border-gray-300 px-3 py-2 focus:outline-none focus:ring-2 focus:ring-red-600">
        </div>

        <!-- Right column -->
        <div>
          <label class="block text-sm text-gray-700 mb-1">Religion</label>
          <select class="w-full rounded-md border border-gray-300 px-3 py-2 bg-white focus:outline-none focus:ring-2 focus:ring-red-600">
            <option selected disabled>Select Religion</option>
            <option>Catholic</option><option>Christian</option><option>Muslim</option><option>Other</option>
          </select>
        </div>

        <div>
          <label class="block text-sm text-gray-700 mb-1">Middle Name</label>
          <input type="text" placeholder="Enter Middle Name"
                 class="w-full rounded-md border border-gray-300 px-3 py-2 focus:outline-none focus:ring-2 focus:ring-red-600">
        </div>

        <div>
          <label class="block text-sm text-gray-700 mb-1">Civil Status</label>
          <select class="w-full rounded-md border border-gray-300 px-3 py-2 bg-white focus:outline-none focus:ring-2 focus:ring-red-600">
            <option selected disabled>Select Status</option>
            <option>Single</option><option>Married</option><option>Widowed</option><option>Separated</option>
          </select>
        </div>

        <div>
          <label class="block text-sm text-gray-700 mb-1">Last Name</label>
          <input type="text" placeholder="Enter Last Name"
                 class="w-full rounded-md border border-gray-300 px-3 py-2 focus:outline-none focus:ring-2 focus:ring-red-600">
        </div>

        <div>
          <label class="block text-sm text-gray-700 mb-1">Educational Attainment</label>
          <select class="w-full rounded-md border border-gray-300 px-3 py-2 bg-white focus:outline-none focus:ring-2 focus:ring-red-600">
            <option selected disabled>Select Educational Attainment</option>
            <option>Elementary</option><option>High School</option><option>College</option><option>Post‑Graduate</option>
          </select>
        </div>

        <div>
          <label class="block text-sm text-gray-700 mb-1">Date of Birth</label>
          <input type="text" placeholder="MM/DD/YYYY"
                 class="w-full rounded-md border border-gray-300 px-3 py-2 focus:outline-none focus:ring-2 focus:ring-red-600">
        </div>

        <div>
          <label class="block text-sm text-gray-700 mb-1">Resident Status</label>
          <select class="w-full rounded-md border border-gray-300 px-3 py-2 bg-white focus:outline-none focus:ring-2 focus:ring-red-600">
            <option selected disabled>Select Status</option>
            <option>Permanent</option><option>Non‑Resident</option><option>Transient</option>
          </select>
        </div>

        <div>
          <label class="block text-sm text-gray-700 mb-1">Sex</label>
          <select class="w-full rounded-md border border-gray-300 px-3 py-2 bg-white focus:outline-none focus:ring-2 focus:ring-red-600">
            <option selected disabled>Select Sex</option>
            <option>Male</option><option>Female</option><option>Prefer not to say</option>
          </select>
        </div>
      </form>

      <!-- Actions -->
      <!-- Actions -->
    <div class="mt-8 flex items-center justify-between">
      <a href="#"
         class="inline-flex items-center justify-center rounded-xl bg-red-600 px-5 py-2 text-white text-sm font-medium shadow hover:bg-red-700">
        Back Page
      </a>
      <a href="#"
         class="inline-flex items-center justify-center rounded-xl bg-red-600 px-5 py-2 text-white text-sm font-medium shadow hover:bg-red-700">
        Next Page
      </a>
    </div>
    </div>
  </div>
</div>
{% endblock %}
