{% extends "base_admin.html" %}

{% block content %}
<div class="p-6">
  <!-- Header -->
  <h1 class="text-2xl font-extrabold text-red-600 mb-4">Update Child Health Record</h1>

  <!-- Scrollable Card -->
  <div class="bg-white shadow-md rounded-lg border border-gray-200 p-6 max-h-[75vh] overflow-y-auto">
    <form class="grid grid-cols-1 md:grid-cols-2 gap-4">
      
      <!-- Left Side -->
      <div>
        <label class="block text-sm font-medium text-gray-700">Child Full Name</label>
        <input type="text" placeholder="Input Child Name" class="mt-1 w-full rounded-md border-gray-300 shadow-sm text-sm p-2 focus:border-red-500 focus:ring-red-500"/>

        <label class="block text-sm font-medium text-gray-700 mt-3">Mother's Full Name</label>
        <input type="text" placeholder="Input Mother's Name" class="mt-1 w-full rounded-md border-gray-300 shadow-sm text-sm p-2 focus:border-red-500 focus:ring-red-500"/>

        <label class="block text-sm font-medium text-gray-700 mt-3">Father's Full Name</label>
        <input type="text" placeholder="Input Father's Name" class="mt-1 w-full rounded-md border-gray-300 shadow-sm text-sm p-2 focus:border-red-500 focus:ring-red-500"/>

        <label class="block text-sm font-medium text-gray-700 mt-3">PhilHealth ID Number</label>
        <input type="text" placeholder="Enter ID Number" class="mt-1 w-full rounded-md border-gray-300 shadow-sm text-sm p-2 focus:border-red-500 focus:ring-red-500"/>

        <label class="block text-sm font-medium text-gray-700 mt-3">Phone Number</label>
        <input type="text" placeholder="Input Phone Number" class="mt-1 w-full rounded-md border-gray-300 shadow-sm text-sm p-2 focus:border-red-500 focus:ring-red-500"/>

        <label class="block text-sm font-medium text-gray-700 mt-3">Feeding Method</label>
        <div class="flex gap-4 mt-1 text-sm text-gray-700">
          <label><input type="radio" name="feeding" class="mr-1">Breastfeeding</label>
          <label><input type="radio" name="feeding" class="mr-1">Bottle Feeding</label>
          <label><input type="radio" name="feeding" class="mr-1">Mixed</label>
        </div>
      </div>

      <!-- Right Side -->
      <div>
        <label class="block text-sm font-medium text-gray-700">Sex</label>
        <select class="mt-1 w-full rounded-md border-gray-300 shadow-sm text-sm p-2 focus:border-red-500 focus:ring-red-500">
          <option>Select Sex</option>
          <option>Male</option>
          <option>Female</option>
        </select>

        <label class="block text-sm font-medium text-gray-700 mt-3">Date of Birth</label>
        <input type="date" class="mt-1 w-full rounded-md border-gray-300 shadow-sm text-sm p-2 focus:border-red-500 focus:ring-red-500"/>

        <label class="block text-sm font-medium text-gray-700 mt-3">Time of Birth</label>
        <input type="time" class="mt-1 w-full rounded-md border-gray-300 shadow-sm text-sm p-2 focus:border-red-500 focus:ring-red-500"/>

        <label class="block text-sm font-medium text-gray-700 mt-3">Birth Weight (Kg)</label>
        <input type="number" placeholder="Input Birth Weight" class="mt-1 w-full rounded-md border-gray-300 shadow-sm text-sm p-2 focus:border-red-500 focus:ring-red-500"/>

        <label class="block text-sm font-medium text-gray-700 mt-3">Birth Height (Cm)</label>
        <input type="number" placeholder="Input Birth Height" class="mt-1 w-full rounded-md border-gray-300 shadow-sm text-sm p-2 focus:border-red-500 focus:ring-red-500"/>

        <label class="block text-sm font-medium text-gray-700 mt-3">Place of Delivery</label>
        <input type="text" placeholder="Input Place of Delivery" class="mt-1 w-full rounded-md border-gray-300 shadow-sm text-sm p-2 focus:border-red-500 focus:ring-red-500"/>
      </div>

      <!-- Full Width Bottom Fields -->
      <div class="col-span-2 grid grid-cols-1 md:grid-cols-2 gap-4 mt-3">
        <div>
          <label class="block text-sm font-medium text-gray-700">TT Status of Mother</label>
          <input type="text" placeholder="Input Status" class="mt-1 w-full rounded-md border-gray-300 shadow-sm text-sm p-2 focus:border-red-500 focus:ring-red-500"/>
        </div>
        <div>
          <label class="block text-sm font-medium text-gray-700">Date TT Status is Assessed</label>
          <input type="date" class="mt-1 w-full rounded-md border-gray-300 shadow-sm text-sm p-2 focus:border-red-500 focus:ring-red-500"/>
        </div>
      </div>

      <div class="col-span-2 grid grid-cols-1 md:grid-cols-2 gap-4 mt-3">
        <div>
          <label class="block text-sm font-medium text-gray-700">Newborn Screening Status</label>
          <select class="mt-1 w-full rounded-md border-gray-300 shadow-sm text-sm p-2 focus:border-red-500 focus:ring-red-500">
            <option>Select Done/Not Done</option>
            <option>Done</option>
            <option>Not Done</option>
          </select>
        </div>
        <div>
          <label class="block text-sm font-medium text-gray-700">If Done, input Date</label>
          <input type="date" class="mt-1 w-full rounded-md border-gray-300 shadow-sm text-sm p-2 focus:border-red-500 focus:ring-red-500"/>
        </div>
      </div>

      <!-- Buttons -->
      <div class="col-span-2 flex justify-end gap-3 mt-6">
        <button type="button" class="px-5 py-2 rounded-lg bg-gray-200 text-gray-800 font-medium hover:bg-gray-300 transition">Cancel</button>
        <button type="submit" class="px-5 py-2 rounded-lg bg-red-600 text-white font-medium shadow hover:bg-red-700 transition">Update</button>
      </div>
    </form>
  </div>
</div>

{% endblock %}
